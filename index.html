<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Hiring Command Center v2</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet" />
<style>
:root {
  --bg:#090c12; --surface:#111520; --surface2:#181e2e; --surface3:#1f2638;
  --border:#252d42; --border2:#2e3850;
  --accent:#4f8ef7; --accent2:#7c5cfc; --accent3:#2dd4a0;
  --red:#f75c5c; --yellow:#f7c94f; --orange:#f7834f;
  --text:#e4eaf8; --text2:#a8b3cc; --muted:#5c6882;
  --font:'DM Sans',sans-serif; --mono:'DM Mono',monospace;
  --r:10px; --r2:14px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body,#root{height:100%}
body{background:var(--bg);color:var(--text);font-family:var(--font);font-size:14px;line-height:1.5}
::-webkit-scrollbar{width:5px;height:5px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--border2);border-radius:99px}

/* ── AUTH ─────────────────────────────── */
.auth-bg{min-height:100vh;display:flex;align-items:center;justify-content:center;
  background:radial-gradient(ellipse at 30% 20%,rgba(79,142,247,.08) 0%,transparent 60%),
             radial-gradient(ellipse at 70% 80%,rgba(124,92,252,.06) 0%,transparent 60%),var(--bg)}
.auth-card{background:var(--surface);border:1px solid var(--border);border-radius:20px;
  padding:44px;width:100%;max-width:440px;box-shadow:0 24px 80px rgba(0,0,0,.5)}
.auth-brand{font-size:20px;font-weight:700;letter-spacing:-.02em;
  background:linear-gradient(130deg,var(--accent),var(--accent2));
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:4px}
.auth-tagline{color:var(--muted);font-size:13px;margin-bottom:32px}
.auth-tabs{display:flex;gap:6px;margin-bottom:28px;background:var(--surface2);padding:4px;border-radius:10px}
.auth-tab{flex:1;padding:9px;border:none;background:transparent;color:var(--muted);
  border-radius:7px;cursor:pointer;font-family:var(--font);font-size:13px;font-weight:600;transition:all .2s}
.auth-tab.active{background:var(--surface3);color:var(--text);box-shadow:0 2px 8px rgba(0,0,0,.3)}

/* ── FORM ─────────────────────────────── */
.field{margin-bottom:16px}
label{display:block;font-size:11px;font-weight:600;color:var(--muted);text-transform:uppercase;
  letter-spacing:.07em;margin-bottom:6px}
input,select,textarea{width:100%;background:var(--surface2);border:1.5px solid var(--border);
  border-radius:var(--r);padding:10px 13px;color:var(--text);font-family:var(--font);
  font-size:14px;outline:none;transition:border-color .2s}
input:focus,select:focus,textarea:focus{border-color:var(--accent)}
input::placeholder,textarea::placeholder{color:var(--muted)}
textarea{resize:vertical;min-height:90px}
select option{background:var(--surface2)}
.error-msg{color:var(--red);font-size:12px;margin-top:28px;text-align:center}

/* ── BUTTONS ──────────────────────────── */
.btn{display:inline-flex;align-items:center;gap:7px;padding:10px 18px;border-radius:var(--r);
  border:none;font-family:var(--font);font-size:13px;font-weight:600;cursor:pointer;
  transition:all .15s;white-space:nowrap;line-height:1}
.btn-primary{background:var(--accent);color:#fff}
.btn-primary:hover{background:#3a7de8;transform:translateY(-1px)}
.btn-purple{background:var(--accent2);color:#fff}
.btn-purple:hover{background:#6a4de8}
.btn-green{background:var(--accent3);color:#0a1a12}
.btn-green:hover{background:#24b88a}
.btn-secondary{background:var(--surface2);color:var(--text);border:1px solid var(--border)}
.btn-secondary:hover{border-color:var(--accent);color:var(--accent)}
.btn-danger{background:rgba(247,92,92,.15);color:var(--red);border:1px solid rgba(247,92,92,.3)}
.btn-danger:hover{background:var(--red);color:#fff}
.btn-ghost{background:transparent;color:var(--muted);border:1px solid transparent}
.btn-ghost:hover{color:var(--text);background:var(--surface2)}
.btn-sm{padding:6px 13px;font-size:12px}
.btn-xs{padding:4px 10px;font-size:11px}
.btn-full{width:100%;justify-content:center}
.btn:disabled{opacity:.4;cursor:not-allowed;transform:none!important}

/* ── LAYOUT ───────────────────────────── */
.app{display:flex;height:100vh;overflow:hidden}
.sidebar{width:220px;min-width:220px;background:var(--surface);border-right:1px solid var(--border);
  display:flex;flex-direction:column;overflow-y:auto;padding:20px 0}
.sidebar-brand{padding:0 20px 20px;border-bottom:1px solid var(--border);margin-bottom:12px}
.sidebar-brand-name{font-size:16px;font-weight:700;letter-spacing:-.02em;
  background:linear-gradient(130deg,var(--accent),var(--accent2));
  -webkit-background-clip:text;-webkit-text-fill-color:transparent}
.sidebar-org{font-size:11px;color:var(--muted);margin-top:2px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nav-section{padding:0 12px;margin-bottom:4px}
.nav-section-label{font-size:10px;font-weight:700;color:var(--muted);
  text-transform:uppercase;letter-spacing:.1em;padding:8px 8px 4px}
.nav-item{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:8px;
  cursor:pointer;transition:all .15s;color:var(--text2);font-size:13px;font-weight:500;
  text-decoration:none;border:none;background:none;width:100%;font-family:var(--font)}
.nav-item:hover{background:var(--surface2);color:var(--text)}
.nav-item.active{background:rgba(79,142,247,.12);color:var(--accent);font-weight:600}
.nav-item .nav-icon{font-size:16px;width:20px;text-align:center}
.sidebar-footer{margin-top:auto;padding:16px 20px;border-top:1px solid var(--border)}
.user-pill{display:flex;align-items:center;gap:10px}
.user-avatar{width:32px;height:32px;border-radius:50%;background:linear-gradient(135deg,var(--accent),var(--accent2));
  display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;color:#fff;flex-shrink:0}
.user-info{overflow:hidden}
.user-name{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.user-role{font-size:11px;color:var(--muted)}
.main{flex:1;overflow-y:auto;background:var(--bg)}
.page{padding:32px;max-width:1200px}
.page-header{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:28px;gap:16px}
.page-title{font-size:24px;font-weight:700;letter-spacing:-.02em}
.page-sub{color:var(--muted);font-size:13px;margin-top:3px}

/* ── CARDS ────────────────────────────── */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r2);padding:20px}
.card-sm{padding:14px}

/* ── STATS ────────────────────────────── */
.stats-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:14px;margin-bottom:28px}
.stat-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r2);padding:18px}
.stat-label{font-size:11px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.07em;margin-bottom:8px}
.stat-value{font-size:28px;font-weight:700;letter-spacing:-.02em}
.stat-value.blue{color:var(--accent)}
.stat-value.purple{color:var(--accent2)}
.stat-value.green{color:var(--accent3)}
.stat-value.yellow{color:var(--yellow)}

/* ── TABLE ────────────────────────────── */
.table-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse}
th{text-align:left;padding:10px 14px;font-size:11px;font-weight:700;color:var(--muted);
  text-transform:uppercase;letter-spacing:.07em;border-bottom:1px solid var(--border)}
td{padding:12px 14px;border-bottom:1px solid var(--border);font-size:13px;vertical-align:middle}
tr:last-child td{border-bottom:none}
tr:hover td{background:var(--surface2)}

/* ── BADGES ───────────────────────────── */
.badge{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:99px;
  font-size:11px;font-weight:600;letter-spacing:.02em}
.badge-blue{background:rgba(79,142,247,.15);color:var(--accent)}
.badge-purple{background:rgba(124,92,252,.15);color:var(--accent2)}
.badge-green{background:rgba(45,212,160,.15);color:var(--accent3)}
.badge-red{background:rgba(247,92,92,.15);color:var(--red)}
.badge-yellow{background:rgba(247,201,79,.15);color:var(--yellow)}
.badge-gray{background:var(--surface2);color:var(--text2)}

/* ── MODAL ────────────────────────────── */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.7);display:flex;
  align-items:center;justify-content:center;z-index:1000;padding:20px;backdrop-filter:blur(4px)}
.modal{background:var(--surface);border:1px solid var(--border);border-radius:20px;
  width:100%;max-width:580px;max-height:90vh;overflow-y:auto;box-shadow:0 32px 80px rgba(0,0,0,.6)}
.modal-lg{max-width:780px}
.modal-header{padding:24px 28px 0;display:flex;align-items:center;justify-content:space-between}
.modal-title{font-size:18px;font-weight:700;letter-spacing:-.02em}
.modal-body{padding:24px 28px 28px}
.modal-close{background:var(--surface2);border:1px solid var(--border);border-radius:8px;
  color:var(--muted);cursor:pointer;font-size:18px;width:32px;height:32px;
  display:flex;align-items:center;justify-content:center;flex-shrink:0}
.modal-close:hover{color:var(--text)}
.modal-footer{padding:0 28px 28px;display:flex;gap:10px;justify-content:flex-end}

/* ── SCORE BAR ────────────────────────── */
.score-bar-wrap{display:flex;align-items:center;gap:10px}
.score-bar-bg{flex:1;height:6px;background:var(--surface3);border-radius:99px;overflow:hidden}
.score-bar-fill{height:100%;border-radius:99px;transition:width .4s}
.score-num{font-size:13px;font-weight:700;font-family:var(--mono);min-width:36px;text-align:right}

/* ── SCORE BUTTONS (1-5) ──────────────── */
.score-btns{display:flex;gap:5px}
.score-btn{width:36px;height:36px;border-radius:8px;border:1.5px solid var(--border);
  background:var(--surface2);color:var(--muted);font-size:13px;font-weight:600;
  cursor:pointer;transition:all .15s;font-family:var(--font)}
.score-btn:hover{border-color:var(--accent);color:var(--accent)}
.score-btn.active-1{border-color:var(--red);background:rgba(247,92,92,.15);color:var(--red)}
.score-btn.active-2{border-color:var(--orange);background:rgba(247,131,79,.15);color:var(--orange)}
.score-btn.active-3{border-color:var(--yellow);background:rgba(247,201,79,.15);color:var(--yellow)}
.score-btn.active-4{border-color:var(--accent3);background:rgba(45,212,160,.12);color:var(--accent3)}
.score-btn.active-5{border-color:var(--accent);background:rgba(79,142,247,.15);color:var(--accent)}

/* ── PIPELINE ─────────────────────────── */
.pipeline{display:flex;gap:14px;overflow-x:auto;padding-bottom:8px}
.pipeline-col{min-width:200px;background:var(--surface);border:1px solid var(--border);
  border-radius:var(--r2);padding:14px}
.pipeline-col-header{font-size:12px;font-weight:700;text-transform:uppercase;
  letter-spacing:.07em;color:var(--muted);margin-bottom:12px;display:flex;
  align-items:center;justify-content:space-between}
.pipeline-card{background:var(--surface2);border:1px solid var(--border);border-radius:8px;
  padding:12px;margin-bottom:8px;cursor:pointer;transition:all .15s}
.pipeline-card:hover{border-color:var(--accent);transform:translateY(-1px)}
.pipeline-name{font-size:13px;font-weight:600;margin-bottom:4px}
.pipeline-pos{font-size:12px;color:var(--muted)}

/* ── TABS ─────────────────────────────── */
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--border);margin-bottom:24px}
.tab{padding:10px 16px;border:none;background:none;color:var(--muted);
  font-family:var(--font);font-size:13px;font-weight:600;cursor:pointer;
  border-bottom:2px solid transparent;margin-bottom:-1px;transition:all .15s}
.tab:hover{color:var(--text)}
.tab.active{color:var(--accent);border-bottom-color:var(--accent)}

/* ── REQUIREMENT ROW ──────────────────── */
.req-row{display:flex;align-items:center;gap:10px;padding:10px 12px;
  background:var(--surface2);border:1px solid var(--border);border-radius:8px;margin-bottom:6px}
.req-name{flex:1;font-size:13px;font-weight:500}
.req-category{font-size:11px;color:var(--muted)}
.weight-select{background:var(--surface);border:1px solid var(--border);border-radius:6px;
  padding:4px 8px;color:var(--text);font-size:12px;font-weight:600;cursor:pointer}
.must-toggle{width:20px;height:20px;border-radius:4px;border:1.5px solid var(--border);
  background:var(--surface);cursor:pointer;display:flex;align-items:center;justify-content:center;
  font-size:12px;transition:all .2s}
.must-toggle.on{border-color:var(--red);background:rgba(247,92,92,.15);color:var(--red)}

/* ── NOTES TIMER ──────────────────────── */
.timer-display{font-family:var(--mono);font-size:28px;font-weight:500;color:var(--accent);letter-spacing:.05em}
.note-item{display:flex;gap:12px;padding:10px 0;border-bottom:1px solid var(--border)}
.note-time{font-family:var(--mono);font-size:11px;color:var(--accent);min-width:50px;padding-top:2px}
.note-text{font-size:13px;flex:1}
.note-star{color:var(--yellow)}

/* ── SHARE CODE ───────────────────────── */
.share-code-box{background:var(--surface2);border:1px solid var(--border);border-radius:10px;
  padding:16px 20px;display:flex;align-items:center;gap:12px}
.share-code{font-family:var(--mono);font-size:20px;font-weight:500;letter-spacing:.1em;color:var(--accent);flex:1}

/* ── COMPARISON ───────────────────────── */
.compare-table{width:100%;border-collapse:collapse}
.compare-table th,.compare-table td{padding:12px 16px;border:1px solid var(--border);text-align:left}
.compare-table th{background:var(--surface2);font-size:12px;font-weight:700;
  color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.compare-table .req-col{font-size:13px;font-weight:500}
.compare-table .score-cell{text-align:center}

/* ── REF CHECK ────────────────────────── */
.ref-card{background:var(--surface2);border:1px solid var(--border);border-radius:10px;padding:16px;margin-bottom:10px}
.ref-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.ref-name{font-size:14px;font-weight:600}
.ref-meta{font-size:12px;color:var(--muted)}

/* ── EXTERNAL SCORER ──────────────────── */
.external-bg{min-height:100vh;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:20px}
.external-card{background:var(--surface);border:1px solid var(--border);border-radius:20px;padding:36px;width:100%;max-width:620px}

/* ── MISC ─────────────────────────────── */
.empty-state{text-align:center;padding:60px 20px;color:var(--muted)}
.empty-icon{font-size:40px;margin-bottom:12px}
.empty-title{font-size:16px;font-weight:600;color:var(--text2);margin-bottom:6px}
.empty-sub{font-size:13px;margin-bottom:20px}
.divider{border:none;border-top:1px solid var(--border);margin:20px 0}
.flex{display:flex}.flex-col{flex-direction:column}.items-center{align-items:center}
.justify-between{justify-content:space-between}.gap-2{gap:8px}.gap-3{gap:12px}.gap-4{gap:16px}
.mt-1{margin-top:4px}.mt-2{margin-top:8px}.mt-3{margin-top:12px}.mt-4{margin-top:16px}
.mb-2{margin-bottom:8px}.mb-3{margin-bottom:12px}.mb-4{margin-bottom:16px}
.text-muted{color:var(--muted)}.text-sm{font-size:12px}.text-xs{font-size:11px}
.font-bold{font-weight:700}.font-mono{font-family:var(--mono)}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.grid-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:16px}
.chip{display:inline-flex;align-items:center;gap:5px;padding:4px 10px;border-radius:99px;
  background:var(--surface2);border:1px solid var(--border);font-size:12px;color:var(--text2)}
.chip-remove{cursor:pointer;color:var(--muted);font-size:14px;line-height:1}
.chip-remove:hover{color:var(--red)}
.section-title{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;
  color:var(--muted);margin-bottom:12px}
.info-row{display:flex;gap:6px;align-items:baseline;margin-bottom:6px}
.info-key{font-size:12px;color:var(--muted);min-width:120px}
.info-val{font-size:13px;font-weight:500}
.highlight-box{background:rgba(79,142,247,.06);border:1px solid rgba(79,142,247,.2);
  border-radius:10px;padding:14px 16px}
.pulse{animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.5}}

/* ── MOBILE RESPONSIVE ───────────────────────── */
@media (max-width: 768px) {
  /* Full screen app, no split layout */
  .app { flex-direction: column; height: 100vh; overflow: hidden; }

  /* TOP NAV BAR */
  .sidebar {
    width: 100%;
    min-width: unset;
    height: auto;
    max-height: none;
    border-right: none;
    border-bottom: 1px solid var(--border);
    padding: 0;
    flex-direction: column;
    flex-shrink: 0;
    overflow: visible;
  }

  /* Brand row */
  .sidebar-brand {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 10px 16px;
    border-bottom: 1px solid var(--border);
    margin-bottom: 0;
  }
  .sidebar-org { font-size: 10px; }

  /* Nav items: single horizontal scrolling row of icon+label pills */
  .nav-section {
    display: flex;
    flex-direction: row;
    overflow-x: auto;
    padding: 6px 8px;
    gap: 4px;
    -webkit-overflow-scrolling: touch;
    scrollbar-width: none;
    white-space: nowrap;
  }
  .nav-section::-webkit-scrollbar { display: none; }

  .nav-item {
    display: inline-flex;
    flex-direction: column;
    align-items: center;
    gap: 2px;
    padding: 6px 10px;
    border-radius: 10px;
    font-size: 10px;
    font-weight: 600;
    background: transparent;
    color: var(--muted);
    white-space: nowrap;
    min-width: 52px;
    border: none;
    width: auto;
    flex-shrink: 0;
  }
  .nav-item.active {
    background: rgba(79,142,247,.15);
    color: var(--accent);
  }
  .nav-item .nav-icon { font-size: 18px; width: auto; }

  /* Hide sidebar footer - put account in brand bar */
  .sidebar-footer { display: none; }

  /* MAIN CONTENT - scrollable */
  .main {
    flex: 1;
    overflow-y: auto;
    overflow-x: hidden;
    -webkit-overflow-scrolling: touch;
    height: 0; /* forces flex child to scroll */
  }

  .page { padding: 16px 14px; max-width: 100%; }
  .page-header { flex-direction: column; gap: 10px; }
  .page-header .btn { width: 100%; justify-content: center; }
  .page-title { font-size: 22px; }

  /* Grids stack */
  .grid-2, .grid-3 { grid-template-columns: 1fr; gap: 12px; }

  /* Stats 2-up */
  .stats-grid { grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 16px; }
  .stat-card { padding: 12px; }
  .stat-value { font-size: 24px; }
  .stat-label { font-size: 10px; }

  /* Cards */
  .card { padding: 14px; border-radius: 12px; }

  /* Tables - horizontal scroll */
  .table-wrap { overflow-x: auto; -webkit-overflow-scrolling: touch; }
  table { font-size: 12px; min-width: 500px; }
  th, td { padding: 8px 10px; }

  /* Modals - bottom sheet */
  .modal-overlay { align-items: flex-end; padding: 0; }
  .modal {
    max-width: 100%;
    width: 100%;
    border-radius: 20px 20px 0 0;
    position: relative;
    bottom: auto;
    max-height: 88vh;
    overflow-y: auto;
  }
  .modal-lg { max-width: 100%; }
  .modal-header { padding: 16px 18px 0; }
  .modal-body { padding: 14px 18px 18px; }
  .modal-footer { padding: 0 18px 24px; }

  /* Tabs */
  .tabs { overflow-x: auto; flex-wrap: nowrap; gap: 0; }
  .tab { white-space: nowrap; flex-shrink: 0; padding: 10px 14px; font-size: 13px; }

  /* Buttons */
  .btn { font-size: 13px; }
  .btn-sm { padding: 7px 12px; font-size: 12px; }

  /* Score buttons */
  .score-btns { flex-wrap: wrap; gap: 4px; }
  .score-btn { width: 38px; height: 38px; }

  /* Req rows */
  .req-row { flex-wrap: wrap; gap: 6px; }

  /* Hide non-essential columns */
  .hide-mobile { display: none !important; }

  /* Pipeline horizontal scroll */
  .pipeline { overflow-x: auto; }

  /* Auth */
  .auth-bg { align-items: flex-end; padding: 0; }
  .auth-card {
    border-radius: 20px 20px 0 0;
    padding: 28px 20px 36px;
    width: 100%;
    max-width: 100%;

function calcWeightedScore(scores, requirements) {
  let total=0, max=0;
  for (const req of requirements) {
    const s = scores[req.id];
    // Disqualify if Must Have and score is 1 (Does Not Meet) or unscored
    if (req.mustHave && (!s || !s.score || s.score === 1)) return -1;
    if (s && s.score) {
      const w = req.weight || 1;
      total += s.score * w;
      max += 5 * w;
    }
  }
  if (max===0) return null;
  return Math.round((total/max)*100);
}

function isDisqualified(scores, requirements) {
  return calcWeightedScore(scores, requirements) === -1;
}

/* ═══════════════════════════════════════
   PDF / FILE TEXT EXTRACTION HELPER
   ═══════════════════════════════════════ */
async function readJDFile(file, callback) {
  if (file.type === 'application/pdf' || file.name.endsWith('.pdf')) {
    try {
      const pdfjsLib = window['pdfjs-dist/build/pdf'];
      // Use fake worker to avoid CORS issues with worker scripts
      pdfjsLib.GlobalWorkerOptions.workerSrc = `https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js`;
      const arrayBuffer = await file.arrayBuffer();
      const typedArray = new Uint8Array(arrayBuffer);
      const pdfDoc = await pdfjsLib.getDocument(typedArray).promise;
      let text = '';
      for (let p = 1; p <= pdfDoc.numPages; p++) {
        const page = await pdfDoc.getPage(p);
        const tc = await page.getTextContent();
        text += tc.items.map(i => i.str).join(' ') + '\n';
      }
      const result = text.trim();
      callback(result.length > 50 ? result : 'PDF text could not be extracted. Please paste the job description below.');
    } catch(err) {
      console.warn('PDF.js error:', err);
      callback('PDF could not be read. Please paste the job description text below.');
    }
  } else {
    // Plain text / doc
    const reader = new FileReader();
    reader.onload = ev => callback(ev.target.result);
    reader.onerror = () => callback('File could not be read. Please paste the text below.');
    reader.readAsText(file);
  }
}

              <div className="field"><label>Location</label><input placeholder="Remote / NYC" value={form.location||''} onChange={e=>update('location',e.target.value)}/></div>
              <div className="field"><label>Status</label>
                <select value={form.status} onChange={e=>update('status',e.target.value)}>
                  <option>Open</option><option>Paused</option><option>Closed</option>
                </select>
              </div>
            </div>
            <div className="field"><label>Notes</label><textarea placeholder="Internal notes about this role..." value={form.notes||''} onChange={e=>update('notes',e.target.value)}/></div>
          </>}

          {tab==='jd' && <>
            <div className="field">
              <label>Upload or Paste Job Description</label>
              <div
                onDragOver={e=>{e.preventDefault();e.currentTarget.style.borderColor='var(--accent)';}}
                onDragLeave={e=>{e.currentTarget.style.borderColor='var(--border)';}}
                onDrop={e=>{
                  e.preventDefault();
                  e.currentTarget.style.borderColor='var(--border)';
                  const file = e.dataTransfer.files[0];
                  if (!file) return;
                  readJDFile(file, text => update('jd', text));
                }}
                onClick={()=>document.getElementById('jd-file-input').click()}
                style={{border:'2px dashed var(--border)',borderRadius:10,padding:'24px',
                  textAlign:'center',cursor:'pointer',marginBottom:12,transition:'border-color .2s',
                  background:'var(--surface2)'}}>
                <div style={{fontSize:28,marginBottom:6}}>📄</div>
                <div style={{fontSize:13,fontWeight:600,color:'var(--text2)'}}>Drop a file here or click to upload</div>
                <div style={{fontSize:11,color:'var(--muted)',marginTop:4}}>Supports .txt, .pdf (text), .doc contents</div>
              </div>
              <input id="jd-file-input" type="file" accept=".txt,.text,.md,.doc,.docx,.pdf" style={{display:'none'}}
                onChange={e=>{
                  const file = e.target.files[0];
                  if (!file) return;
                  readJDFile(file, text => update('jd', text));
                  e.target.value='';
                }}/>
              <textarea style={{minHeight:160}} placeholder="...or paste your job description here" value={form.jd} onChange={e=>update('jd',e.target.value)}/>
            </div>
            <div className="flex gap-2 mt-2" style={{flexWrap:'wrap'}}>
              <button className="btn btn-purple" onClick={extractFromJD} disabled={extracting||!form.jd}>
                {extracting ? '⏳ Extracting...' : '✨ Extract Requirements with AI'}
              </button>
              <button className="btn btn-secondary" onClick={()=>{
                if (!form.jd) return;
                let t = form.jd;
                t = t.replace(/([a-z\.\!\?])([A-Z])/g, '$1\n$2');
                t = t.replace(/\s+●\s+/g, '\n● ');
                t = t.replace(/\s+•\s+/g, '\n• ');
                t = t.replace(/\n{3,}/g, '\n\n').trim();
                update('jd', t);
              }}>
                📐 Format Text
              </button>
              <button className="btn btn-secondary" onClick={async ()=>{
                if (!form.jd||form.jd.length<20) return;
                setExtracting(true);
                try {
                  const response = await fetch('https://sncfmxqwpfxhztaxuhdu.supabase.co/functions/v1/claude-proxy', {
                    method:'POST',
                    headers:{'Content-Type':'application/json','Authorization':'Bearer ' + SUPABASE_ANON_KEY},
                    body:JSON.stringify({
                      prompt:'Clean up this text into a readable job description. Remove PDF artifacts and binary characters. Return only clean text: ' + form.jd.slice(0,4000)
                    })
                  });
                  const data = await response.json();
                  if (data.error) throw new Error(data.error);
                  const cleaned = data.text;
                  update('jd', cleaned);
                } catch(e) { alert('Could not clean text. Please paste manually.'); }
                setExtracting(false);
              }} disabled={extracting||!form.jd}>
                🧹 Clean up with Claude
              </button>
            </div>
          </>}

          {tab==='requirements' && <>
            <div className="section-title">Position Requirements ({form.requirements.length})</div>
            {form.requirements.length===0 && <div className="text-muted text-sm mb-3">No requirements added yet. Add from library or create custom.</div>}
            {form.requirements.map(req=>(
              <div key={req.id} className="req-row">
                <div style={{flex:1}}>
                  <div style={{fontSize:13,fontWeight:500}}>{req.name}</div>
                </div>
                <div className="flex items-center gap-2">
                  <select className="weight-select" value={req.weight} onChange={e=>updateReq(req.id,'weight',Number(e.target.value))}>
                    <option value={1}>1× weight</option>
                    <option value={2}>2× weight</option>
                    <option value={3}>3× weight</option>
                  </select>
                  <button className={`must-toggle ${req.mustHave?'on':''}`} onClick={()=>updateReq(req.id,'mustHave',!req.mustHave)} title={req.mustHave?'Must Have (click to remove)':'Set as Must Have'}>
                    {req.mustHave?'🚫':'○'}
                  </button>
                  <button className="btn btn-ghost btn-xs" onClick={()=>removeReq(req.id)}>✕</button>
                </div>
              </div>
            ))}
            <hr className="divider"/>
            <div className="section-title">Add Custom Requirement</div>
            <div className="flex gap-2 mb-4">
              <input placeholder="e.g. International market experience" value={customReq} onChange={e=>setCustomReq(e.target.value)} onKeyDown={e=>e.key==='Enter'&&addCustom()}/>
              <button className="btn btn-secondary" onClick={addCustom}>Add</button>
            </div>
            <div className="section-title">Add from Library</div>
            {categories.map(cat=>(
              <div key={cat} className="mb-3">
                <div style={{fontSize:12,fontWeight:600,color:'var(--muted)',marginBottom:6}}>{cat}</div>
                <div className="flex" style={{flexWrap:'wrap',gap:6}}>
                  {reqLib.filter(r=>r.category===cat).map(r=>{
                    const added = form.requirements.find(x=>x.name===r.name);
                    return <button key={r.id} className={`chip ${added?'':'chip-add'}`} style={added?{borderColor:'var(--accent)',color:'var(--accent)'}:{}} onClick={()=>addFromLib(r)}>
                      {added?'✓ ':''}{r.name}
                    </button>;
                  })}
                </div>
              </div>
            ))}
          </>}
        </div>
        <div className="modal-footer">
          <button className="btn btn-ghost" onClick={onClose}>Cancel</button>
          <button className="btn btn-primary" onClick={()=>form.title&&onSave(form)} disabled={!form.title}>
            {position?'Save Changes':'Create Position'}
          </button>
        </div>
      </div>
    </div>
  );
}

function ShareWithTeamModal({ candidate, positions, onClose }) {
  var pos = positions.find(function(p){return p.id===candidate.positionId;});
  var score = pos && candidate.scores ? calcWeightedScore(candidate.scores, pos.requirements||[]) : null;
  var liUrl = candidate.linkedIn ? (candidate.linkedIn.startsWith('http') ? candidate.linkedIn : 'https://' + candidate.linkedIn) : null;
  var [summary, setSummary] = useState('');
  var [loading, setLoading] = useState(false);
  var [copied, setCopied] = useState('');
  var [generated, setGenerated] = useState(false);

  var rawInterviewNotes = (candidate.interviewNotes||[]).map(function(n){return n.text;}).join(' | ');
  var rawRefNotes = (candidate.references||[]).map(function(r){
    return r.name ? r.name + ' (' + r.relationship + '): ' + (r.notes||'') : '';
  }).filter(Boolean).join(' | ');
  var allRawNotes = [candidate.notes, rawInterviewNotes, candidate.overallNotes, rawRefNotes].filter(Boolean).join(' | ');
  var hasNotes = allRawNotes.trim().length > 0;

  React.useEffect(function() {
    if (hasNotes) generateSummary();
    else setGenerated(true);
  }, []);

  var generateSummary = async function() {
    setLoading(true);
    try {
      var promptText = 'Summarize these hiring notes into 3-5 professional sentences about ' + candidate.name + ': ' + allRawNotes.slice(0, 5000);
      var response = await fetch('https://sncfmxqwpfxhztaxuhdu.supabase.co/functions/v1/claude-proxy', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + SUPABASE_ANON_KEY },
        body: JSON.stringify({ prompt: promptText, max_tokens: 600 })
      });
      var data = await response.json();
      setSummary(data.text || '');
    } catch(e) { setSummary(''); }
    setLoading(false);
    setGenerated(true);
  };

  var scoreStr = score === -1 ? 'Disqualified' : score != null ? score + '%' : 'Not yet scored';
  var scoreColor = score===-1?'#f75c5c':score>=80?'#2dd4a0':score>=60?'#4f8ef7':score?'#f7c94f':'#5c6882';
  var interviewTeamStr = (candidate.interviewers||[]).map(function(iv){
    return iv.name + (iv.role ? ' (' + iv.role + ')' : '');
  }).join(', ');

  var buildEmailText = function() {
    var out = 'CANDIDATE BRIEF: ' + candidate.name + '
';
    out += 'Role: ' + (pos ? pos.title : '-') + '
';
    out += 'Stage: ' + (candidate.stage||'-') + ' | Score: ' + scoreStr + '
';
    if (candidate.recommendation) out += 'Recommendation: ' + candidate.recommendation + '
';
    if (liUrl) out += 'LinkedIn: ' + liUrl + '
';
    out += '
';
    if (interviewTeamStr) out += 'INTERVIEW TEAM
' + interviewTeamStr + '

';
    if (summary) out += 'NOTES SUMMARY
' + summary + '

';
    if (pos) {
      var scored = (pos.requirements||[]).filter(function(r){return (candidate.scores||{})[r.id]&&(candidate.scores||{})[r.id].score;});
      if (scored.length > 0) {
        out += 'SCORECARD
';
        scored.forEach(function(req){
          var s = (candidate.scores||{})[req.id];
          out += '- ' + req.name + ': ' + scoreLabel(s.score) + ' (' + s.score + '/5)' + (s.note ? ' - ' + s.note : '') + '
';
        });
      }
    }
    out += '
Generated by HCC - Hiring Command Center';
    return out;
  };

  var buildSlackText = function() {
    var out = '*Candidate Brief: ' + candidate.name + '*
';
    out += '*Role:* ' + (pos ? pos.title : '-') + ' | *Stage:* ' + (candidate.stage||'-') + ' | *Score:* ' + scoreStr + '
';
    if (candidate.recommendation) out += '*Rec:* ' + candidate.recommendation + '
';
    if (liUrl) out += '*LinkedIn:* ' + liUrl + '
';
    out += '
';
    if (interviewTeamStr) out += '*Interview Team*
' + interviewTeamStr + '

';
    if (summary) out += '*Notes Summary*
' + summary + '

';
    if (pos) {
      var scored = (pos.requirements||[]).filter(function(r){return (candidate.scores||{})[r.id]&&(candidate.scores||{})[r.id].score;});
      if (scored.length > 0) {
        out += '*Scorecard*
';
        scored.forEach(function(req){
          var s = (candidate.scores||{})[req.id];
          out += '- *' + req.name + '*: ' + scoreLabel(s.score) + ' (' + s.score + '/5)' + (s.note ? ' - ' + s.note : '') + '
';
        });
      }
    }
    return out;
  };

  var copyText = function(type) {
    var text = type === 'slack' ? buildSlackText() : buildEmailText();
    navigator.clipboard.writeText(text).then(function(){
      setCopied(type);
      setTimeout(function(){setCopied('');}, 2500);
    });
  };

  return (
    <div className="modal-overlay" onClick={function(e){e.target===e.currentTarget&&onClose();}}>
      <div className="modal" style={{maxWidth:580}}>
        <div className="modal-header">
          <div className="modal-title">Share with Team</div>
          <button className="modal-close" onClick={onClose}>x</button>
        </div>
        <div className="modal-body">
          <div style={{display:'flex',gap:8,marginBottom:16}}>
            <button className="btn btn-sm" style={{flex:1,justifyContent:'center',background:'rgba(45,212,160,.1)',color:'#2dd4a0',border:'1px solid rgba(45,212,160,.3)',fontWeight:700}}
              onClick={function(){copyText('email');}} disabled={loading}>
              {copied==='email' ? 'Copied!' : 'Copy for Email'}
            </button>
            <button className="btn btn-sm" style={{flex:1,justifyContent:'center',background:'rgba(79,142,247,.1)',color:'var(--accent)',border:'1px solid rgba(79,142,247,.3)',fontWeight:700}}
              onClick={function(){copyText('slack');}} disabled={loading}>
              {copied==='slack' ? 'Copied!' : 'Copy for Slack'}
            </button>
          </div>
          <div style={{background:'var(--surface2)',border:'1px solid var(--border)',borderRadius:12,overflow:'hidden'}}>
            <div style={{padding:'18px 20px',background:'linear-gradient(135deg,rgba(79,142,247,.1),rgba(124,92,252,.08))',borderBottom:'1px solid var(--border)'}}>
              <div style={{display:'flex',alignItems:'flex-start',justifyContent:'space-between',gap:12}}>
                <div>
                  <div style={{fontSize:10,fontWeight:700,color:'var(--muted)',textTransform:'uppercase',letterSpacing:'.1em',marginBottom:4}}>Candidate Brief</div>
                  <div style={{fontSize:22,fontWeight:700}}>{candidate.name}</div>
                  <div style={{fontSize:14,color:'var(--text2)',marginTop:3}}>{pos ? pos.title : '-'}</div>
                </div>
                <div style={{textAlign:'right',flexShrink:0}}>
                  <div style={{fontSize:10,color:'var(--muted)',marginBottom:3}}>Score</div>
                  <div style={{fontSize:24,fontWeight:700,color:scoreColor}}>{scoreStr}</div>
                  {candidate.recommendation && (
                    <span className={'badge ' + (candidate.recommendation==='Strong Yes'||candidate.recommendation==='Yes'?'badge-green':candidate.recommendation==='No'||candidate.recommendation==='Strong No'?'badge-red':'badge-yellow')} style={{marginTop:4,display:'inline-block'}}>
                      {candidate.recommendation}
                    </span>
                  )}
                </div>
              </div>
              <div style={{display:'flex',gap:12,marginTop:12,flexWrap:'wrap',alignItems:'center'}}>
                <span className={'badge ' + (STAGE_COLORS[candidate.stage]||'badge-gray')}>{candidate.stage}</span>
                {liUrl && (
                  <a href={liUrl} target="_blank" rel="noopener noreferrer"
                    style={{fontSize:11,color:'#0a66c2',fontWeight:600,textDecoration:'none',background:'rgba(10,102,194,.1)',padding:'2px 8px',borderRadius:20}}>
                    LinkedIn Profile
                  </a>
                )}
                {pos && pos.jd && (
                  <button className="btn btn-xs" style={{background:'rgba(124,92,252,.1)',color:'var(--accent2)',border:'1px solid rgba(124,92,252,.25)'}}
                    onClick={function(){
                      var w = window.open('','_blank');
                      w.document.write('<pre style="font-family:sans-serif;max-width:800px;margin:40px auto;white-space:pre-wrap">' + (pos.jd||'').replace(/</g,'&lt;') + '</pre>');
                      w.document.title = pos.title + ' - Job Description';
                    }}>
                    View Job Description
                  </button>
                )}
              </div>
            </div>
            <div style={{padding:'16px 20px',display:'flex',flexDirection:'column',gap:14}}>
              {(candidate.interviewers||[]).length > 0 && (
                <div>
                  <div style={{fontSize:10,fontWeight:700,color:'var(--muted)',textTransform:'uppercase',letterSpacing:'.08em',marginBottom:8}}>Interview Team</div>
                  <div style={{display:'flex',flexWrap:'wrap',gap:6}}>
                    {(candidate.interviewers||[]).map(function(iv){
                      return (
                        <div key={iv.id} style={{display:'inline-flex',alignItems:'center',gap:6,padding:'4px 10px',background:'var(--surface3)',border:'1px solid var(--border)',borderRadius:20}}>
                          <span style={{fontSize:12,fontWeight:600}}>{iv.name}</span>
                          {iv.role && <span style={{fontSize:11,color:'var(--muted)'}}>- {iv.role}</span>}
                        </div>
                      );
                    })}
                  </div>
                </div>
              )}
              <div>
                <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:6}}>
                  <div style={{fontSize:10,fontWeight:700,color:'var(--muted)',textTransform:'uppercase',letterSpacing:'.08em'}}>Notes Summary</div>
                  {generated && hasNotes && (
                    <button className="btn btn-ghost btn-xs" onClick={generateSummary} disabled={loading}>{loading ? 'Loading...' : 'Regenerate'}</button>
                  )}
                </div>
                {loading
                  ? <div style={{color:'var(--muted)',fontSize:12,fontStyle:'italic'}}>Claude is consolidating notes...</div>
                  : summary
                    ? <textarea value={summary} onChange={function(e){setSummary(e.target.value);}}
                        style={{fontSize:13,minHeight:80,color:'var(--text2)',background:'var(--surface3)',border:'1px solid var(--border)',borderRadius:6,width:'100%',padding:'8px'}}/>
                    : <div style={{fontSize:12,color:'var(--muted)',fontStyle:'italic'}}>No notes yet. Add interview notes or scorecard observations first.</div>
                }
              </div>
              {pos && (pos.requirements||[]).some(function(r){return (candidate.scores||{})[r.id]&&(candidate.scores||{})[r.id].score;}) && (
                <div>
                  <div style={{fontSize:10,fontWeight:700,color:'var(--muted)',textTransform:'uppercase',letterSpacing:'.08em',marginBottom:8}}>Scorecard</div>
                  <div style={{display:'flex',flexDirection:'column',gap:5}}>
                    {(pos.requirements||[]).map(function(req){
                      var s = (candidate.scores||{})[req.id];
                      if (!s||!s.score) return null;
                      var col = s.score>=4?'#2dd4a0':s.score===3?'#f7c94f':'#f75c5c';
                      return (
                        <div key={req.id} style={{display:'flex',alignItems:'center',gap:10}}>
                          <div style={{flex:1,fontSize:12,fontWeight:500}}>{req.name}</div>
                          <div style={{width:80,height:4,background:'var(--surface3)',borderRadius:2}}>
                            <div style={{width:((s.score/5)*100)+'%',height:'100%',background:col,borderRadius:2}}/>
                          </div>
                          <div style={{fontSize:11,fontWeight:700,color:col,width:24,textAlign:'right'}}>{s.score}/5</div>
                        </div>
                      );
                    })}
                  </div>
                </div>
              )}
            </div>
            <div style={{padding:'10px 20px',borderTop:'1px solid var(--border)',display:'flex',justifyContent:'space-between'}}>
              <div style={{fontSize:10,color:'var(--muted)'}}>Generated by HCC</div>
              <div style={{fontSize:10,color:'var(--muted)'}}>{new Date().toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'})}</div>
            </div>
          </div>
        </div>
      </div>
    </div>
  );
}

function CandidateProfileModal({ candidate, positions, onEdit, onClose, setCandidates }) {

const TRADE_TEAM = [
  'Ben Fischman',
  'Add team member...'
];

function InterviewTeamEditor({ interviewers, onChange }) {
  const [newName, setNewName] = useState('');
  const [showInput, setShowInput] = useState(false);

  const add = function(name) {
    var trimmed = name.trim();
    if (!trimmed || interviewers.some(function(i){return i.name.toLowerCase()===trimmed.toLowerCase();})) return;
    onChange([...interviewers, {id: uid(), name: trimmed, role: ''}]);
    setNewName('');
    setShowInput(false);
  };

  const remove = function(id) {
    onChange(interviewers.filter(function(i){return i.id!==id;}));
  };

  const updateRole = function(id, role) {
    onChange(interviewers.map(function(i){return i.id===id?{...i,role:role}:i;}));
  };

  return (
    <div style={{background:'var(--surface2)',border:'1px solid var(--border)',borderRadius:10,padding:'12px 14px'}}>
      {interviewers.length === 0 && !showInput && (
        <div style={{fontSize:12,color:'var(--muted)',marginBottom:10}}>No interviewers added yet.</div>
      )}

      {/* Existing interviewers */}
      {interviewers.length > 0 && (
        <div style={{display:'flex',flexDirection:'column',gap:6,marginBottom:10}}>
          {interviewers.map(function(interviewer) {
            return (
              <div key={interviewer.id} style={{display:'flex',alignItems:'center',gap:8,padding:'7px 10px',background:'var(--surface3)',borderRadius:8,border:'1px solid var(--border)'}}>
                <div style={{width:28,height:28,borderRadius:'50%',background:'linear-gradient(135deg,var(--accent),var(--accent2))',display:'flex',alignItems:'center',justifyContent:'center',fontSize:11,fontWeight:700,color:'#fff',flexShrink:0}}>
                  {interviewer.name.split(' ').map(function(n){return n[0];}).join('').slice(0,2).toUpperCase()}
                </div>
                <div style={{flex:1,minWidth:0}}>
                  <div style={{fontSize:13,fontWeight:600}}>{interviewer.name}</div>
                  <input
                    placeholder="Role / focus area (e.g. Culture fit, Technical)"
                    value={interviewer.role||''}
                    onChange={function(e){updateRole(interviewer.id, e.target.value);}}
                    style={{fontSize:11,padding:'2px 0',background:'transparent',border:'none',color:'var(--muted)',width:'100%',outline:'none'}}
                  />
                </div>
                <button className="btn btn-ghost btn-xs" style={{color:'var(--muted)',flexShrink:0}} onClick={function(){remove(interviewer.id);}}>✕</button>
              </div>
            );
          })}
        </div>
      )}

      {/* Add new interviewer */}
      {showInput ? (
        <div style={{display:'flex',gap:6,alignItems:'center'}}>
          <input
            autoFocus
            placeholder="Interviewer name..."
            value={newName}
            onChange={function(e){setNewName(e.target.value);}}
            onKeyDown={function(e){if(e.key==='Enter')add(newName);if(e.key==='Escape'){setShowInput(false);setNewName('');}}}
            style={{flex:1,fontSize:12,padding:'6px 10px'}}
          />
          <button className="btn btn-primary btn-xs" onClick={function(){add(newName);}} disabled={!newName.trim()}>Add</button>
          <button className="btn btn-ghost btn-xs" onClick={function(){setShowInput(false);setNewName('');}}>Cancel</button>
        </div>
      ) : (
        <button className="btn btn-secondary btn-xs" style={{width:'100%',justifyContent:'center',marginTop:interviewers.length>0?4:0}}
          onClick={function(){setShowInput(true);}}>
          + Add Interviewer
        </button>
      )}
    </div>
  );
}

function CandidateModal({ candidate, positions, onSave, onClose }) {
  // Seed initial richProfile from existing candidate data or saved richProfile
  var seedProfile = null;
  if (candidate && candidate.richProfile) {
    seedProfile = candidate.richProfile;
  } else if (candidate && candidate.name) {
    seedProfile = {
      name: candidate.name || '',
      email: candidate.email || '',
      phone: candidate.phone || '',
      linkedIn: candidate.linkedIn || '',
      currentTitle: '',
      currentCompany: '',
      summary: candidate.notes || '',
      workHistory: [],
      education: [],
      skills: []
    };
  }

  const [form, setForm] = useState(candidate || { name:'', email:'', phone:'', positionId:'', stage:'Applied', linkedIn:'', notes:'' });
  const [liText, setLiText] = useState('');
  const [liLoading, setLiLoading] = useState(false);
  const [liError, setLiError] = useState('');
  const [aiImportMode, setAiImportMode] = useState('');
  const [dragOver, setDragOver] = useState(false);
  const [resumeLoading, setResumeLoading] = useState(false);
  const [resumeError, setResumeError] = useState('');
  const [resumeFileName, setResumeFileName] = useState('');
  const [parsedProfile, setParsedProfile] = useState(seedProfile);
  const fileInputRef = React.useRef(null);
  const update = (k,v) => setForm(f=>({...f,[k]:v}));

  const RICH_PROMPT = 'Extract a complete candidate profile from this content. Return ONLY a raw JSON object (no markdown, no backticks) with these exact fields: name (string), email (string), phone (string), linkedIn (string, full URL if found), currentTitle (string), currentCompany (string), summary (2-3 sentence professional overview), workHistory (array of objects: {title, company, dates, bullets: string[max 3 bullets]}), education (array of objects: {institution, degree, year}), skills (array of up to 12 skill strings). Use empty string or empty array if a field is not found.';

  // MERGE new parsed data into existing profile - never wipe what we already have
  const applyParsed = function(parsed) {
    setParsedProfile(function(existing) {
      var base = existing || {};
      // Merge scalar fields - only overwrite if new value is non-empty
      var merged = {
        name: parsed.name || base.name || '',
        email: parsed.email || base.email || '',
        phone: parsed.phone || base.phone || '',
        linkedIn: parsed.linkedIn || base.linkedIn || '',
        currentTitle: parsed.currentTitle || base.currentTitle || '',
        currentCompany: parsed.currentCompany || base.currentCompany || '',
        summary: parsed.summary || base.summary || '',
        // Merge arrays - dedupe by title+company for workHistory, by institution for education, by value for skills
        workHistory: mergeWorkHistory(base.workHistory || [], parsed.workHistory || []),
        education: mergeEducation(base.education || [], parsed.education || []),
        skills: mergeSkills(base.skills || [], parsed.skills || [])
      };
      return merged;
    });
    // Update form fields - only fill blanks
    setForm(function(f) {
      var noteParts = [];
      if (parsed.currentTitle) noteParts.push(parsed.currentTitle);
      if (parsed.currentCompany) noteParts.push(parsed.currentCompany);
      if (parsed.summary) noteParts.push(parsed.summary);
      return {
        ...f,
        name: f.name || parsed.name || '',
        email: f.email || parsed.email || '',
        phone: f.phone || parsed.phone || '',
        linkedIn: f.linkedIn || parsed.linkedIn || '',
        notes: f.notes || noteParts.filter(Boolean).join(' | ')
      };
    });
  };

  function mergeWorkHistory(existing, incoming) {
    var result = existing.slice();
    incoming.forEach(function(job) {
      var key = (job.title||'') + '|' + (job.company||'');
      var alreadyExists = result.some(function(r){ return ((r.title||'')+'|'+(r.company||'')) === key; });
      if (!alreadyExists) result.push(job);
    });
    return result;
  }
  function mergeEducation(existing, incoming) {
    var result = existing.slice();
    incoming.forEach(function(ed) {
      var alreadyExists = result.some(function(r){ return (r.institution||'') === (ed.institution||''); });
      if (!alreadyExists) result.push(ed);
    });
    return result;
  }
  function mergeSkills(existing, incoming) {
    var combined = existing.slice();
    incoming.forEach(function(sk) {
      if (!combined.some(function(s){ return s.toLowerCase() === sk.toLowerCase(); })) combined.push(sk);
    });
    return combined.slice(0, 16);
  }

  const parseLinkedIn = async function() {
    if (!liText.trim()) return;
    setLiLoading(true); setLiError('');
    try {
      const response = await fetch('https://sncfmxqwpfxhztaxuhdu.supabase.co/functions/v1/claude-proxy', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + SUPABASE_ANON_KEY },
        body: JSON.stringify({ prompt: RICH_PROMPT + ' Content: ' + liText.slice(0, 3500), max_tokens: 2000 })
      });
      const data = await response.json();
      if (data.error) throw new Error(data.error);
      applyParsed(JSON.parse(data.text.replace(/```json|```/g,'').trim()));
      setAiImportMode('');
      setLiText('');
    } catch(e) {
      setLiError('Could not parse: ' + e.message);
    }
    setLiLoading(false);
  };

  const processResumeFile = async function(file) {
    if (!file) return;
    setResumeLoading(true); setResumeError(''); setResumeFileName(file.name);
    try {
      const isPdf = file.type === 'application/pdf' || file.name.endsWith('.pdf');
      const isImage = file.type.startsWith('image/');
      if (!isPdf && !isImage) throw new Error('Please upload a PDF or image file (JPG, PNG, WEBP)');

      if (isPdf) {
        const pdfjsLib = window['pdfjs-dist/build/pdf'];
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
        const arrayBuffer = await file.arrayBuffer();
        const pdf = await pdfjsLib.getDocument({data: arrayBuffer}).promise;
        let fullText = '';
        for (let i = 1; i <= Math.min(pdf.numPages, 5); i++) {
          const page = await pdf.getPage(i);
          const content = await page.getTextContent();
          fullText += content.items.map(function(item){return item.str;}).join(' ') + '\n';
        }
        if (!fullText.trim()) throw new Error('Could not extract text. Try an image screenshot instead.');
        const response = await fetch('https://sncfmxqwpfxhztaxuhdu.supabase.co/functions/v1/claude-proxy', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + SUPABASE_ANON_KEY },
          body: JSON.stringify({ prompt: RICH_PROMPT + ' Resume text: ' + fullText.slice(0, 4000), max_tokens: 2000 })
        });
        const data = await response.json();
        if (data.error) throw new Error(data.error);
        applyParsed(JSON.parse(data.text.replace(/```json|```/g,'').trim()));
      } else {
        const base64 = await new Promise(function(res, rej) {
          const reader = new FileReader();
          reader.onload = function() { res(reader.result.split(',')[1]); };
          reader.onerror = function() { rej(new Error('Could not read file')); };
          reader.readAsDataURL(file);
        });
        const mediaType = file.type || 'image/jpeg';
        const response = await fetch('https://sncfmxqwpfxhztaxuhdu.supabase.co/functions/v1/claude-proxy', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + SUPABASE_ANON_KEY },
          body: JSON.stringify({
            messages: [{ role: 'user', content: [
              { type: 'image', source: { type: 'base64', media_type: mediaType, data: base64 } },
              { type: 'text', text: RICH_PROMPT }
            ]}],
            max_tokens: 2000
          })
        });
        const data = await response.json();
        if (data.error) {
          const errMsg = typeof data.error === 'string' ? data.error : (data.error.message || JSON.stringify(data.error));
          if (errMsg.includes('messages.0.content') || errMsg.includes('Field required')) {
            throw new Error('Proxy needs updating to support images. Please deploy the new claude-proxy.ts file.');
          }
          throw new Error(errMsg);
        }
        const rawText = Array.isArray(data.content)
          ? data.content.filter(function(b){return b.type==='text';}).map(function(b){return b.text;}).join('')
          : (data.text || '');
        if (!rawText.trim()) throw new Error('Empty response — please deploy the updated claude-proxy.ts and try again.');
        applyParsed(JSON.parse(rawText.replace(/```json|```/g,'').trim()));
      }
      setAiImportMode('done');
    } catch(e) {
      setResumeError('Could not parse file: ' + e.message);
    }
    setResumeLoading(false);
  };

  const handleDrop = function(e) {
    e.preventDefault(); setDragOver(false);
    const file = e.dataTransfer.files[0];
    if (file) processResumeFile(file);
  };

  const handleSave = function() {
    if (!form.name || !form.positionId) return;
    onSave({ ...form, richProfile: parsedProfile });
  };

  return (
    <div className="modal-overlay" onClick={function(e){e.target===e.currentTarget&&onClose();}}>
      <div className="modal" style={{maxWidth:600}}>
        <div className="modal-header">
          <div className="modal-title">{candidate?'Edit Candidate':'Add Candidate'}</div>

        <div className="modal-body">

          {/* LinkedIn Text Import */}
          {aiImportMode === 'linkedin' && (

              <div className="flex gap-2 mt-2">

function ScorecardsView({ candidates, setCandidates, positions }) {
  const [selPos, setSelPos] = useState('');
  const [selCand, setSelCand] = useState('');

  const pos = positions.find(p=>p.id===selPos);
  const cand = candidates.find(c=>c.id===selCand);
  const posForCand = pos || (cand ? positions.find(p=>p.id===cand.positionId) : null);

  const candsByPos = selPos ? candidates.filter(c=>c.positionId===selPos) : candidates;

  const setScore = (reqId, field, val) => {
    setCandidates(cs => cs.map(c => {
      if (c.id !== selCand) return c;
      return { ...c, scores: { ...c.scores, [reqId]: { ...(c.scores||{})[reqId], [field]: val } } };
    }));
  };

  const overallScore = posForCand && cand?.scores ? calcWeightedScore(cand.scores, posForCand.requirements||[]) : null;

  return (
    <div className="page">
      <div className="page-header">
        <div><div className="page-title">Scorecards</div><div className="page-sub">Rate candidates against position requirements</div></div>
      </div>
      <div className="grid-2 mb-4">
        <div className="field" style={{margin:0}}>
          <label>Position</label>
          <select value={selPos} onChange={e=>{setSelPos(e.target.value);setSelCand('')}}>
            <option value="">All Positions</option>
            {positions.map(p=><option key={p.id} value={p.id}>{p.title}</option>)}
          </select>
        </div>
        <div className="field" style={{margin:0}}>
          <label>Candidate</label>
          <select value={selCand} onChange={e=>setSelCand(e.target.value)}>
            <option value="">Select Candidate...</option>
            {candsByPos.map(c=><option key={c.id} value={c.id}>{c.name}</option>)}
          </select>
        </div>
      </div>

      {!selCand && <div className="empty-state"><div className="empty-icon">📊</div><div className="empty-title">Select a candidate to score</div></div>}

      {selCand && cand && posForCand && <>
        <div className="flex items-center justify-between mb-4">
          <div>
            <div style={{fontWeight:700,fontSize:18}}>{cand.name}</div>
            <div className="text-muted text-sm" style={{display:'flex',alignItems:'center',gap:6}}>
              {posForCand.title} ·
              <select
                value={cand.stage}
                onChange={function(e){setCandidates(function(cs){return cs.map(function(x){return x.id===selCand?{...x,stage:e.target.value}:x;});});}}
                style={{fontSize:12,fontWeight:600,padding:'2px 8px',borderRadius:20,cursor:'pointer',background:'var(--surface2)',border:'1px solid var(--border2)',color:'var(--text)'}}>
                {STAGES.map(function(s){return <option key={s} value={s}>{s}</option>;})}
              </select>
            </div>
          </div>
          <div style={{textAlign:'right'}}>
            <div className="text-muted text-xs mb-1">Overall Score</div>
            <div style={{fontSize:overallScore===-1?16:28,fontWeight:700,color:overallScore===-1?'var(--red)':overallScore>=80?'var(--accent3)':overallScore>=60?'var(--accent)':overallScore?'var(--yellow)':'var(--muted)'}}>
              {overallScore===-1?'🚫 Disqualified':overallScore!=null?overallScore+'%':'—'}
            </div>
          </div>
        </div>

        {(posForCand.requirements||[]).length===0
          ? <div className="card"><div className="text-muted text-sm">No requirements set for this position. Add requirements to the position first.</div></div>
          : <div className="card" style={{padding:0}}>
              <table style={{width:'100%',borderCollapse:'collapse'}}>
                <thead><tr>
                  <th style={{padding:'12px 16px'}}>Requirement</th>
                  <th style={{padding:'12px 16px'}}>Weight</th>
                  <th style={{padding:'12px 16px'}}>Score</th>
                  <th style={{padding:'12px 16px'}}>Notes</th>
                </tr></thead>
                <tbody>
                  {(posForCand.requirements||[]).map(req=>{
                    const s = (cand.scores||{})[req.id]||{};
                    return <tr key={req.id}>
                      <td style={{padding:'12px 16px'}}>
                        <div style={{fontWeight:500}}>{req.name}</div>
                        {req.mustHave && <span className="badge badge-red mt-1" style={{fontSize:10}}>Must Have</span>}
                      </td>
                      <td style={{padding:'12px 16px',color:'var(--muted)',fontSize:12}}>{req.weight}×</td>
                      <td style={{padding:'12px 16px'}}>
                        <ScoreBtns value={s.score} onChange={v=>setScore(req.id,'score',v)}/>
                        {s.score && <div style={{fontSize:10,color:'var(--muted)',marginTop:4}}>{scoreLabel(s.score)}</div>}
                      </td>
                      <td style={{padding:'8px 16px'}}>
                        <input style={{fontSize:12,padding:'6px 10px'}} placeholder="Add note..." value={s.note||''} onChange={e=>setScore(req.id,'note',e.target.value)}/>
                      </td>
                    </tr>;
                  })}
                </tbody>
              </table>
            </div>
        }

        <div className="flex justify-between items-center mb-2">
          <div className="text-muted text-xs">Scores save automatically as you click</div>
          <button className="btn btn-danger btn-sm" onClick={()=>{if(window.confirm('Reset all scores for '+cand.name+'?'))setCandidates(cs=>cs.map(c=>c.id===selCand?{...c,scores:{},recommendation:'',overallNotes:''}:c))}}>
            ↺ Reset Scores
          </button>
        </div>
        <div className="card mt-4">
          <div className="section-title">Overall Recommendation</div>
          <div className="flex gap-2 mb-3" style={{flexWrap:'wrap'}}>
            {['Strong Yes','Yes','Maybe','No','Strong No'].map(r=>(
              <button key={r}
                className={`btn btn-sm ${cand.recommendation===r?'btn-primary':'btn-secondary'}`}
                onClick={()=>setCandidates(cs=>cs.map(c=>c.id===selCand?{...c,recommendation:r}:c))}>
                {r}
              </button>
            ))}
          </div>
          <div className="field" style={{margin:0}}>
            <label>Overall Notes</label>
            <textarea placeholder="Overall impression and reasoning..." value={cand.overallNotes||''} onChange={e=>setCandidates(cs=>cs.map(c=>c.id===selCand?{...c,overallNotes:e.target.value}:c))}/>
          </div>
        </div>
      </>}
    </div>
  );
}

function JDBuilderView({ positions, setPositions, requirements: reqLib }) {
  const [mode, setMode] = useState(''); // 'manual' or 'ai'
  const [step, setStep] = useState(1);
  const [form, setForm] = useState({ title:'', department:'', location:'', level:'Mid', description:'', responsibilities:'', qualifications:'', requirements:[] });
  const [generated, setGenerated] = useState('');
  const [aiPrompt, setAiPrompt] = useState('');
  const [aiLoading, setAiLoading] = useState(false);
  const [aiError, setAiError] = useState('');
  const update = (k,v) => setForm(f=>({...f,[k]:v}));

  // ── AI Generation ──────────────────────────────
  const generateWithClaude = async () => {
    if (!aiPrompt.trim()) return;
    setAiLoading(true); setAiError('');
    try {
      const response = await fetch('https://sncfmxqwpfxhztaxuhdu.supabase.co/functions/v1/claude-proxy', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + SUPABASE_ANON_KEY },
        body: JSON.stringify({
          prompt: 'You are an expert recruiter. Create a job description for: ' + aiPrompt + '. Return ONLY a JSON object with fields: title, department, location, level (Junior/Mid/Senior/Lead/Director/VP/C-Level), description (2-3 sentences), responsibilities (bullet points with •), qualifications (bullet points with •), requirements (array of 5 strings). No markdown, no backticks, just raw JSON.',
          max_tokens: 1500
        })
      });
      const data = await response.json();
      if (data.error) throw new Error(data.error.message || JSON.stringify(data.error));
      const text = data.text.replace(/```json|```/g,'').trim();
      const parsed = JSON.parse(text);
      setForm(f => ({
        ...f,
        title: parsed.title || f.title,
        department: parsed.department || f.department,
        location: parsed.location || f.location,
        level: parsed.level || f.level,
        description: parsed.description || f.description,
        responsibilities: parsed.responsibilities || f.responsibilities,
        qualifications: parsed.qualifications || f.qualifications,
        requirements: (parsed.requirements||[]).map(r => ({ id: uid(), name: r, weight: 1, mustHave: false }))
      }));
      setMode('manual');
      setStep(1);
    } catch(e) {
      setAiError('Error: ' + e.message + '. Please try again or use manual mode.');
    }
    setAiLoading(false);
  };

  // ── Manual generation ──────────────────────────
  const generateJD = () => {
    const jd = `# ${form.title}
**Department:** ${form.department} | **Location:** ${form.location} | **Level:** ${form.level}

## About the Role
${form.description}

## Key Responsibilities
${form.responsibilities}

## Qualifications
${form.qualifications}

## What We're Looking For
${form.requirements.map(r=>`• ${r.name}`).join('\n')}`;
    setGenerated(jd);
    setStep(3);
  };

  const createPosition = () => {
    const newPos = {
      id: uid(), title: form.title, department: form.department, location: form.location,
      jd: generated, requirements: form.requirements, status: 'Open', createdAt: today()
    };
    setPositions(ps=>[...ps,newPos]);
    alert(`Position "${form.title}" created!`);
    setMode(''); setStep(1);
    setForm({ title:'', department:'', location:'', level:'Mid', description:'', responsibilities:'', qualifications:'', requirements:[] });
    setGenerated('');
  };

  const categories = [...new Set(reqLib.map(r=>r.category))];
  const toggleReq = (req) => {
    const exists = form.requirements.find(r=>r.name===req.name);
    if (exists) setForm(f=>({...f,requirements:f.requirements.filter(r=>r.name!==req.name)}));
    else setForm(f=>({...f,requirements:[...f.requirements,{id:uid(),name:req.name,weight:1,mustHave:false}]}));
  };

  // ── Mode selector ──────────────────────────────
  if (!mode) return (
    <div className="page">
      <div className="page-header">
        <div><div className="page-title">JD Builder</div><div className="page-sub">Create a job description your way</div></div>
      </div>
      <div className="grid-2" style={{gap:20,maxWidth:700}}>
        <div className="card" style={{cursor:'pointer',border:'1px solid var(--border)',transition:'all .2s'}}
          onClick={()=>setMode('ai')}
          onMouseEnter={e=>e.currentTarget.style.borderColor='var(--accent2)'}
          onMouseLeave={e=>e.currentTarget.style.borderColor='var(--border)'}>
          <div style={{fontSize:36,marginBottom:12}}>✨</div>
          <div style={{fontSize:17,fontWeight:700,marginBottom:8}}>Let Claude Write It</div>
          <div style={{fontSize:13,color:'var(--muted)',lineHeight:1.6}}>
