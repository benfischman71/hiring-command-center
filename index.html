        </div>
      </div>
      <div style={{padding:'14px 16px'}}>
        {groupNotes.map(function(n,i){
          return (
            <div key={n.id} style={{marginBottom:i<groupNotes.length-1?12:0,paddingBottom:i<groupNotes.length-1?12:0,borderBottom:i<groupNotes.length-1?'1px solid var(--border)':'none'}}>
              <NoteItem n={n} removeNote={removeNote} onEdit={onEditNote||function(){}}/>
            </div>
          );
        })}
      </div>
    </div>
  );
}

function renderNoteGroups(interviewNotes, removeNote, onCleanGroup, onEditNote) {
  const notes = [...interviewNotes].sort((a,b)=>new Date(b.createdAt)-new Date(a.createdAt));
  const groups = {};
  notes.forEach(n => {
    const d = n.savedAt
      ? n.savedAt.includes('Cleaned') || n.savedAt.includes('Synthesized') ? n.savedAt : n.savedAt.split(',').slice(0,2).join(',')
      : n.createdAt ? new Date(n.createdAt).toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'}) : 'Notes';
    if (!groups[d]) groups[d] = [];
    groups[d].push(n);
  });

  return Object.entries(groups).map(([date, groupNotes]) => (
    React.createElement(NoteGroup, {key:date, date, groupNotes, removeNote, onCleanGroup, onEditNote})
  ));
}


/* ═══════════════════════════════════════
   INTERVIEW NOTES
   ═══════════════════════════════════════ */
function InterviewsView({ candidates, setCandidates, positions, initialCand, onCandUsed }) {
  const [selCand, setSelCand] = useState(initialCand||'');
  React.useEffect(function(){if(initialCand){setSelCand(initialCand);onCandUsed&&onCandUsed();}}, [initialCand]);
  const [running, setRunning] = useState(false);
  const [elapsed, setElapsed] = useState(0);
  const [noteInput, setNoteInput] = useState('');
  const timerRef = useRef(null);

  const cand = candidates.find(c=>c.id===selCand);
  const pos = cand ? positions.find(p=>p.id===cand.positionId) : null;

  useEffect(()=>{
    if (running) { timerRef.current = setInterval(()=>setElapsed(e=>e+1),1000); }
    else { clearInterval(timerRef.current); }
    return ()=>clearInterval(timerRef.current);
  },[running]);

  const fmtTime = s => `${String(Math.floor(s/60)).padStart(2,'0')}:${String(s%60).padStart(2,'0')}`;

  const addNote = (star=false) => {
    if (!noteInput.trim()||!selCand) return;
    const now = new Date();
    const note = { id:uid(), text:noteInput.trim(), time:fmtTime(elapsed), star, createdAt:now.toISOString(), savedAt:now.toLocaleString('en-US',{month:'short',day:'numeric',hour:'numeric',minute:'2-digit',hour12:true}) };
    setCandidates(cs=>cs.map(c=>c.id===selCand?{...c,interviewNotes:[...(c.interviewNotes||[]),note]}:c));
    setNoteInput('');
  };

  const removeNote = (noteId) => setCandidates(cs=>cs.map(c=>c.id===selCand?{...c,interviewNotes:(c.interviewNotes||[]).filter(n=>n.id!==noteId)}:c));
  const editNote = (noteId, newText) => setCandidates(cs=>cs.map(c=>c.id===selCand?{...c,interviewNotes:(c.interviewNotes||[]).map(n=>n.id===noteId?{...n,text:newText}:n)}:c));

  return (
    <div className="page">
      <div className="page-header">
        <div><div className="page-title">Interview Notes</div><div className="page-sub">Live note-taking with timestamps</div></div>
      </div>
      <div className="field mb-4" style={{maxWidth:300}}>
        <label>Candidate</label>
        <select value={selCand} onChange={e=>{setSelCand(e.target.value);setRunning(false);setElapsed(0)}}>
          <option value="">Select candidate...</option>
          {candidates.filter(c=>c.stage!=='Rejected').map(c=><option key={c.id} value={c.id}>{c.name} — {positions.find(p=>p.id===c.positionId)?.title||'?'}</option>)}
        </select>
      </div>

      {!selCand && <div className="empty-state"><div className="empty-icon">🎙️</div><div className="empty-title">Select a candidate to start</div></div>}

      {selCand && cand && <>
        <div className="card mb-4">
          <div className="flex items-center justify-between">
            <div>
              <div style={{fontWeight:700,fontSize:18}}>{cand.name}</div>
              <div className="text-muted text-sm" style={{display:'flex',alignItems:'center',gap:6}}>
                {pos ? pos.title : ''}
                <select
                  value={cand.stage}
                  onChange={function(e){setCandidates(function(cs){return cs.map(function(x){return x.id===selCand?{...x,stage:e.target.value}:x;});});}}
                  style={{fontSize:12,fontWeight:600,padding:'2px 8px',borderRadius:20,cursor:'pointer',background:'var(--surface2)',border:'1px solid var(--border2)',color:'var(--text)'}}>
                  {STAGES.map(function(s){return <option key={s} value={s}>{s}</option>;})}
                </select>
              </div>
            </div>
            <CleanupNotesButton selCand={selCand} setCandidates={setCandidates} candidates={candidates}/>
          </div>
        </div>

        <div className="card mb-4">
          <div className="section-title">Add Note</div>
          <textarea placeholder="Type or paste notes here... drag a .txt file to import · Enter to save · Shift+Enter for ⭐ highlight" 
            style={{minHeight:70}} value={noteInput}
            onChange={e=>setNoteInput(e.target.value)}
            onPaste={e=>{
              // Let paste appear in textarea naturally
              // After short delay, if multi-line auto-save each line as a note
              setTimeout(()=>{
                const val = e.target.value;
                if (!val) return;
                const lines = val.split('\n').filter(l=>l.trim().length > 0);
                if (lines.length > 2) {
                  const now2 = new Date();
                  const savedAt2 = now2.toLocaleString('en-US',{month:'short',day:'numeric',hour:'numeric',minute:'2-digit',hour12:true});
                  lines.forEach((line,i) => {
                    setTimeout(()=>{
                      const note = { id:uid(), text:line.trim(), time:'', star:false, createdAt:now2.toISOString(), savedAt:savedAt2 };
                      setCandidates(cs=>cs.map(c=>c.id===selCand?{...c,interviewNotes:[...(c.interviewNotes||[]),note]}:c));
                    }, i*10);
                  });
                  setNoteInput('');
                }
              }, 200);
            }}
            onDragOver={e=>{e.preventDefault();e.currentTarget.style.borderColor='var(--accent)';}}
            onDragLeave={e=>{e.currentTarget.style.borderColor='';}}
            onDrop={e=>{
              e.preventDefault();
              e.currentTarget.style.borderColor='';
              const file = e.dataTransfer.files[0];
              if (file) {
                const reader = new FileReader();
                reader.onload = ev => {
                  const lines = ev.target.result.split('\n').filter(l=>l.trim());
                  lines.forEach((line,i) => {
                    setTimeout(()=>{
                      const note = { id:uid(), text:line.trim(), time:'imported', star:false, createdAt:new Date().toISOString() };
                      setCandidates(cs=>cs.map(c=>c.id===selCand?{...c,interviewNotes:[...(c.interviewNotes||[]),note]}:c));
                    }, i*10);
                  });
                };
                reader.readAsText(file);
              } else {
                const text = e.dataTransfer.getData('text');
                if (text) setNoteInput(n => n + text);
              }
            }}
            onKeyDown={e=>{
              if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();addNote(false);}
              if(e.key==='Enter'&&e.shiftKey){e.preventDefault();addNote(true);}
            }}/>
          <div className="flex gap-2 mt-2">
            <button className="btn btn-primary btn-sm" onClick={()=>addNote(false)}>Add Note</button>
            <button className="btn btn-secondary btn-sm" onClick={()=>addNote(true)}>⭐ Add Highlight</button>
          </div>
        </div>

        <TranscriptImport selCand={selCand} setCandidates={setCandidates}/>

        <div className="card">

/* ═══════════════════════════════════════
   REFERENCE NOTE INPUT (inline)
   ═══════════════════════════════════════ */
function RefNoteInput({ refId, candId, setCandidates }) {
  const [note, setNote] = useState('');
  const [showTranscript, setShowTranscript] = useState(false);
  const [transcript, setTranscript] = useState('');
  const [loading, setLoading] = useState(false);

  const PROXY = 'https://sncfmxqwpfxhztaxuhdu.supabase.co/functions/v1/claude-proxy';
  const ANON = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNuY2ZteHF3cGZ4aHp0YXh1aGR1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzM0MjAxOTcsImV4cCI6MjA4ODk5NjE5N30.M-DB7beiKqW3bgKp25YYQZD3uJV9_fGvfEoQb8Qn4jw';

  const addNotesToRef = (newNotes) => {
    setCandidates(cs => cs.map(c => {
      if (c.id !== candId) return c;
      return { ...c, ref_checks: (c.ref_checks||[]).map(r =>
        r.id === refId ? { ...r, notes: (r.notes ? r.notes + ' | ' : '') + newNotes } : r
      )};
    }));
  };

  const saveNote = () => {
    if (!note.trim()) return;
    addNotesToRef(note.trim());
    setNote('');
  };

  const parseTranscript = async () => {
    if (!transcript.trim()) return;
    setLoading(true);
    try {
      const resp = await fetch(PROXY, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + ANON },
        body: JSON.stringify({
          prompt: 'Extract 5-8 key insights from this reference call transcript. Focus on strengths, weaknesses, working style, and any red flags. Return a plain text summary with each point on a new line starting with a bullet •. No JSON, just bullet points. Transcript: ' + transcript.slice(0, 5000),
          max_tokens: 800
        })
      });
      const data = await resp.json();
      addNotesToRef(data.text || transcript);
    } catch(e) {
      addNotesToRef(transcript);
    }
    setTranscript(''); setShowTranscript(false); setLoading(false);
  };

  return (
    <div className="mt-3" style={{borderTop:'1px solid var(--border)',paddingTop:12}}>
      <div className="section-title mb-2">Add Notes</div>
      <textarea
        style={{minHeight:60,fontSize:12,marginBottom:6}}
        placeholder="Type or paste notes... drag a .txt file to import"
        value={note}
        onChange={e=>setNote(e.target.value)}
        onPaste={e=>{
          const text = e.clipboardData.getData('text');
          if (text && text.length > 300) { e.preventDefault(); addNotesToRef(text); }
        }}
        onDragOver={e=>{e.preventDefault();e.currentTarget.style.borderColor='var(--accent)';}}
        onDragLeave={e=>{e.currentTarget.style.borderColor='';}}
        onDrop={e=>{
          e.preventDefault(); e.currentTarget.style.borderColor='';
          const file = e.dataTransfer.files[0];
          if (file) { const r=new FileReader(); r.onload=ev=>addNotesToRef(ev.target.result); r.readAsText(file); }
          else { const t=e.dataTransfer.getData('text'); if(t) setNote(n=>n+t); }
        }}
        onKeyDown={e=>{ if(e.key==='Enter'&&e.metaKey){e.preventDefault();saveNote();} }}/>
      <div className="flex gap-2" style={{flexWrap:'wrap'}}>
        <button className="btn btn-primary btn-sm" onClick={saveNote} disabled={!note.trim()}>Save Note</button>
        <button className="btn btn-secondary btn-sm" onClick={()=>setShowTranscript(s=>!s)}>
          {showTranscript?'Cancel':'🎙️ Import Call Transcript'}
        </button>
      </div>
      {showTranscript && <div className="mt-3">
        <textarea
          style={{minHeight:120,fontSize:12,marginBottom:6}}
          placeholder="Paste the reference call transcript or recording transcript here. Claude will extract key insights..."
          value={transcript}
          onChange={e=>setTranscript(e.target.value)}
          onDragOver={e=>{e.preventDefault();e.currentTarget.style.borderColor='var(--accent)';}}
          onDragLeave={e=>{e.currentTarget.style.borderColor='';}}
          onDrop={e=>{
            e.preventDefault(); e.currentTarget.style.borderColor='';
            const file=e.dataTransfer.files[0];
            if(file){const r=new FileReader();r.onload=ev=>setTranscript(ev.target.result);r.readAsText(file);}
            else{const t=e.dataTransfer.getData('text');if(t)setTranscript(t);}
          }}/>
        <div className="flex gap-2">
          <button className="btn btn-purple btn-sm" onClick={parseTranscript} disabled={loading||!transcript.trim()}>
            {loading?'⏳ Extracting...':'✨ Extract Insights with Claude'}
          </button>
          <button className="btn btn-secondary btn-sm" onClick={()=>{addNotesToRef(transcript);setTranscript('');setShowTranscript(false);}} disabled={!transcript.trim()}>
            Import as-is
          </button>
        </div>
      </div>}
    </div>
  );
}

/* ═══════════════════════════════════════
   COMPARISON VIEW
   ═══════════════════════════════════════ */
function ComparisonView({ candidates, positions }) {
  const [selPos, setSelPos] = useState('');
  const [selCands, setSelCands] = useState([]);

  const pos = positions.find(p=>p.id===selPos);
  const candsByPos = selPos ? candidates.filter(c=>c.positionId===selPos&&c.stage!=='Rejected') : [];

  const toggleCand = (id) => {
    if (selCands.includes(id)) setSelCands(s=>s.filter(x=>x!==id));
    else if (selCands.length<4) setSelCands(s=>[...s,id]);
  };

  const compareCands = candidates.filter(c=>selCands.includes(c.id));

  return (
    <div className="page">
      <div className="page-header">
        <div><div className="page-title">Candidate Comparison</div><div className="page-sub">Side-by-side comparison with weighted scores</div></div>
      </div>
      <div className="grid-2 mb-4">
        <div className="field" style={{margin:0}}>
          <label>Position</label>
          <select value={selPos} onChange={e=>{setSelPos(e.target.value);setSelCands([])}}>
            <option value="">Select position...</option>
            {positions.map(p=><option key={p.id} value={p.id}>{p.title}</option>)}
          </select>
        </div>
      </div>
      {selPos && <div className="mb-4">
        <div className="section-title">Select Candidates to Compare (up to 4)</div>
        <div className="flex" style={{flexWrap:'wrap',gap:6}}>
          {candsByPos.map(c=>(
            <button key={c.id} className="chip" style={selCands.includes(c.id)?{borderColor:'var(--accent)',color:'var(--accent)',background:'rgba(79,142,247,.08)'}:{}} onClick={()=>toggleCand(c.id)}>
              {selCands.includes(c.id)?'✓ ':''}{c.name}
            </button>
          ))}
        </div>
      </div>}

      {compareCands.length>0 && pos && <>
        <div className="card" style={{padding:0,overflowX:'auto'}}>
          <table className="compare-table">
            <thead>
              <tr>
                <th style={{minWidth:180}}>Requirement</th>
                <th style={{minWidth:80}}>Weight</th>
                {compareCands.map(c=><th key={c.id} style={{minWidth:140}}>{c.name}</th>)}
              </tr>
            </thead>
            <tbody>
              {(pos.requirements||[]).map(req=>(
                <tr key={req.id}>
                  <td className="req-col">
                    {req.name}
                    {req.mustHave && <span className="badge badge-red ml-1" style={{fontSize:10}}>Must Have</span>}
                  </td>
                  <td className="text-muted text-xs">{req.weight}×</td>
                  {compareCands.map(c=>{
                    const s=(c.scores||{})[req.id];
                    return <td key={c.id} className="score-cell">
                      {s?.score
                        ? <span style={{color:scoreColor(s.score),fontWeight:700,fontFamily:'var(--mono)'}}>{s.score}</span>
                        : <span className="text-muted">—</span>}
                    </td>;
                  })}
                </tr>
              ))}
              <tr style={{background:'var(--surface2)'}}>
                <td colSpan={2} style={{fontWeight:700}}>Overall Weighted Score</td>
                {compareCands.map(c=>{
                  const sc = calcWeightedScore(c.scores||{}, pos.requirements||[]);
                  return <td key={c.id} className="score-cell">
                    <span style={{fontWeight:700,color:sc>=80?'var(--accent3)':sc>=60?'var(--accent)':sc?'var(--yellow)':'var(--muted)',fontFamily:'var(--mono)',fontSize:16}}>
                      {sc!=null?`${sc}%`:'—'}
                    </span>
                  </td>;
                })}
              </tr>
              <tr>
                <td colSpan={2} style={{fontWeight:600,fontSize:12,color:'var(--muted)'}}>Recommendation</td>
                {compareCands.map(c=>(
                  <td key={c.id} className="score-cell">
                    {c.recommendation
                      ? <span className={`badge ${c.recommendation.includes('Yes')?'badge-green':c.recommendation==='Maybe'?'badge-yellow':'badge-red'}`}>{c.recommendation}</span>
                      : <span className="text-muted">—</span>}
                  </td>
                ))}
              </tr>
            </tbody>
          </table>
        </div>
      </>}

      {!selPos && <div className="empty-state"><div className="empty-icon">⚖️</div><div className="empty-title">Select a position to compare candidates</div></div>}
    </div>
  );
}

          )}

          {(cand.interviewers||[]).length === 0 && (
            <div style={{fontSize:11,color:'var(--muted)',marginTop:4}}>
              Tip: Add interviewers to this candidate in Edit Candidate to get per-person links.
            </div>
          )}
        </div>

        <div className="card">
          <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:16}}>
            <div className="section-title" style={{margin:0}}>Team Scorecards</div>
            
          </div>
          {(function(){
                var activeReqs = (pos?.requirements||[]).filter(function(r){return r.active!==false;}).sort(function(a,b){if(a.mustHave&&!b.mustHave)return -1;if(!a.mustHave&&b.mustHave)return 1;return (b.weight||1)-(a.weight||1);});
                var scoreColor = function(s){ return s>=4?'#2dd4a0':s===3?'#f7c94f':s<=2?'#f75c5c':'var(--muted)'; };
                var recColor = function(r){ return r&&r.includes('Yes')?'badge-green':r==='Maybe'?'badge-yellow':r&&r.includes('No')?'badge-red':'badge-gray'; };
                // Merge owner's direct scores as a row
                var ownerRow = null;
                if (cand && cand.scores && Object.keys(cand.scores).length > 0) {
                  ownerRow = {
                    evaluatorName: user.name || 'You',
                    evaluatorEmail: user.email || '',
                    scores: Object.fromEntries(Object.entries(cand.scores).map(function(e){ return [e[0], {score: e[1].score, note: e[1].note}]; })),
                    recommendation: cand.recommendation || '',
                    notes: cand.overallNotes || '',
                    submittedAt: null,
                    isOwner: true
                  };
                }
                var allScores = ownerRow ? [ownerRow].concat(teamScores) : teamScores;
                if (allScores.length === 0) return <div className="text-muted text-sm">No scores yet. Score directly in Scorecards or share links with interviewers above.</div>;
                return (
                  <div>
                    {/* Recommendation summary row */}
                    <div style={{display:'flex',gap:8,marginBottom:16,flexWrap:'wrap'}}>
                      {allScores.map(function(ts,i){
                        return (
                          <div key={i} style={{flex:1,minWidth:120,background: ts.isOwner ? 'rgba(79,142,247,.08)' : 'var(--surface2)',border:'1px solid '+(ts.isOwner?'rgba(79,142,247,.3)':'var(--border)'),borderRadius:8,padding:'10px 12px',textAlign:'center'}}>
                            <div style={{fontWeight:700,fontSize:12,marginBottom:4}}>{ts.evaluatorName}{ts.isOwner&&<span style={{fontSize:9,color:'var(--accent)',marginLeft:4,fontWeight:600}}>YOU</span>}</div>
                            <div style={{fontSize:10,color:'var(--muted)',marginBottom:6}}>{ts.submittedAt ? fmtDate(ts.submittedAt) : 'Direct score'}</div>
                            {ts.recommendation && <span className={'badge ' + recColor(ts.recommendation)} style={{fontSize:11}}>{ts.recommendation}</span>}
                          </div>
                        );
                      })}
                    </div>

                    {/* Per-requirement grid */}
                    {activeReqs.length > 0 && (
                      <div style={{overflowX:'auto'}}>
                        <table style={{width:'100%',borderCollapse:'collapse',fontSize:12}}>
                          <thead>
                            <tr style={{borderBottom:'2px solid var(--border)'}}>
                              <th style={{textAlign:'left',padding:'8px 10px',fontWeight:700,fontSize:11,color:'var(--muted)',textTransform:'uppercase',letterSpacing:'.06em',minWidth:160}}>Requirement</th>
                              {allScores.map(function(ts,i){
                                return <th key={i} style={{textAlign:'center',padding:'8px 10px',fontWeight:700,fontSize:11,color:ts.isOwner?'var(--accent)':'var(--muted)',textTransform:'uppercase',letterSpacing:'.06em',minWidth:90}}>{ts.evaluatorName.split(' ')[0]}{ts.isOwner?' ★':''}</th>;
                              })}
                              <th style={{textAlign:'center',padding:'8px 10px',fontWeight:700,fontSize:11,color:'var(--muted)',textTransform:'uppercase',letterSpacing:'.06em',minWidth:70}}>Avg</th>
                            </tr>
                          </thead>
                          <tbody>
                            {activeReqs.map(function(req){
                              var reqScores = allScores.map(function(ts){ return ts.scores&&ts.scores[req.id]?ts.scores[req.id].score:null; });
                              var validScores = reqScores.filter(function(s){return s!=null;});
                              var avg = validScores.length ? (validScores.reduce(function(a,b){return a+b;},0)/validScores.length) : null;
                              return (
                                <tr key={req.id} style={{borderBottom:'1px solid var(--border)'}}>
                                  <td style={{padding:'8px 10px'}}>
                                    <div style={{fontWeight:500}}>{req.name}</div>
                                    <div style={{fontSize:10,color:'var(--muted)',marginTop:2,display:'flex',gap:4}}>
                                      {req.mustHave && <span style={{color:'#f75c5c',fontWeight:600}}>Must Have</span>}
                                      {(req.weight||1)>1 && <span style={{color:req.weight===3?'var(--accent2)':'var(--accent)',fontWeight:600}}>{req.weight}×</span>}
                                    </div>
                                  </td>
                                  {reqScores.map(function(s,i){
                                    var note = allScores[i].scores&&allScores[i].scores[req.id]?allScores[i].scores[req.id].note:'';
                                    return (
                                      <td key={i} style={{textAlign:'center',padding:'8px 6px'}} title={note||''}>
                                        {s ? <div style={{width:28,height:28,borderRadius:6,background:scoreColor(s),display:'flex',alignItems:'center',justifyContent:'center',fontWeight:700,fontSize:13,color:'#fff',margin:'auto'}}>{s}</div>
                                          : <div style={{color:'var(--muted)',fontSize:11}}>—</div>}
                                        {note && <div style={{fontSize:9,color:'var(--muted)',marginTop:2,maxWidth:80,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap',margin:'2px auto 0'}}>💬</div>}
                                      </td>
                                    );
                                  })}
                                  <td style={{textAlign:'center',padding:'8px 6px'}}>
                                    {avg ? <div style={{fontWeight:700,fontSize:13,color:scoreColor(Math.round(avg))}}>{avg.toFixed(1)}</div> : <div style={{color:'var(--muted)',fontSize:11}}>—</div>}
                                  </td>
                                </tr>
                              );
                            })}
                          </tbody>
                        </table>
                      </div>
                    )}

                    {/* Individual notes */}
                    {allScores.some(function(ts){return ts.notes;}) && (
                      <div style={{marginTop:16}}>
                        <div style={{fontSize:11,fontWeight:700,color:'var(--muted)',textTransform:'uppercase',letterSpacing:'.07em',marginBottom:8}}>Overall Notes</div>
                        {allScores.filter(function(ts){return ts.notes;}).map(function(ts,i){
                          return (
                            <div key={i} style={{marginBottom:8,padding:'10px 12px',background:'var(--surface2)',borderRadius:8,border:'1px solid var(--border)'}}>
                              <div style={{fontWeight:600,fontSize:12,marginBottom:4}}>{ts.evaluatorName}</div>
                              <div style={{fontSize:12,color:'var(--text2)',lineHeight:1.6}}>{ts.notes}</div>
                            </div>
                          );
                        })}
                      </div>
                    )}
                  </div>
                );
              })()
          }
        </div>
      </>}

      {!selCand && <div className="empty-state"><div className="empty-icon">🔗</div><div className="empty-title">Select a candidate to generate share link</div></div>}
    </div>
  );
}

/* ═══════════════════════════════════════
   EXTERNAL INTERVIEWER SCORECARD
   (shown when URL has ?scorecard=xxx)
   ═══════════════════════════════════════ */
function ExternalScorecard({ candidateId, candidates, setCandidates, positions }) {
  const [step, setStep] = useState(1);
  const urlInterviewer = new URLSearchParams(window.location.search).get('interviewer') || '';
  const [evaluator, setEvaluator] = useState({ name: urlInterviewer, email:'' });
  const [scores, setScores] = useState({});
  const [recommendation, setRecommendation] = useState('');
  const [notes, setNotes] = useState('');
  const [submitted, setSubmitted] = useState(false);

  const [showJD, setShowJD] = useState(false);

  const cand = candidates.find(c=>c.id===candidateId);
  const pos = cand ? positions.find(p=>p.id===cand.positionId) : null;

  if (!cand || !pos) return <div className="external-bg"><div className="external-card"><div style={{textAlign:'center',color:'var(--muted)'}}>Scorecard not found.</div></div></div>;

  const submit = () => {
    const submission = { evaluatorName:evaluator.name, evaluatorEmail:evaluator.email, scores, recommendation, notes, submittedAt:today() };
    setCandidates(cs=>cs.map(c=>c.id===candidateId?{...c,teamScores:[...(c.teamScores||[]),submission]}:c));
    setSubmitted(true);
  };

  if (submitted) return (
    <div className="external-bg">
      <div className="external-card" style={{textAlign:'center'}}>
        <div style={{fontSize:48,marginBottom:16}}>✅</div>
        <div style={{fontSize:22,fontWeight:700,marginBottom:8}}>Thank you, {evaluator.name}!</div>
        <div className="text-muted">Your scorecard for <strong>{cand.name}</strong> has been submitted.</div>
      </div>
    </div>
  );

  const liUrl = cand.linkedIn ? (cand.linkedIn.startsWith('http') ? cand.linkedIn : 'https://' + cand.linkedIn) : null;

  return (
    <div className="external-bg">
      <div className="external-card">
        <div className="auth-brand" style={{marginBottom:4}}>Hiring Command Center</div>
        <div className="text-muted text-sm mb-4">Interview Scorecard</div>

        {/* Candidate header */}
        <div style={{background:'var(--surface2)',border:'1px solid var(--border)',borderRadius:12,padding:'16px',marginBottom:20}}>
          <div style={{display:'flex',alignItems:'flex-start',justifyContent:'space-between',gap:12,marginBottom:12}}>
            <div>
              <div style={{fontWeight:700,fontSize:20,marginBottom:3}}>{cand.name}</div>
              <div style={{fontSize:13,color:'var(--accent)',fontWeight:500}}>{pos.title}</div>
              {cand.stage && <div style={{marginTop:6}}><span className={'badge ' + (STAGE_COLORS[cand.stage]||'badge-gray')} style={{fontSize:11}}>{cand.stage}</span></div>}
            </div>
            <div style={{width:44,height:44,borderRadius:'50%',background:'linear-gradient(135deg,var(--accent),var(--accent2))',display:'flex',alignItems:'center',justifyContent:'center',fontSize:16,fontWeight:700,color:'#fff',flexShrink:0}}>
              {cand.name.split(' ').map(function(n){return n[0];}).join('').slice(0,2).toUpperCase()}
            </div>
          </div>
          <div style={{display:'flex',gap:8,flexWrap:'wrap'}}>
            {liUrl && (
              <a href={liUrl} target="_blank" rel="noopener noreferrer"
                style={{display:'inline-flex',alignItems:'center',gap:5,fontSize:12,color:'#0a66c2',fontWeight:600,textDecoration:'none',background:'rgba(10,102,194,.1)',border:'1px solid rgba(10,102,194,.25)',padding:'5px 12px',borderRadius:20}}>
                💼 LinkedIn Profile
              </a>
            )}
            {pos.jd && (
              <button
                onClick={function(){setShowJD(function(v){return !v;});}}
                style={{display:'inline-flex',alignItems:'center',gap:5,fontSize:12,color:'var(--accent2)',fontWeight:600,background:'rgba(124,92,252,.1)',border:'1px solid rgba(124,92,252,.25)',padding:'5px 12px',borderRadius:20,cursor:'pointer'}}>
                📋 {showJD ? 'Hide' : 'View'} Job Description
              </button>
            )}
          </div>
          {showJD && pos.jd && (
            <div style={{marginTop:12,padding:'12px 14px',background:'var(--surface3)',borderRadius:8,fontSize:12,color:'var(--text2)',lineHeight:1.7,whiteSpace:'pre-wrap',maxHeight:240,overflowY:'auto',border:'1px solid var(--border)'}}>
              {pos.jd}
            </div>
          )}
        </div>

        <hr className="divider"/>

        {step===1 && <>
          <div className="section-title">Your Information</div>
          <div className="field"><label>Your Name *</label><input placeholder="Jane Smith" value={evaluator.name} onChange={e=>setEvaluator(ev=>({...ev,name:e.target.value}))}/></div>
          <div className="field"><label>Your Email</label><input type="email" placeholder="jane@company.com" value={evaluator.email} onChange={e=>setEvaluator(ev=>({...ev,email:e.target.value}))}/></div>
          <button className="btn btn-primary btn-full mt-2" onClick={()=>evaluator.name&&setStep(2)} disabled={!evaluator.name}>Start Scoring →</button>
        </>}

        {step===2 && <>
          <div className="section-title">Rate the Candidate</div>

          {/* Rating scale */}
          <div style={{background:'var(--surface2)',border:'1px solid var(--border)',borderRadius:8,padding:'10px 12px',marginBottom:16}}>
            <div style={{fontWeight:700,fontSize:10,color:'var(--muted)',textTransform:'uppercase',letterSpacing:'.07em',marginBottom:8}}>Rating Scale</div>
            <div style={{display:'flex',flexDirection:'column',gap:4}}>
              {[[1,'No Signal','No evidence — did not demonstrate this','#f75c5c'],[2,'Weak Signal','Some hints but unconvincing','#f7834f'],[3,'Clear Signal','Solid, credible evidence','#f7c94f'],[4,'Strong Signal','Compelling — clearly stood out','#2dd4a0'],[5,'Exceptional Signal','Rare standout, well above the bar','#4f8ef7']].map(function(r){
                return <div key={r[0]} style={{display:'flex',alignItems:'center',gap:8,fontSize:11}}>
                  <div style={{width:18,height:18,borderRadius:4,background:r[3],display:'flex',alignItems:'center',justifyContent:'center',fontSize:10,fontWeight:700,color:'#fff',flexShrink:0}}>{r[0]}</div>
                  <span style={{fontWeight:600,color:r[3],minWidth:110}}>{r[1]}</span>
                  <span style={{color:'var(--muted)'}}>{r[2]}</span>
                </div>;
              })}
            </div>
            <div style={{marginTop:8,paddingTop:8,borderTop:'1px solid var(--border)',fontSize:11,color:'var(--muted)',lineHeight:1.5}}>
              <strong style={{color:'var(--text2)'}}>Must Have</strong> = a score of 1 here disqualifies regardless of other scores.
              <strong style={{color:'var(--text2)'}}> Weighted</strong> requirements (2× or 3×) count more toward the overall score.
            </div>
          </div>

          {(pos.requirements||[]).filter(r=>r.active!==false).length===0 && <div className="text-muted text-sm">No requirements defined for this position.</div>}
          {(pos.requirements||[]).filter(r=>r.active!==false).sort(function(a,b){if(a.mustHave&&!b.mustHave)return -1;if(!a.mustHave&&b.mustHave)return 1;return (b.weight||1)-(a.weight||1);}).map(req=>(
            <div key={req.id} className="card-sm mb-3" style={{background:'var(--surface2)',border:'1px solid var(--border)',borderRadius:8,padding:'12px'}}>
              <div style={{display:'flex',alignItems:'center',gap:6,marginBottom:8,flexWrap:'wrap'}}>
                <span style={{fontWeight:600,fontSize:13,flex:1}}>{req.name}</span>
                {req.mustHave && <span className="badge badge-red" style={{fontSize:10}}>Must Have</span>}
                {(req.weight||1)>1 && <span style={{fontSize:10,fontWeight:700,color:req.weight===3?'var(--accent2)':'var(--accent)',background:req.weight===3?'rgba(124,92,252,.1)':'rgba(79,142,247,.1)',padding:'2px 6px',borderRadius:4}}>{req.weight}× weight</span>}
              </div>
              <ScoreBtns value={scores[req.id]?.score} onChange={v=>setScores(s=>({...s,[req.id]:{...s[req.id],score:v}}))}/>
              {scores[req.id]?.score && <div style={{fontSize:11,color:'var(--muted)',marginTop:4}}>{scoreLabel(scores[req.id].score)}</div>}
              <input className="mt-2" style={{fontSize:12,padding:'6px 10px'}} placeholder="Optional note..." value={scores[req.id]?.note||''} onChange={e=>setScores(s=>({...s,[req.id]:{...s[req.id],note:e.target.value}}))}/>
            </div>
          ))}
          <div className="field mt-4">
            <label>Overall Recommendation</label>
            <div className="flex" style={{flexWrap:'wrap',gap:6}}>
              {['Strong Yes','Yes','Maybe','No','Strong No'].map(r=>(
                <button key={r} className={`btn btn-sm ${recommendation===r?'btn-primary':'btn-secondary'}`} onClick={()=>setRecommendation(r)}>{r}</button>
              ))}
            </div>
          </div>
          <div className="field">
            <label>Overall Notes</label>
            <textarea placeholder="Your overall impression of the candidate..." value={notes} onChange={e=>setNotes(e.target.value)}/>
          </div>
          <button className="btn btn-primary btn-full" onClick={submit}>Submit Scorecard ✓</button>
        </>}
      </div>
    </div>
  );
}


/* ═══════════════════════════════════════
   INVITE MANAGEMENT
   ═══════════════════════════════════════ */
function InviteView({ user, org }) {
  const [invites, setInvites] = React.useState([]);
  const [email, setEmail] = React.useState('');
  const [name, setName] = React.useState('');
  const [loading, setLoading] = React.useState(false);
  const [copied, setCopied] = React.useState('');
  const isAdmin = user.role === 'owner' || user.email === 'ben@tradecoffeeco.com';

  React.useEffect(function() {
    if (!isAdmin) return;
    loadInvites();
  }, []);

  var loadInvites = async function() {
    if (DEMO_MODE) {
      setInvites(window._hccInvites || []);
      return;
    }
    try {
      var result = await supabase.from('invitations').select('*').eq('org_id', org?.id||user.orgId).order('created_at', {ascending:false});
      setInvites(result.data || []);
    } catch(e) {}
  };

  var sendInvite = async function() {
    if (!email.trim()) return;
    setLoading(true);
    var token = uid() + uid();
    var invite = {
      id: uid(),
      email: email.trim().toLowerCase(),
      name: name.trim(),
      org_id: org?.id || user.orgId,
      org_name: org?.name || 'Trade',
      token: token,
      invited_by: user.name || user.email,
      status: 'pending',
      created_at: new Date().toISOString()
    };
    if (DEMO_MODE) {
      window._hccInvites = [...(window._hccInvites||[]), invite];
      setInvites(window._hccInvites);
    } else {
      try {
        await supabase.from('invitations').insert(invite);
        await loadInvites();
      } catch(e) { alert('Could not save invite: ' + e.message); }
    }
    setEmail('');
    setName('');
    setLoading(false);
  };

  var revokeInvite = async function(id) {
    if (!window.confirm('Revoke this invite?')) return;
    if (DEMO_MODE) {
      window._hccInvites = (window._hccInvites||[]).filter(function(i){return i.id!==id;});
      setInvites(window._hccInvites);
      return;
    }
    await supabase.from('invitations').delete().eq('id', id);
    await loadInvites();
  };

  var getInviteLink = function(token, invEmail) {
    return window.location.href.split('?')[0] + '?invite=' + token;
  };

  var copyLink = function(token, invEmail, id) {
    navigator.clipboard.writeText(getInviteLink(token, invEmail));
    setCopied(id);
    setTimeout(function(){setCopied('');}, 2000);
  };

  var openEmail = function(invite) {
    var NL = '%0D%0A';
    var link = getInviteLink(invite.token, invite.email);
    var subject = encodeURIComponent('You have been invited to the Trade Hiring Command Center');
    var body = encodeURIComponent('Hi ' + (invite.name||'there') + ',') + NL + NL +
      encodeURIComponent("I'd like to give you access to Trade's Hiring Command Center (HCC) — our internal tool for managing candidates, scorecards, and the full hiring pipeline.") + NL + NL +
      encodeURIComponent('Click the link below to create your account. It takes about 30 seconds — just set a password and you are in.') + NL + NL +
      encodeURIComponent(link) + NL + NL +
      encodeURIComponent('A few things to know:') + NL +
      encodeURIComponent('- Use this exact email address (' + invite.email + ') to register') + NL +
      encodeURIComponent('- You will have access to all open positions and candidates') + NL +
      encodeURIComponent('- Your invite link is unique to you — please do not share it') + NL + NL +
      encodeURIComponent('Let me know if you have any questions.') + NL + NL +
      encodeURIComponent('— ' + (user.name || 'Ben'));
    window.location.href = 'mailto:' + encodeURIComponent(invite.email) + '?subject=' + subject + '&body=' + body;
  };

  if (!isAdmin) return <div className="page"><div className="empty-state"><div className="empty-icon">🔐</div><div className="empty-title">Admin access only</div></div></div>;

  return (
    <div className="page">
      <div className="page-header">
        <div><div className="page-title">Invite Team Members</div><div className="page-sub">Invite people to access the Hiring Command Center</div></div>
      </div>

      <div className="card mb-4">
        <div className="section-title">Send an Invite</div>
        <div style={{display:'flex',gap:10,flexWrap:'wrap',alignItems:'flex-end'}}>
          <div className="field" style={{margin:0,flex:1,minWidth:180}}>
            <label>Name</label>
            <input placeholder="Jane Smith" value={name} onChange={function(e){setName(e.target.value);}}/>
          </div>
          <div className="field" style={{margin:0,flex:2,minWidth:220}}>
            <label>Email Address</label>
            <input type="email" placeholder="jane@company.com" value={email} onChange={function(e){setEmail(e.target.value);}}
              onKeyDown={function(e){if(e.key==='Enter')sendInvite();}}/>
          </div>
          <button className="btn btn-primary" onClick={sendInvite} disabled={loading||!email.trim()} style={{marginBottom:0}}>
            {loading ? '...' : '+ Generate Invite'}
          </button>
        </div>
        <div style={{fontSize:11,color:'var(--muted)',marginTop:8}}>
          This generates a unique invite link. Copy it and send via email — the recipient uses it to create their account and automatically joins the Trade workspace.
        </div>
      </div>

      <div className="card">
        <div className="section-title">Pending & Active Invites ({invites.length})</div>
        {invites.length === 0
          ? <div className="text-muted text-sm">No invites sent yet.</div>
          : <div style={{display:'flex',flexDirection:'column',gap:8}}>
              {invites.map(function(inv) {
                return (
                  <div key={inv.id} style={{display:'flex',alignItems:'center',gap:12,padding:'10px 14px',background:'var(--surface2)',borderRadius:8,border:'1px solid var(--border)',flexWrap:'wrap'}}>
                    <div style={{flex:1,minWidth:160}}>
                      <div style={{fontWeight:600,fontSize:13}}>{inv.name||inv.email}</div>
                      <div style={{fontSize:11,color:'var(--muted)'}}>{inv.email}</div>
                    </div>
                    <div style={{fontSize:11,color:'var(--muted)'}}>Invited by {inv.invited_by} · {fmtDate(inv.created_at)}</div>
                    <span className={'badge ' + (inv.status==='accepted'?'badge-green':'badge-yellow')} style={{fontSize:10}}>
                      {inv.status==='accepted'?'Joined':'Pending'}
                    </span>
                    <div style={{display:'flex',gap:6}}>
                      <button className="btn btn-secondary btn-xs" onClick={function(){copyLink(inv.token, inv.email, inv.id);}}>
                        {copied===inv.id?'✓ Copied!':'🔗 Copy Link'}
                      </button>
                      <button className="btn btn-primary btn-xs" onClick={function(){openEmail(inv);}}>
                        📧 Send Email Invite
                      </button>
                      {inv.status!=='accepted' && (
                        <button className="btn btn-ghost btn-xs" style={{color:'var(--muted)'}} onClick={function(){revokeInvite(inv.id);}}>Revoke</button>
                      )}
                    </div>
                  </div>
                );
              })}
            </div>
        }
      </div>
    </div>
  );
}

/* ═══════════════════════════════════════
   ADMIN VIEW
   ═══════════════════════════════════════ */
function AdminView({ user }) {
  const [users, setUsers] = useState([]);
  const [orgs, setOrgs] = useState([]);
  const [loading, setLoading] = useState(true);
  const isAdmin = user.role === 'owner' || user.email === 'ben@tradecoffeeco.com';

  useEffect(() => {
    if (!isAdmin) { setLoading(false); return; }
    if (DEMO_MODE) {
      const u = storage.get('hcc_users', []);
      const o = storage.get('hcc_orgs', []);
      setUsers(u);
      setOrgs(o);
      setLoading(false);
    } else {
      Promise.all([
        supabase.from('profiles').select('*').order('created_at', {ascending:false}),
        supabase.from('organizations').select('*').order('created_at', {ascending:false})
      ]).then(([{data:u},{data:o}]) => {
        setUsers(u||[]);
        setOrgs(o||[]);
        setLoading(false);
      });
    }
  }, []);

  if (!isAdmin) {
    return <div className="page"><div className="empty-state"><div className="empty-icon">🔐</div><div className="empty-title">Admin access only</div></div></div>;
  }

  return (
    <div className="page">
      <div className="page-header">
        <div><div className="page-title">🔐 Admin Panel</div><div className="page-sub">All organizations and users</div></div>
      </div>
      {loading ? <div className="text-muted">Loading...</div> : <>
        <div className="card mb-4">
          <div className="section-title">Organizations ({orgs.length})</div>
          <div className="table-wrap"><table>
            <thead><tr><th>Organization</th><th>ID</th><th>Created</th></tr></thead>
            <tbody>
              {orgs.map(o=>(
                <tr key={o.id}>
                  <td style={{fontWeight:600}}>{o.name}</td>
                  <td className="text-muted" style={{fontFamily:'var(--mono)',fontSize:11}}>{o.id}</td>
                  <td className="text-muted">{fmtDate(o.created_at||o.createdAt)}</td>
                </tr>
              ))}
            </tbody>
          </table></div>
        </div>
        <div className="card">
          <div className="section-title">Users ({users.length})</div>
          <div className="table-wrap"><table>
            <thead><tr><th>Name</th><th>Email</th><th>Role</th><th>Org</th><th>Joined</th></tr></thead>
            <tbody>
              {users.map(u=>{
                const org = orgs.find(o=>o.id===(u.org_id||u.orgId));
                return (
                  <tr key={u.id}>
                    <td style={{fontWeight:600}}>{u.name}</td>
                    <td>{u.email}</td>
                    <td><span className={`badge ${u.role==='owner'?'badge-purple':'badge-blue'}`}>{u.role}</span></td>
                    <td className="text-muted">{org?.name||'—'}</td>
                    <td className="text-muted">{fmtDate(u.created_at||u.createdAt)}</td>
                  </tr>
                );
              })}
            </tbody>
          </table></div>
        </div>
      </>}
    </div>
  );
}

/* ═══════════════════════════════════════
   MAIN APP
   ═══════════════════════════════════════ */
function App() {
  const [user, setUser] = useState(null);
  const [org, setOrg] = useState(null);
  const [view, setView] = useState('dashboard');
  const [filterPos, setFilterPos] = useState('all');
  const [filterInterviewCand, setFilterInterviewCand] = useState('');
  const [showProfile, setShowProfile] = useState(false);
  const [syncStatus, setSyncStatus] = useState('');
  const [debugLog, setDebugLog] = useState([]);
  const [showDebug, setShowDebug] = useState(false);
  const addDebug = (msg) => setDebugLog(l => [...l.slice(-20), new Date().toLocaleTimeString() + ': ' + msg]);

  const [positions, setPositionsState] = useState([]);
  const [candidates, setCandidatesState] = useState([]);
  const [requirements, setRequirementsState] = useState(DEFAULT_REQUIREMENTS);

  // Check URL for external scorecard
  const urlParams = new URLSearchParams(window.location.search);
  const scorecardId = urlParams.get('scorecard');

  // Load data for external scorecard without login
  useEffect(function(){
    if (!scorecardId || DEMO_MODE || !supabase) return;
    // Fetch all app_data to find this candidate
    supabase.from('app_data').select('*').then(function(result){
      if (!result.data) return;
      result.data.forEach(function(row){
        if (row.data_type==='candidates' && Array.isArray(row.data)) {
          var found = row.data.find(function(c){return c.id===scorecardId;});
          if (found) {
            setCandidatesState(row.data);
            // Also load positions for same org
            var posRow = result.data.find(function(r){return r.data_type==='positions' && r.org_id===row.org_id;});
            if (posRow && posRow.data) setPositionsState(posRow.data);
          }
        }
      });
    });
  }, [scorecardId]);

  // Data persistence handled in setters above

  // Refresh data from Supabase when app comes back into focus
  useEffect(()=>{
    if (DEMO_MODE || !supabase) return;
    const refreshData = async () => {
      if (!user) return;
      try {
        const { data: appData, error: refreshErr } = await supabase.from('app_data').select('*').eq('org_id', user.orgId);
        if (!appData) return;
        const pos = appData.find(d=>d.data_type==='positions');
        const cand = appData.find(d=>d.data_type==='candidates');
        const req = appData.find(d=>d.data_type==='requirements');
        if (pos?.data) setPositionsState(pos.data);
        if (cand?.data) setCandidatesState(cand.data);
        if (req?.data) setRequirementsState(req.data);
      } catch(e) { console.warn('Refresh error:', e); }
    };
    // Refresh when tab becomes visible
    document.addEventListener('visibilitychange', ()=>{ if(!document.hidden) refreshData(); });
    // Refresh every 30 seconds while active
    const interval = setInterval(refreshData, 30000);
    return () => {
      clearInterval(interval);
      document.removeEventListener('visibilitychange', refreshData);
    };
  }, [user]);

  // Save to Supabase as JSON blob
  const syncToSupabase = async (dataType, data, orgId) => {
    if (DEMO_MODE || !supabase || !orgId) return;
    try {
      setSyncStatus('syncing');
      const { error } = await supabase.from('app_data').upsert(
        { org_id: orgId, data_type: dataType, data: data, updated_at: new Date().toISOString() },
        { onConflict: 'org_id,data_type' }
      );
      if (error) { setSyncStatus('error'); console.error('Sync error:', error); }
      else { setSyncStatus('synced'); setTimeout(()=>setSyncStatus(''), 3000); }
    } catch(e) { setSyncStatus('error'); console.warn('Sync error:', e); }
  };

  const setPositions = (fn) => {
    setPositionsState(prev => {
      const next = typeof fn === 'function' ? fn(prev) : fn;
      if (!DEMO_MODE && user) syncToSupabase('positions', next, user.orgId);
      else if (user) localStorage.setItem('hcc_positions_'+user.orgId, JSON.stringify(next));
      return next;
    });
  };
  const setCandidates = (fn) => {
    setCandidatesState(prev => {
      const next = typeof fn === 'function' ? fn(prev) : fn;
      if (!DEMO_MODE && user) syncToSupabase('candidates', next, user.orgId);
      else if (user) localStorage.setItem('hcc_candidates_'+user.orgId, JSON.stringify(next));
      return next;
    });
  };
  const setRequirements = (fn) => {
    setRequirementsState(prev => {
      const next = typeof fn === 'function' ? fn(prev) : fn;
      if (!DEMO_MODE && user) syncToSupabase('requirements', next, user.orgId);
      else if (user) localStorage.setItem('hcc_requirements_'+user.orgId, JSON.stringify(next));
      return next;
    });
  };

  // Restore Supabase session on load
  useEffect(()=>{
    if (!DEMO_MODE && supabase) {
      supabase.auth.getSession().then(async ({ data: { session } }) => {
        if (session) {
          const { data: profile } = await supabase.from('profiles').select('*').eq('id', session.user.id).single();
          if (profile) {
            const { data: org } = await supabase.from('organizations').select('*').eq('id', profile.org_id).single();
            const u = { id: session.user.id, name: profile.name, email: profile.email, orgId: profile.org_id, role: profile.role };
            setUser(u); setOrg(org);
            // Load from Supabase cloud
            addDebug('Loading org: ' + profile.org_id);
            const { data: appData, error: loadErr } = await supabase.from('app_data').select('*').eq('org_id', profile.org_id);
            addDebug(loadErr ? 'ERROR: '+JSON.stringify(loadErr) : 'Got '+( appData?.length||0)+' rows');
            addDebug(loadErr ? 'LOAD ERROR: ' + JSON.stringify(loadErr) : 'Got ' + (appData?.length||0) + ' data rows');
            const pos = appData?.find(d=>d.data_type==='positions');
            const cand = appData?.find(d=>d.data_type==='candidates');
            const req = appData?.find(d=>d.data_type==='requirements');
            addDebug('pos:' + (pos?.data?.length||0) + ' cand:' + (cand?.data?.length||0));
            if (pos?.data?.length) {
              setPositionsState(pos.data);
              if (cand?.data?.length) setCandidatesState(cand.data);
              if (req?.data?.length) setRequirementsState(req.data);
              else setRequirementsState(DEFAULT_REQUIREMENTS);
            } else {
              // Fall back to localStorage and migrate
              const lp = localStorage.getItem('hcc_positions_'+profile.org_id);
              const lc = localStorage.getItem('hcc_candidates_'+profile.org_id);
              const lr = localStorage.getItem('hcc_requirements_'+profile.org_id);
              const posData = lp ? JSON.parse(lp) : [];
              const candData = lc ? JSON.parse(lc) : [];
              const reqData = lr ? JSON.parse(lr) : DEFAULT_REQUIREMENTS;
              setPositionsState(posData);
              setCandidatesState(candData);
              setRequirementsState(reqData);
              if (posData.length || candData.length) {
                Promise.all([
                  supabase.from('app_data').upsert({org_id:profile.org_id,data_type:'positions',data:posData},{onConflict:'org_id,data_type'}),
                  supabase.from('app_data').upsert({org_id:profile.org_id,data_type:'candidates',data:candData},{onConflict:'org_id,data_type'}),
                  supabase.from('app_data').upsert({org_id:profile.org_id,data_type:'requirements',data:reqData},{onConflict:'org_id,data_type'})
                ]).then(()=>console.log('Migrated localStorage to Supabase'));
              }
            }
          }
        }
      });
    }
  },[]);

  // Check for existing demo session
  useEffect(()=>{
    const session = storage.get('hcc_session', null);
    if (session && session.id && (!session.expiresAt || session.expiresAt > Date.now())) {
      // Refresh expiry on each visit
      storage.set('hcc_session', {...session, expiresAt: Date.now() + 30*24*60*60*1000});
      const orgData = storage.get('hcc_orgs', []).find(o=>o.id===session.orgId);
      setUser(session);
      setOrg(orgData);
      // Load org data
      const p = localStorage.getItem('hcc_positions_'+session.orgId);
      const c = localStorage.getItem('hcc_candidates_'+session.orgId);
      const r = localStorage.getItem('hcc_requirements_'+session.orgId);
      if (p) setPositionsState(JSON.parse(p));
      if (c) setCandidatesState(JSON.parse(c));
      if (r) setRequirementsState(JSON.parse(r));
    }
  },[]);

  // If external scorecard link
  if (scorecardId) {
    return <ExternalScorecard candidateId={scorecardId} candidates={candidates} setCandidates={setCandidates} positions={positions}/>;
  }

  if (!user) {
    return <AuthScreen onAuth={async (u,o)=>{
      setUser(u); setOrg(o);
      if (!DEMO_MODE && supabase) {
        const { data: appData } = await supabase.from('app_data').select('*').eq('org_id', u.orgId);
        const pos = appData?.find(d=>d.data_type==='positions');
        const cand = appData?.find(d=>d.data_type==='candidates');
        const req = appData?.find(d=>d.data_type==='requirements');

        if (pos?.data?.length) {
          // Cloud data exists - use it
          setPositionsState(pos.data);
          if (cand?.data?.length) setCandidatesState(cand.data);
          if (req?.data?.length) setRequirementsState(req.data);
          else setRequirementsState(DEFAULT_REQUIREMENTS);
        } else {
          // No cloud data - check localStorage and migrate up
          const lp = localStorage.getItem('hcc_positions_'+u.orgId);
          const lc = localStorage.getItem('hcc_candidates_'+u.orgId);
          const lr = localStorage.getItem('hcc_requirements_'+u.orgId);
          const posData = lp ? JSON.parse(lp) : [];
          const candData = lc ? JSON.parse(lc) : [];
          const reqData = lr ? JSON.parse(lr) : DEFAULT_REQUIREMENTS;
          setPositionsState(posData);
          setCandidatesState(candData);
          setRequirementsState(reqData);
          // Migrate to Supabase
          if (posData.length || candData.length) {
            Promise.all([
              supabase.from('app_data').upsert({org_id:u.orgId,data_type:'positions',data:posData},{onConflict:'org_id,data_type'}),
              supabase.from('app_data').upsert({org_id:u.orgId,data_type:'candidates',data:candData},{onConflict:'org_id,data_type'}),
              supabase.from('app_data').upsert({org_id:u.orgId,data_type:'requirements',data:reqData},{onConflict:'org_id,data_type'})
            ]).then(()=>console.log('Migrated localStorage to Supabase'));
          }
        }
      } else {
        const p = localStorage.getItem('hcc_positions_'+u.orgId);
        const c = localStorage.getItem('hcc_candidates_'+u.orgId);
        const r = localStorage.getItem('hcc_requirements_'+u.orgId);
        if (p) setPositionsState(JSON.parse(p));
        if (c) setCandidatesState(JSON.parse(c));
        if (r) setRequirementsState(JSON.parse(r));
      }
    }}/>;
  }

  const NAV = [
    { id:'dashboard', icon:'🏠', label:'Dashboard' },
    { id:'positions', icon:'📋', label:'Positions' },
    { id:'candidates', icon:'👤', label:'Candidates' },
    { id:'scorecards', icon:'⭐', label:'Scorecards' },
    { id:'interviews', icon:'🎙️', label:'Interview Notes' },
    { id:'references', icon:'📞', label:'Reference Checks' },
    { id:'comparison', icon:'⚖️', label:'Comparison' },
    { id:'team', icon:'🔗', label:'Team Scoring' },
    { id:'jdbuilder', icon:'✍️', label:'JD Builder' },
    { id:'requirements', icon:'📚', label:'Requirements Library' },
    { id:'linkedin', icon:'💼', label:'LinkedIn' },
    { id:'invite', icon:'✉️', label:'Invite' },
  { id:'admin', icon:'🔐', label:'Admin' },
  ];

  const renderView = () => {
    switch(view) {
      case 'dashboard': return <Dashboard user={user} org={org} positions={positions} candidates={candidates} setView={setView} setFilterPos={setFilterPos}/>;
      case 'positions': return <PositionsView positions={positions} setPositions={setPositions} requirements={requirements} setRequirements={setRequirements} candidates={candidates}/>;
      case 'candidates': return <CandidatesView candidates={candidates} setCandidates={setCandidates} positions={positions} initialFilter={filterPos} onFilterUsed={()=>setFilterPos('all')} setView={setView} setFilterInterviewCand={setFilterInterviewCand}/>;
      case 'scorecards': return <ScorecardsView candidates={candidates} setCandidates={setCandidates} positions={positions}/>;
      case 'interviews': return <InterviewsView candidates={candidates} setCandidates={setCandidates} positions={positions} initialCand={filterInterviewCand} onCandUsed={()=>setFilterInterviewCand('')}/>;
      case 'references': return <ReferenceChecksView candidates={candidates} setCandidates={setCandidates} positions={positions}/>;
      case 'comparison': return <ComparisonView candidates={candidates} positions={positions}/>;
      case 'team': return <TeamScoringView positions={positions} candidates={candidates} setCandidates={setCandidates}/>;
      case 'jdbuilder': return <JDBuilderView positions={positions} setPositions={setPositions} requirements={requirements}/>;
      case 'requirements': return <RequirementsView requirements={requirements} setRequirements={setRequirements}/>;
      case 'invite': return <InviteView user={user} org={org}/>;
      case 'admin': return <AdminView user={user}/>;
      default: return null;
    }
  };

  const initials = user && user.name ? user.name.split(' ').map(n=>n[0]).join('').slice(0,2).toUpperCase() : '';

  return (
    <div className="app">
      {showProfile && (
        <div className="modal-overlay" onClick={e=>e.target===e.currentTarget&&setShowProfile(false)}>
          <div className="modal">
            <div className="modal-header">
              <div className="modal-title">My Account</div>
              <button className="modal-close" onClick={()=>setShowProfile(false)}>×</button>
            </div>
            <div className="modal-body">
              <div style={{textAlign:'center',marginBottom:24}}>
                <div style={{width:72,height:72,borderRadius:'50%',background:'linear-gradient(135deg,var(--accent),var(--accent2))',display:'flex',alignItems:'center',justifyContent:'center',fontSize:28,fontWeight:700,color:'#fff',margin:'0 auto 12px'}}>
                  {initials}
                </div>
                <div style={{fontSize:20,fontWeight:700}}>{user.name}</div>
                <div style={{color:'var(--muted)',fontSize:13,marginTop:4}}>{user.role}</div>
              </div>
              <div className="card" style={{marginBottom:12}}>
                <div className="section-title">Account Details</div>
                <div className="info-row"><span className="info-key">Email</span><span className="info-val">{user.email}</span></div>
                <div className="info-row"><span className="info-key">Role</span><span className="info-val" style={{textTransform:'capitalize'}}>{user.role}</span></div>
                <div className="info-row"><span className="info-key">Organization</span><span className="info-val">{org?.name||'—'}</span></div>
              </div>
              <button className="btn btn-danger btn-full" onClick={()=>{storage.set('hcc_session',null);setUser(null);setOrg(null);}}>
                🚪 Sign Out
              </button>
            </div>
          </div>
        </div>
      )}
      <div className="sidebar">
        <div className="sidebar-brand">
          <div style={{display:'flex',alignItems:'center',justifyContent:'space-between'}}>
            <div>
              <div className="sidebar-brand-name">HCC</div>
              <div style={{fontSize:10,color:'var(--muted)',marginTop:1}}>Hiring Command Center</div>
              <div className="sidebar-org">{org?.name||'My Organization'}{syncStatus==='synced'?' · Synced':syncStatus==='syncing'?' · Syncing...':''}</div>
            </div>
            <div className="user-avatar" style={{width:30,height:30,fontSize:12,cursor:'pointer'}} onClick={()=>setShowProfile(true)}>{initials}</div>
          </div>
          <div style={{display:'flex',alignItems:'center',gap:5,marginTop:8,flexWrap:'wrap'}}>
            <a href="https://claude.ai/chat/368d0429-758e-40c9-b69a-5edecd902067" target="_blank" rel="noopener noreferrer" title="Open HCC dev chat" style={{display:'inline-flex',alignItems:'center',gap:3,padding:'3px 7px',borderRadius:20,background:'linear-gradient(135deg,rgba(79,142,247,.15),rgba(124,92,252,.15))',border:'1px solid rgba(79,142,247,.3)',textDecoration:'none'}}><span style={{fontSize:11}}>✦</span><span style={{fontSize:10,fontWeight:700,color:'var(--accent)'}}>Dev</span></a>
            <a href="https://github.com/benfischman71/hiring-command-center/blob/main/index.html" target="_blank" rel="noopener noreferrer" title="GitHub repository" style={{display:'inline-flex',alignItems:'center',gap:3,padding:'3px 7px',borderRadius:20,background:'rgba(45,212,160,.1)',border:'1px solid rgba(45,212,160,.25)',textDecoration:'none'}}><span style={{fontSize:11}}>⌥</span><span style={{fontSize:10,fontWeight:700,color:'var(--accent3)'}}>Code</span></a>
            <button onClick={function(){if(window.confirm('Clear cache and reload?')){caches.keys().then(function(names){names.forEach(function(n){caches.delete(n);});}).catch(function(){}).finally(function(){window.location.reload(true);});}}} title="Clear cache and hard reload" style={{display:'inline-flex',alignItems:'center',gap:3,padding:'3px 7px',borderRadius:20,background:'rgba(247,92,92,.1)',border:'1px solid rgba(247,92,92,.25)',cursor:'pointer'}}><span style={{fontSize:11}}>↺</span><span style={{fontSize:10,fontWeight:700,color:'var(--red)'}}>Cache</span></button>
            {syncStatus==='syncing' && <span style={{fontSize:10,color:'var(--yellow)',fontWeight:600}}>⏳</span>}
            {syncStatus==='error' && <span style={{fontSize:10,color:'var(--red)',fontWeight:600}}>⚠️</span>}
          </div>
        </div>
        <div className="nav-section">
          {NAV.filter(n=>n.id!=='admin'||(user.role==='owner'||user.email==='ben@tradecoffeeco.com')).map(n=>(
            <button key={n.id} className={`nav-item ${view===n.id?'active':''}`} 
              onClick={()=>n.id==='linkedin'?window.open('https://www.linkedin.com','_blank'):setView(n.id)}
              style={n.id==='linkedin'?{color:'#0a66c2',fontWeight:700}:{}}>
              <span className="nav-icon">{n.icon}</span>{n.label}
            </button>
          ))}
        </div>
        <div className="sidebar-footer">
          <div className="user-pill" style={{cursor:'pointer'}} onClick={()=>setShowProfile(true)}>
            <div className="user-avatar">{initials}</div>
            <div className="user-info">
              <div className="user-name">{user.name}</div>
              <div className="user-role" style={{color:'var(--accent)',fontSize:10}}>View Account →</div>
            </div>
          </div>
          <div className="flex gap-2 mt-2">
            <button className="btn btn-ghost btn-sm" style={{flex:1,justifyContent:'flex-start',gap:8}} onClick={()=>{storage.set('hcc_session',null);setUser(null);setOrg(null);}}>
              🚪 Sign Out
            </button>
<button className="btn btn-ghost btn-sm" style={{color:'var(--muted)',fontSize:11}} onClick={()=>setShowDebug(d=>!d)} title="Debug log">🔍</button>
          </div>
        </div>
      </div>
      <div className="main">

        {renderView()}
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
