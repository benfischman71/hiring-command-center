   ═══════════════════════════════════════ */
const TRADE_TEAM = [
  'Ben Fischman',
  'Add team member...'
];

function InterviewTeamEditor({ interviewers, onChange }) {
  const [newName, setNewName] = useState('');
  const [showInput, setShowInput] = useState(false);

  const add = function(name) {
    var trimmed = name.trim();
    if (!trimmed || interviewers.some(function(i){return i.name.toLowerCase()===trimmed.toLowerCase();})) return;
    onChange([...interviewers, {id: uid(), name: trimmed, role: ''}]);
    setNewName('');
    setShowInput(false);
  };

  const remove = function(id) {
    onChange(interviewers.filter(function(i){return i.id!==id;}));
  };

  const updateRole = function(id, role) {
    onChange(interviewers.map(function(i){return i.id===id?{...i,role:role}:i;}));
  };

  return (
    <div style={{background:'var(--surface2)',border:'1px solid var(--border)',borderRadius:10,padding:'12px 14px'}}>
      {interviewers.length === 0 && !showInput && (
        <div style={{fontSize:12,color:'var(--muted)',marginBottom:10}}>No interviewers added yet.</div>
      )}

      {/* Existing interviewers */}
      {interviewers.length > 0 && (
        <div style={{display:'flex',flexDirection:'column',gap:6,marginBottom:10}}>
          {interviewers.map(function(interviewer) {
            return (
              <div key={interviewer.id} style={{display:'flex',alignItems:'center',gap:8,padding:'7px 10px',background:'var(--surface3)',borderRadius:8,border:'1px solid var(--border)'}}>
                <div style={{width:28,height:28,borderRadius:'50%',background:'linear-gradient(135deg,var(--accent),var(--accent2))',display:'flex',alignItems:'center',justifyContent:'center',fontSize:11,fontWeight:700,color:'#fff',flexShrink:0}}>
                  {interviewer.name.split(' ').map(function(n){return n[0];}).join('').slice(0,2).toUpperCase()}
                </div>
                <div style={{flex:1,minWidth:0}}>
                  <div style={{fontSize:13,fontWeight:600}}>{interviewer.name}</div>
                  <input
                    placeholder="Role / focus area (e.g. Culture fit, Technical)"
                    value={interviewer.role||''}
                    onChange={function(e){updateRole(interviewer.id, e.target.value);}}
                    style={{fontSize:11,padding:'2px 0',background:'transparent',border:'none',color:'var(--muted)',width:'100%',outline:'none'}}
                  />
                </div>
                <button className="btn btn-ghost btn-xs" style={{color:'var(--muted)',flexShrink:0}} onClick={function(){remove(interviewer.id);}}>✕</button>
              </div>
            );
          })}
        </div>
      )}

      {/* Add new interviewer */}
      {showInput ? (
        <div style={{display:'flex',gap:6,alignItems:'center'}}>
          <input
            autoFocus
            placeholder="Interviewer name..."
            value={newName}
            onChange={function(e){setNewName(e.target.value);}}
            onKeyDown={function(e){if(e.key==='Enter')add(newName);if(e.key==='Escape'){setShowInput(false);setNewName('');}}}
            style={{flex:1,fontSize:12,padding:'6px 10px'}}
          />
          <button className="btn btn-primary btn-xs" onClick={function(){add(newName);}} disabled={!newName.trim()}>Add</button>
          <button className="btn btn-ghost btn-xs" onClick={function(){setShowInput(false);setNewName('');}}>Cancel</button>
        </div>
      ) : (
        <button className="btn btn-secondary btn-xs" style={{width:'100%',justifyContent:'center',marginTop:interviewers.length>0?4:0}}
          onClick={function(){setShowInput(true);}}>
          + Add Interviewer
        </button>
      )}
    </div>
  );
}


function LettersSection({ letters, onChange }) {
  const [dragging, setDragging] = React.useState(false);
  const [editingId, setEditingId] = React.useState(null);
  const [processing, setProcessing] = React.useState(false);

  var extractPdfWithClaude = async function(file) {
    return new Promise(function(resolve, rej) {
      var reader = new FileReader();
      reader.onload = async function(e) {
        var base64 = e.target.result.split(',')[1];
        try {
          var resp = await fetch('https://sncfmxqwpfxhztaxuhdu.supabase.co/functions/v1/claude-proxy', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + SUPABASE_ANON_KEY },
            body: JSON.stringify({
              messages: [{ role: 'user', content: [
                { type: 'document', source: { type: 'base64', media_type: 'application/pdf', data: base64 } },
                { type: 'text', text: 'Extract all the text from this document. Return only the text content, preserving paragraphs. No commentary.' }
              ]}],
              max_tokens: 2000
            })
          });
          var data = await resp.json();
          var text = data.text || (Array.isArray(data.content) ? data.content.filter(function(b){return b.type==='text';}).map(function(b){return b.text;}).join('') : '');
          resolve(text || '[Could not extract text — try pasting the content manually]');
        } catch(e) { resolve('[Could not extract PDF text — try pasting manually]'); }
      };
      reader.readAsDataURL(file);
    });
  };

  var readFile = async function(file) {
    if (file.type === 'application/pdf') {
      return await extractPdfWithClaude(file);
    }
    return new Promise(function(resolve) {
      var reader = new FileReader();
      reader.onload = function(e) { resolve(e.target.result); };
      reader.readAsText(file);
    });
  };

  var addLetter = function(content, filename) {
    var letter = {
      id: uid(),
      author: filename ? filename.replace(/\.[^.]+$/, '').replace(/_/g,' ') : 'Candidate',
      content: content,
      uploadedAt: new Date().toISOString()
    };
    onChange(function(prev) { return [...(prev||[]), letter]; });
  };

  var handleDrop = async function(e) {
    e.preventDefault();
    setDragging(false);
    var files = Array.from(e.dataTransfer.files);
    var text = e.dataTransfer.getData('text');
    if (text && text.length > 20) { addLetter(text, 'Pasted note'); return; }
    setProcessing(true);
    for (var f of files) {
      var content = await readFile(f);
      addLetter(content, f.name);
    }
    setProcessing(false);
  };

  var handleFileInput = async function(e) {
    var files = Array.from(e.target.files);
    setProcessing(true);
    for (var f of files) {
      var content = await readFile(f);
      addLetter(content, f.name);
    }
    setProcessing(false);
    e.target.value = '';
  };

  var updateLetter = function(id, field, val) {
    onChange(function(prev) { return (prev||[]).map(function(l) { return l.id===id ? {...l, [field]: val} : l; }); });
  };

  var removeLetter = function(id) {
    onChange(function(prev) { return (prev||[]).filter(function(l) { return l.id!==id; }); });
  };

  return (
    <div className="field" style={{margin:0}}>
      <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:8,marginTop:4}}>
        <label style={{margin:0}}>Notes from Candidate</label>
        <span style={{fontSize:11,color:'var(--muted)'}}>Drag, drop, or paste</span>
      </div>

      {/* Drop zone */}
      <div
        onDragOver={function(e){e.preventDefault();setDragging(true);}}
        onDragLeave={function(){setDragging(false);}}
        onDrop={handleDrop}
        onClick={function(){document.getElementById('candidate-note-file-input').click();}}
        style={{
          border:'2px dashed '+(dragging?'var(--accent)':'var(--border)'),
          borderRadius:8, padding:'14px', textAlign:'center', cursor:'pointer',
          background:dragging?'rgba(79,142,247,.05)':'var(--surface2)',
          transition:'all .15s', marginBottom:10
        }}>
        {processing
          ? <><div style={{fontSize:20,marginBottom:4}}>⏳</div><div style={{fontSize:12,fontWeight:600,color:'var(--accent)'}}>Extracting text with Claude...</div></>
          : <><div style={{fontSize:20,marginBottom:4}}>📄</div><div style={{fontSize:12,fontWeight:600,color:'var(--text2)'}}>Drop file here or click to upload</div><div style={{fontSize:11,color:'var(--muted)',marginTop:2}}>.txt, .pdf · Claude will extract PDF text automatically</div></>
        }
      </div>
      <input id="candidate-note-file-input" type="file" accept=".txt,.pdf,.doc,.docx" multiple style={{display:'none'}} onChange={handleFileInput}/>

      {/* Existing letters */}
      {(letters||[]).map(function(letter) {
        return (
          <div key={letter.id} style={{background:'var(--surface2)',border:'1px solid var(--border)',borderRadius:8,marginBottom:8,overflow:'hidden'}}>
            <div style={{display:'flex',alignItems:'center',gap:8,padding:'8px 12px',background:'var(--surface3)',borderBottom:'1px solid var(--border)'}}>
              <span style={{fontSize:14}}>📝</span>
              <input
                value={letter.author}
                onChange={function(e){updateLetter(letter.id,'author',e.target.value);}}
                placeholder="From (e.g. candidate name)..."
                style={{flex:1,fontSize:12,fontWeight:600,background:'transparent',border:'none',color:'var(--text)',outline:'none'}}
              />
              <button onClick={function(){setEditingId(editingId===letter.id?null:letter.id);}}
                style={{background:'none',border:'none',cursor:'pointer',fontSize:11,color:'var(--muted)'}}>
                {editingId===letter.id?'▲ Collapse':'▼ Edit'}
              </button>
              <button onClick={function(){if(window.confirm('Remove this note?'))removeLetter(letter.id);}}
                style={{background:'none',border:'none',cursor:'pointer',fontSize:13,color:'var(--muted)'}}>×</button>
            </div>
            {editingId===letter.id && (
              <textarea
                value={letter.content}
                onChange={function(e){updateLetter(letter.id,'content',e.target.value);}}
                placeholder="Paste or type the note content here..."
                style={{width:'100%',minHeight:120,fontSize:12,lineHeight:1.6,padding:'10px 12px',background:'var(--surface)',border:'none',color:'var(--text)',resize:'vertical',boxSizing:'border-box'}}
              />
            )}
          </div>
        );
      })}
    </div>
  );
}

function CandidateModal({ candidate, positions, onSave, onClose }) {
  // Seed initial richProfile from existing candidate data or saved richProfile
  var seedProfile = null;
  if (candidate && candidate.richProfile) {
    seedProfile = candidate.richProfile;
  } else if (candidate && candidate.name) {
    seedProfile = {
      name: candidate.name || '',
      email: candidate.email || '',
      phone: candidate.phone || '',
      linkedIn: candidate.linkedIn || '',
      currentTitle: '',
      currentCompany: '',
      summary: candidate.notes || '',
      workHistory: [],
      education: [],
      skills: []
    };
  }

  const [form, setForm] = useState(candidate || { name:'', email:'', phone:'', positionId:'', stage:'Applied', linkedIn:'', notes:'' });
  const [liText, setLiText] = useState('');
  const [liLoading, setLiLoading] = useState(false);
  const [liError, setLiError] = useState('');
  const [aiImportMode, setAiImportMode] = useState('');
  const [dragOver, setDragOver] = useState(false);
  const [resumeLoading, setResumeLoading] = useState(false);
  const [resumeError, setResumeError] = useState('');
  const [resumeFileName, setResumeFileName] = useState('');
  const [parsedProfile, setParsedProfile] = useState(seedProfile);
  const fileInputRef = React.useRef(null);
  const update = (k,v) => setForm(f=>({...f,[k]:v}));

  const RICH_PROMPT = 'Extract a complete candidate profile from this content. Return ONLY a raw JSON object (no markdown, no backticks) with these exact fields: name (string), email (string), phone (string), linkedIn (string, full URL if found), currentTitle (string), currentCompany (string), summary (2-3 sentence professional overview), workHistory (array of objects: {title, company, dates, bullets: string[max 3 bullets]}), education (array of objects: {institution, degree, year}), skills (array of up to 12 skill strings). Use empty string or empty array if a field is not found.';

  // MERGE new parsed data into existing profile - never wipe what we already have
  const applyParsed = function(parsed) {
    setParsedProfile(function(existing) {
      var base = existing || {};
      // Merge scalar fields - only overwrite if new value is non-empty
      var merged = {
        name: parsed.name || base.name || '',
        email: parsed.email || base.email || '',
        phone: parsed.phone || base.phone || '',
        linkedIn: parsed.linkedIn || base.linkedIn || '',
        currentTitle: parsed.currentTitle || base.currentTitle || '',
        currentCompany: parsed.currentCompany || base.currentCompany || '',
        summary: parsed.summary || base.summary || '',
        // Merge arrays - dedupe by title+company for workHistory, by institution for education, by value for skills
        workHistory: mergeWorkHistory(base.workHistory || [], parsed.workHistory || []),
        education: mergeEducation(base.education || [], parsed.education || []),
        skills: mergeSkills(base.skills || [], parsed.skills || [])
      };
      return merged;
    });
    // Update form fields - only fill blanks
    setForm(function(f) {
      var noteParts = [];
      if (parsed.currentTitle) noteParts.push(parsed.currentTitle);
      if (parsed.currentCompany) noteParts.push(parsed.currentCompany);
      if (parsed.summary) noteParts.push(parsed.summary);
      return {
        ...f,
        name: f.name || parsed.name || '',
        email: f.email || parsed.email || '',
        phone: f.phone || parsed.phone || '',
        linkedIn: f.linkedIn || parsed.linkedIn || '',
        notes: f.notes || noteParts.filter(Boolean).join(' | ')
      };
    });
  };

  function mergeWorkHistory(existing, incoming) {
    var result = existing.slice();
    incoming.forEach(function(job) {
      var key = (job.title||'') + '|' + (job.company||'');
      var alreadyExists = result.some(function(r){ return ((r.title||'')+'|'+(r.company||'')) === key; });
      if (!alreadyExists) result.push(job);
    });
    return result;
  }
  function mergeEducation(existing, incoming) {
    var result = existing.slice();
    incoming.forEach(function(ed) {
      var alreadyExists = result.some(function(r){ return (r.institution||'') === (ed.institution||''); });
      if (!alreadyExists) result.push(ed);
    });
    return result;
  }
  function mergeSkills(existing, incoming) {
    var combined = existing.slice();
    incoming.forEach(function(sk) {
      if (!combined.some(function(s){ return s.toLowerCase() === sk.toLowerCase(); })) combined.push(sk);
    });
    return combined.slice(0, 16);
  }

  const parseLinkedIn = async function() {
    if (!liText.trim()) return;
    setLiLoading(true); setLiError('');
    try {
      const response = await fetch('https://sncfmxqwpfxhztaxuhdu.supabase.co/functions/v1/claude-proxy', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + SUPABASE_ANON_KEY },
        body: JSON.stringify({ prompt: RICH_PROMPT + ' Content: ' + liText.slice(0, 3500), max_tokens: 2000 })
      });
      const data = await response.json();
      if (data.error) throw new Error(data.error);
      applyParsed(JSON.parse(data.text.replace(/```json|```/g,'').trim()));
      setAiImportMode('');
      setLiText('');
    } catch(e) {
      setLiError('Could not parse: ' + e.message);
    }
    setLiLoading(false);
  };

  const processResumeFile = async function(file) {
    if (!file) return;
    setResumeLoading(true); setResumeError(''); setResumeFileName(file.name);
    try {
      const isPdf = file.type === 'application/pdf' || file.name.endsWith('.pdf');
      const isImage = file.type.startsWith('image/');
      if (!isPdf && !isImage) throw new Error('Please upload a PDF or image file (JPG, PNG, WEBP)');

      if (isPdf) {
        const pdfjsLib = window['pdfjs-dist/build/pdf'];
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
        const arrayBuffer = await file.arrayBuffer();
        const pdf = await pdfjsLib.getDocument({data: arrayBuffer}).promise;
        let fullText = '';
        for (let i = 1; i <= Math.min(pdf.numPages, 5); i++) {
          const page = await pdf.getPage(i);
          const content = await page.getTextContent();
          fullText += content.items.map(function(item){return item.str;}).join(' ') + '\n';
        }
        if (!fullText.trim()) throw new Error('Could not extract text. Try an image screenshot instead.');
        const response = await fetch('https://sncfmxqwpfxhztaxuhdu.supabase.co/functions/v1/claude-proxy', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + SUPABASE_ANON_KEY },
          body: JSON.stringify({ prompt: RICH_PROMPT + ' Resume text: ' + fullText.slice(0, 4000), max_tokens: 2000 })
        });
        const data = await response.json();
        if (data.error) throw new Error(data.error);
        applyParsed(JSON.parse(data.text.replace(/```json|```/g,'').trim()));
      } else {
        const base64 = await new Promise(function(res, rej) {
          const reader = new FileReader();
          reader.onload = function() { res(reader.result.split(',')[1]); };
          reader.onerror = function() { rej(new Error('Could not read file')); };
          reader.readAsDataURL(file);
        });
        const mediaType = file.type || 'image/jpeg';
        const response = await fetch('https://sncfmxqwpfxhztaxuhdu.supabase.co/functions/v1/claude-proxy', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + SUPABASE_ANON_KEY },
          body: JSON.stringify({
            messages: [{ role: 'user', content: [
              { type: 'image', source: { type: 'base64', media_type: mediaType, data: base64 } },
              { type: 'text', text: RICH_PROMPT }
            ]}],
            max_tokens: 2000
          })
        });
        const data = await response.json();
        if (data.error) {
          const errMsg = typeof data.error === 'string' ? data.error : (data.error.message || JSON.stringify(data.error));
          if (errMsg.includes('messages.0.content') || errMsg.includes('Field required')) {
            throw new Error('Proxy needs updating to support images. Please deploy the new claude-proxy.ts file.');
          }
          throw new Error(errMsg);
        }
        // Proxy normalises to .text — prefer that, fall back to .content array
        var rawText = '';
        if (data.text && data.text.trim()) {
          rawText = data.text;
        } else if (Array.isArray(data.content)) {
          rawText = data.content.filter(function(b){return b.type==='text';}).map(function(b){return b.text;}).join('');
        }
        if (!rawText.trim()) throw new Error('No response from Claude. Check that the claude-proxy Edge Function is deployed with image support.');
        var cleaned = rawText.replace(/```json|```/g,'').trim();
        // Find JSON object in response (Claude sometimes adds preamble)
        var jsonStart = cleaned.indexOf('{');
        var jsonEnd = cleaned.lastIndexOf('}');
        if (jsonStart !== -1 && jsonEnd !== -1) cleaned = cleaned.slice(jsonStart, jsonEnd + 1);
        applyParsed(JSON.parse(cleaned));
      }
      setAiImportMode('done');
    } catch(e) {
      setResumeError('Could not parse file: ' + e.message);
      setAiImportMode('resume'); // keep drop zone open so error is visible
    }
    setResumeLoading(false);
  };

  const handleDrop = function(e) {
    e.preventDefault(); setDragOver(false);
    const file = e.dataTransfer.files[0];
    if (file) processResumeFile(file);
  };

  const handleSave = function() {
    if (!form.name || !form.positionId) return;
    onSave({ ...form, richProfile: parsedProfile });
  };

  return (
    <div className="modal-overlay" onClick={function(e){e.target===e.currentTarget&&onClose();}}>
      <div className="modal" style={{maxWidth:600}}>
        <div className="modal-header">
          <div className="modal-title">{candidate?'Edit Candidate':'Add Candidate'}</div>
          <button className="modal-close" onClick={onClose}>×</button>
        </div>
        <div className="modal-body">

          {/* AI Import Buttons */}
          {(aiImportMode === '' || aiImportMode === 'done') && (
            <div style={{display:'flex',gap:8,marginBottom:16}}>
              <button className="btn btn-sm" style={{background:'rgba(10,102,194,.12)',color:'#0a66c2',border:'1px solid rgba(10,102,194,.25)',flex:1,justifyContent:'center'}}
                onClick={function(){setAiImportMode('linkedin');}}>
                💼 Import from LinkedIn Text
              </button>
              <button className="btn btn-sm" style={{background:'rgba(79,142,247,.1)',color:'var(--accent)',border:'1px solid rgba(79,142,247,.25)',flex:1,justifyContent:'center'}}
                onClick={function(){setAiImportMode('resume');setResumeFileName('');setResumeError('');}}>
                ✨ Add Resume / Screenshot
              </button>
            </div>
          )}

          {/* LinkedIn Text Import */}
          {aiImportMode === 'linkedin' && (
            <div className="mb-4 p-3" style={{background:'rgba(10,102,194,.08)',border:'1px solid rgba(10,102,194,.3)',borderRadius:8}}>
              <div className="flex items-center justify-between mb-2">
                <div style={{fontSize:13,fontWeight:600,color:'#0a66c2'}}>💼 Paste LinkedIn Profile Text</div>
                <button className="btn btn-ghost btn-xs" onClick={function(){setAiImportMode('');}}>✕</button>
              </div>
              <div style={{fontSize:11,color:'var(--muted)',marginBottom:8}}>Go to LinkedIn profile → Cmd+A → Cmd+C → paste below</div>
              <textarea style={{minHeight:100,fontSize:12}} placeholder="Paste LinkedIn profile text here..." value={liText} onChange={function(e){setLiText(e.target.value);}}/>
              {liError && <div style={{color:'var(--red)',fontSize:11,marginTop:4}}>{liError}</div>}
              <div className="flex gap-2 mt-2">
                <button className="btn btn-sm" style={{background:'#0a66c2',color:'#fff'}} onClick={parseLinkedIn} disabled={liLoading||!liText.trim()}>
                  {liLoading ? '⏳ Parsing...' : '✨ Build Profile with Claude'}
                </button>
                <button className="btn btn-ghost btn-sm" onClick={function(){setAiImportMode('');setLiText('');}}>Cancel</button>
              </div>
            </div>
          )}

          {/* Resume / Screenshot Drop Zone */}
          {aiImportMode === 'resume' && (
            <div className="mb-4">
              <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:8}}>
                <div style={{fontSize:13,fontWeight:600,color:'var(--accent)'}}>✨ Add Resume or Screenshot to Profile</div>
                <button className="btn btn-ghost btn-xs" onClick={function(){setAiImportMode('');setResumeError('');setResumeFileName('');}}>✕</button>
              </div>
              <div style={{fontSize:11,color:'var(--muted)',marginBottom:10}}>
                Claude will merge the new info with any existing profile — nothing gets overwritten unless you clear it.
              </div>
              <div
                onDragOver={function(e){e.preventDefault();setDragOver(true);}}
                onDragLeave={function(){setDragOver(false);}}
                onDrop={handleDrop}
                onClick={function(){fileInputRef.current&&fileInputRef.current.click();}}
                style={{border:'2px dashed '+(dragOver?'var(--accent)':'var(--border2)'),borderRadius:10,padding:'28px 20px',textAlign:'center',cursor:'pointer',background:dragOver?'rgba(79,142,247,.06)':'var(--surface2)',transition:'all .2s'}}>
                {resumeLoading
                  ? <div><div style={{fontSize:22,marginBottom:6}}>⏳</div><div style={{color:'var(--accent)',fontWeight:600,fontSize:13}}>Claude is reading the file...</div><div style={{color:'var(--muted)',fontSize:11,marginTop:4}}>Merging into profile</div></div>
                  : resumeFileName
                    ? <div style={{color:'var(--accent3)',fontWeight:600}}>✅ {resumeFileName} — merged into profile!</div>
                    : <div><div style={{fontSize:28,marginBottom:8}}>📄</div><div style={{fontWeight:600,fontSize:13,marginBottom:4}}>Drop PDF resume or screenshot here</div><div style={{fontSize:11,color:'var(--muted)'}}>or click to browse · PDF, JPG, PNG, WEBP</div></div>
                }
              </div>
              <input ref={fileInputRef} type="file" accept=".pdf,image/*" style={{display:'none'}}
                onChange={function(e){if(e.target.files[0])processResumeFile(e.target.files[0]);}}/>
              {resumeError && <div style={{color:'var(--red)',fontSize:11,marginTop:6}}>{resumeError}</div>}
            </div>
          )}

          {/* Parsed Profile Card */}
          {parsedProfile && (
            <ParsedProfileCard
              profile={parsedProfile}
              onClear={function(){if(window.confirm('Clear the full profile for this candidate? This cannot be undone.'))setParsedProfile(null);}}
              onUpdate={function(cleaned){setParsedProfile(function(p){return {...p,...cleaned};});}}
            />
          )}

          {/* Form divider */}
          <div style={{display:'flex',alignItems:'center',gap:10,marginBottom:14,marginTop:parsedProfile?14:0}}>
            <div style={{flex:1,height:1,background:'var(--border)'}}/>
            <div style={{fontSize:11,color:'var(--muted)',fontWeight:600}}>Candidate Fields</div>
            <div style={{flex:1,height:1,background:'var(--border)'}}/>
          </div>

          <div className="grid-2">
            <div className="field"><label>Full Name *</label><input placeholder="Jane Smith" value={form.name} onChange={function(e){update('name',e.target.value);}}/></div>
            <div className="field"><label>Email</label><input placeholder="jane@email.com" value={form.email||''} onChange={function(e){update('email',e.target.value);}}/></div>
          </div>
          <div className="grid-2">
            <div className="field"><label>Position *</label>
              <select value={form.positionId} onChange={function(e){update('positionId',e.target.value);}}>
                <option value="">Select position...</option>
                {positions.map(function(p){return <option key={p.id} value={p.id}>{p.title}</option>;})}
              </select>
            </div>
            <div className="field"><label>Pipeline Stage</label>
              <select value={form.stage} onChange={function(e){update('stage',e.target.value);}}>
                {STAGES.map(function(s){return <option key={s} value={s}>{s}</option>;})}
              </select>
            </div>
          </div>
          <div className="grid-2">
            <div className="field"><label>Phone</label><input placeholder="+1 (555) 000-0000" value={form.phone||''} onChange={function(e){update('phone',e.target.value);}}/></div>
            <div className="field"><label>LinkedIn URL</label>
              <div style={{display:'flex',alignItems:'center',gap:6}}>
                <input placeholder="linkedin.com/in/..." value={form.linkedIn||''} onChange={function(e){update('linkedIn',e.target.value);}} style={{flex:1}}/>
                {form.linkedIn && (
                  <a href={form.linkedIn.startsWith('http')?form.linkedIn:'https://'+form.linkedIn} target="_blank" rel="noopener noreferrer"
                    style={{color:'#0a66c2',fontSize:18,flexShrink:0,textDecoration:'none'}} title="Open LinkedIn profile">💼</a>
                )}
              </div>
            </div>
          </div>
          <div className="field"><label>General Notes</label><textarea placeholder="Initial impressions, source, etc." value={form.notes||''} onChange={function(e){update('notes',e.target.value);}}/></div>

          {/* Interview Team */}
          <div className="field" style={{margin:0}}>
            <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:8,marginTop:4}}>
              <label style={{margin:0}}>Interview Team</label>
              <span style={{fontSize:11,color:'var(--muted)'}}>People at Trade conducting interviews</span>
            </div>
            <InterviewTeamEditor
              interviewers={form.interviewers||[]}
              onChange={function(val){update('interviewers',val);}}
            />
          </div>

          {/* Notes from Candidate */}
          <LettersSection
            letters={form.letters||[]}
            onChange={function(fn){update('letters', typeof fn==='function'?fn(form.letters||[]):fn);}}
          />

        </div>
        <div className="modal-footer">
          <button className="btn btn-ghost" onClick={onClose}>Cancel</button>
          <button className="btn btn-primary" onClick={handleSave} disabled={!form.name||!form.positionId}>
            {candidate?'Save Changes':'Add Candidate'}
          </button>
        </div>
      </div>
    </div>
  );
}

function ScorecardsView({ candidates, setCandidates, positions }) {
  const [selPos, setSelPos] = useState('');
  const [selCand, setSelCand] = useState('');
  const [showScoringInfo, setShowScoringInfo] = useState(false);

  const pos = positions.find(p=>p.id===selPos);
  const cand = candidates.find(c=>c.id===selCand);
  const posForCand = pos || (cand ? positions.find(p=>p.id===cand.positionId) : null);

  const candsByPos = (selPos ? candidates.filter(c=>c.positionId===selPos) : candidates).filter(c=>c.stage!=='Rejected');

  const setScore = (reqId, field, val) => {
    setCandidates(cs => cs.map(c => {
      if (c.id !== selCand) return c;
      return { ...c, scores: { ...c.scores, [reqId]: { ...(c.scores||{})[reqId], [field]: val } } };
    }));
  };

  const overallScore = posForCand && cand?.scores ? calcWeightedScore(cand.scores, posForCand.requirements||[]) : null;

  return (
    <div className="page">
      {showScoringInfo && (
        <div className="modal-overlay" onClick={function(e){e.target===e.currentTarget&&setShowScoringInfo(false);}}>
          <div className="modal" style={{maxWidth:520}}>
            <div className="modal-header">
              <div className="modal-title">How Scoring Works</div>
              <button className="modal-close" onClick={function(){setShowScoringInfo(false);}}>×</button>
            </div>
            <div className="modal-body" style={{display:'flex',flexDirection:'column',gap:20}}>
              <div style={{fontSize:13,color:'var(--text2)',lineHeight:1.6}}>
                You are evaluating <strong style={{color:'var(--text)'}}>signal strength</strong> — the evidence a candidate demonstrated during the interview process. You are not measuring performance against an internal bar.
              </div>
              <div>
                <div style={{fontWeight:600,fontSize:13,marginBottom:10,color:'var(--text)'}}>Score Scale</div>
                <div style={{display:'flex',flexDirection:'column',gap:6}}>
                  {[
                    {score:1,label:'No Signal',desc:'No evidence this quality exists. Did not demonstrate it at all.',color:'#f75c5c'},
                    {score:2,label:'Weak Signal',desc:'Some hints but inconsistent or unconvincing. Needs more evidence.',color:'#f7834f'},
                    {score:3,label:'Clear Signal',desc:'Solid, credible evidence they have this. Came through clearly.',color:'#f7c94f'},
                    {score:4,label:'Strong Signal',desc:'Compelling evidence. Stood out in this area. You noticed it.',color:'#2dd4a0'},
                    {score:5,label:'Exceptional Signal',desc:'Rare. This is a genuine standout — well above what you typically see.',color:'#4f8ef7'}
                  ].map(function(row){return(
                    <div key={row.score} style={{display:'flex',alignItems:'center',gap:12,padding:'8px 12px',background:'var(--surface2)',borderRadius:8}}>
                      <div style={{width:28,height:28,borderRadius:6,background:row.color,display:'flex',alignItems:'center',justifyContent:'center',fontWeight:700,fontSize:13,color:'#fff',flexShrink:0}}>{row.score}</div>
                      <div>
                        <div style={{fontWeight:600,fontSize:13,color:row.color}}>{row.label}</div>
                        <div style={{fontSize:12,color:'var(--text2)'}}>{row.desc}</div>
                      </div>
                    </div>
                  );})}
                </div>
              </div>
              <div style={{background:'var(--surface2)',borderRadius:10,padding:'14px 16px'}}>
                <div style={{fontWeight:600,fontSize:13,marginBottom:6,color:'var(--text)'}}>Weight Multipliers</div>
                <div style={{fontSize:13,color:'var(--text2)',lineHeight:1.6}}>
                  Weights control how much a requirement influences the overall score. Use <span style={{color:'var(--accent)',fontWeight:600}}>2×</span> for important criteria and <span style={{color:'var(--accent2)',fontWeight:600}}>3×</span> sparingly for your single most critical requirement.
                </div>
              </div>
              <div style={{background:'var(--surface2)',borderRadius:10,padding:'14px 16px'}}>
                <div style={{fontWeight:600,fontSize:13,marginBottom:6,color:'var(--text)'}}>Formula</div>
                <div style={{fontFamily:'var(--mono)',fontSize:12,color:'var(--accent3)',padding:'8px 12px',background:'var(--bg)',borderRadius:6,marginBottom:8}}>
                  Sum(score × weight) ÷ Sum(5 × weight) × 100
                </div>
                <div style={{fontSize:12,color:'var(--text2)'}}>Only scored requirements count. Unscored rows are excluded until rated.</div>
              </div>
              <div style={{background:'rgba(247,92,92,.08)',border:'1px solid rgba(247,92,92,.25)',borderRadius:10,padding:'14px 16px'}}>
                <div style={{fontWeight:600,fontSize:13,marginBottom:6,color:'var(--red)'}}>🚫 Must-Have Disqualification</div>
                <div style={{fontSize:12,color:'var(--text2)',lineHeight:1.6}}>
                  If a requirement is marked <strong style={{color:'var(--red)'}}>Must Have</strong> and receives a <strong>1 (No Signal)</strong>, the candidate is automatically <strong>Disqualified</strong> regardless of other scores.
                </div>
              </div>
            </div>
            <div className="modal-footer">
              <button className="btn btn-primary" onClick={function(){setShowScoringInfo(false);}}>Got it</button>
            </div>
          </div>
        </div>
      )}
      <div className="page-header">
        <div><div className="page-title">Scorecards</div><div className="page-sub">Rate candidates against position requirements</div></div>
        <button className="btn btn-secondary btn-sm" onClick={function(){setShowScoringInfo(true);}}>❓ How Scoring Works</button>
      </div>
      <div className="grid-2 mb-4">
        <div className="field" style={{margin:0}}>
          <label>Position</label>
          <select value={selPos} onChange={e=>{setSelPos(e.target.value);setSelCand('')}}>
            <option value="">All Positions</option>
            {positions.map(p=><option key={p.id} value={p.id}>{p.title}</option>)}
          </select>
        </div>
        <div className="field" style={{margin:0}}>
          <label>Candidate</label>
          <select value={selCand} onChange={e=>setSelCand(e.target.value)}>
            <option value="">Select Candidate...</option>
            {candsByPos.map(c=><option key={c.id} value={c.id}>{c.name}</option>)}
          </select>
        </div>
      </div>

      {!selCand && <div className="empty-state"><div className="empty-icon">📊</div><div className="empty-title">Select a candidate to score</div></div>}

      {selCand && cand && posForCand && <>
        <div className="flex items-center justify-between mb-4">
          <div>
            <div style={{fontWeight:700,fontSize:18}}>{cand.name}</div>
            <div className="text-muted text-sm" style={{display:'flex',alignItems:'center',gap:6}}>
              {posForCand.title} ·
              <select
                value={cand.stage}
                onChange={function(e){setCandidates(function(cs){return cs.map(function(x){return x.id===selCand?{...x,stage:e.target.value}:x;});});}}
                style={{fontSize:12,fontWeight:600,padding:'2px 8px',borderRadius:20,cursor:'pointer',background:'var(--surface2)',border:'1px solid var(--border2)',color:'var(--text)'}}>
                {STAGES.map(function(s){return <option key={s} value={s}>{s}</option>;})}
              </select>
            </div>
          </div>
          <div style={{textAlign:'right'}}>
            <div className="text-muted text-xs mb-1">Overall Score</div>
            <div style={{fontSize:overallScore===-1?16:28,fontWeight:700,color:overallScore===-1?'var(--red)':overallScore>=80?'var(--accent3)':overallScore>=60?'var(--accent)':overallScore?'var(--yellow)':'var(--muted)'}}>
              {overallScore===-1?'🚫 Disqualified':overallScore!=null?overallScore+'%':'—'}
            </div>
          </div>
        </div>

        {(posForCand.requirements||[]).length===0
          ? <div className="card"><div className="text-muted text-sm">No requirements set for this position. Add requirements to the position first.</div></div>
          : <div className="card" style={{padding:0}}>
              <table style={{width:'100%',borderCollapse:'collapse'}}>
                <thead>
                  <tr>
                    <th colSpan={4} style={{padding:'8px 16px',borderBottom:'1px solid var(--border)'}}>
                      <div style={{display:'flex',gap:8,flexWrap:'wrap'}}>
                        {[1,2,3,4,5].map(function(n){
                          var cols = ['','var(--red)','var(--orange)','var(--yellow)','var(--accent3)','var(--accent)'];
                          return <span key={n} style={{fontSize:10,fontWeight:600,color:cols[n],background:'var(--surface3)',padding:'2px 8px',borderRadius:20,border:'1px solid var(--border)'}}>
                            {n} = {scoreLabel(n)}
                          </span>;
                        })}
                      </div>
                    </th>
                  </tr>
                  <tr>
                    <th style={{padding:'12px 16px'}}>Requirement</th>
                    <th style={{padding:'12px 16px'}}>Weight</th>
                    <th style={{padding:'12px 16px'}}>Score</th>
                    <th style={{padding:'12px 16px'}}>Notes</th>
                  </tr>
                </thead>
                <tbody>
                  {(posForCand.requirements||[]).filter(function(r){return r.active!==false;}).map(req=>{
                    const s = (cand.scores||{})[req.id]||{};
                    return <tr key={req.id}>
                      <td style={{padding:'12px 16px'}}>
                        <div style={{fontWeight:500}}>{req.name}</div>
                        {req.mustHave && <span className="badge badge-red mt-1" style={{fontSize:10}}>Must Have</span>}
                      </td>
                      <td style={{padding:'12px 16px',color:'var(--muted)',fontSize:12}}>{req.weight}×</td>
                      <td style={{padding:'12px 16px'}}>
                        <ScoreBtns value={s.score} onChange={v=>setScore(req.id,'score',v)}/>
                        {s.score && <div style={{fontSize:10,color:'var(--muted)',marginTop:4}}>{scoreLabel(s.score)}</div>}
                      </td>
                      <td style={{padding:'8px 16px'}}>
                        <input style={{fontSize:12,padding:'6px 10px'}} placeholder="Add note..." value={s.note||''} onChange={e=>setScore(req.id,'note',e.target.value)}/>
                      </td>
                    </tr>;
                  })}
                </tbody>
              </table>
            </div>
        }

        <div className="flex justify-between items-center mb-2">
          <div className="text-muted text-xs">Scores save automatically as you click</div>
          <button className="btn btn-danger btn-sm" onClick={()=>{if(window.confirm('Reset all scores for '+cand.name+'?'))setCandidates(cs=>cs.map(c=>c.id===selCand?{...c,scores:{},valueScores:{},recommendation:'',overallNotes:''}:c))}}>
            ↺ Reset Scores
          </button>
        </div>

        {/* Company Values Alignment */}
        <div className="card mt-4 mb-4">
          <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:16}}>
            <div>
              <div className="section-title" style={{margin:0}}>Trade Values Alignment</div>
              <div style={{fontSize:11,color:'var(--muted)',marginTop:3}}>Based on what you have seen so far — do you believe this candidate can genuinely live these values at Trade?</div>
            </div>
            {(()=>{
              var vs = cand.valueScores||{};
              var vals = ['connection','customer','impact','challenge','constraints'];
              var scored = vals.filter(function(v){return vs[v];});
              if (!scored.length) return null;
              var avg = Math.round(scored.reduce(function(s,v){return s+vs[v];},0)/scored.length*20);
              var col = avg>=80?'var(--accent3)':avg>=60?'var(--accent)':'var(--yellow)';
              return <div style={{textAlign:'right'}}><div style={{fontSize:10,color:'var(--muted)',marginBottom:2}}>Values Score</div><div style={{fontSize:22,fontWeight:700,color:col}}>{avg}%</div></div>;
            })()}
          </div>
          {[
            {id:'connection', label:'Invest in Connection', desc:'Did they show genuine warmth and curiosity about the people around them? Do you believe they will build real relationships — with teammates, roasters, and customers — not just transactional ones?'},
            {id:'customer', label:'Customer First', desc:'Did they naturally center the customer in their thinking and examples? Do you believe they will bring the customer into every room and push back when goals conflict with what is right for the people they serve?'},
            {id:'impact', label:'Chart the Most Impactful Path', desc:'Did they demonstrate a bias toward real outcomes over activity? Do you believe they will set ambitious goals, hold themselves accountable, and take initiative without needing to be pointed at the opportunity?'},
            {id:'challenge', label:'Challenge Ideas, Not People', desc:'Did they engage in debate with positive intent and genuine openness? Do you believe they will disagree productively, commit once a decision is made, and show up the same way every day?'},
            {id:'constraints', label:'Use Constraints as Catalysts', desc:'Did they show creativity and low ego when things got hard? Do you believe they will take smart risks, own their mistakes, ask for help, and find a way through rather than around?'}
          ].map(function(val){
            var score = (cand.valueScores||{})[val.id];
            var setValueScore = function(v) {
              setCandidates(cs=>cs.map(c=>c.id===selCand?{...c,valueScores:{...(c.valueScores||{}),[val.id]:v}}:c));
            };
            return (
              <div key={val.id} style={{marginBottom:16,paddingBottom:16,borderBottom:'1px solid var(--border)'}}>
                <div style={{display:'flex',alignItems:'flex-start',justifyContent:'space-between',gap:12,marginBottom:8}}>
                  <div style={{flex:1}}>
                    <div style={{fontWeight:600,fontSize:13,marginBottom:3}}>{val.label}</div>
                    <div style={{fontSize:11,color:'var(--muted)',lineHeight:1.5}}>{val.desc}</div>
                  </div>
                  <div style={{flexShrink:0}}>
                    <ScoreBtns value={score} onChange={setValueScore}/>
                    {score && <div style={{fontSize:10,color:'var(--muted)',marginTop:3,textAlign:'center'}}>{scoreLabel(score)}</div>}
                  </div>
                </div>
              </div>
            );
          })}
        </div>

        <div className="card mt-4">
          <div className="section-title">Overall Recommendation</div>
          <div className="flex gap-2 mb-3" style={{flexWrap:'wrap'}}>
            {['Strong Yes','Yes','Maybe','No','Strong No'].map(r=>(
              <button key={r}
                className={`btn btn-sm ${cand.recommendation===r?'btn-primary':'btn-secondary'}`}
                onClick={()=>setCandidates(cs=>cs.map(c=>c.id===selCand?{...c,recommendation:r}:c))}>
                {r}
              </button>
            ))}
          </div>
          <div className="field" style={{margin:0}}>
            <label>Overall Notes</label>
            <textarea placeholder="Overall impression and reasoning..." value={cand.overallNotes||''} onChange={e=>setCandidates(cs=>cs.map(c=>c.id===selCand?{...c,overallNotes:e.target.value}:c))}/>
          </div>
        </div>
      </>}
    </div>
  );
}

/* ═══════════════════════════════════════
   REQUIREMENTS LIBRARY
   ═══════════════════════════════════════ */
function RequirementsView({ requirements, setRequirements }) {
  const [showModal, setShowModal] = useState(false);
  const [form, setForm] = useState({ name:'', category:'' });
  const categories = [...new Set(requirements.map(r=>r.category))];

  const save = () => {
    if (!form.name||!form.category) return;
    setRequirements(rs=>[...rs,{...form,id:uid()}]);
    setForm({name:'',category:''});
    setShowModal(false);
  };

  return (
    <div className="page">
      <div className="page-header">
        <div><div className="page-title">Requirements Library</div><div className="page-sub">Reusable criteria for scoring candidates</div></div>
        <button className="btn btn-primary" onClick={()=>setShowModal(true)}>+ Add Requirement</button>
      </div>
      {categories.map(cat=>(
        <div key={cat} className="card mb-4">
          <div className="section-title">{cat}</div>
          {requirements.filter(r=>r.category===cat).map(r=>(
            <div key={r.id} className="flex items-center justify-between" style={{padding:'8px 0',borderBottom:'1px solid var(--border)'}}>
              <div style={{fontSize:13,fontWeight:500}}>{r.name}</div>
              <button className="btn btn-danger btn-xs" onClick={()=>setRequirements(rs=>rs.filter(x=>x.id!==r.id))}>Remove</button>
            </div>
          ))}
        </div>
      ))}
      {showModal && (
        <div className="modal-overlay" onClick={e=>e.target===e.currentTarget&&setShowModal(false)}>
          <div className="modal">
            <div className="modal-header"><div className="modal-title">Add Requirement</div><button className="modal-close" onClick={()=>setShowModal(false)}>×</button></div>
            <div className="modal-body">
              <div className="field"><label>Requirement Name *</label><input placeholder="e.g. 5+ years in SaaS" value={form.name} onChange={e=>setForm(f=>({...f,name:e.target.value}))}/></div>
              <div className="field"><label>Category *</label>
                <input list="cats" placeholder="Experience, Leadership, Technical, Culture..." value={form.category} onChange={e=>setForm(f=>({...f,category:e.target.value}))}/>
                <datalist id="cats">{categories.map(c=><option key={c} value={c}/>)}</datalist>
              </div>
            </div>
            <div className="modal-footer">
              <button className="btn btn-ghost" onClick={()=>setShowModal(false)}>Cancel</button>
              <button className="btn btn-primary" onClick={save}>Add to Library</button>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

/* ═══════════════════════════════════════
   JD BUILDER
   ═══════════════════════════════════════ */
function JDBuilderView({ positions, setPositions, requirements: reqLib }) {
  const [mode, setMode] = useState(''); // 'manual' or 'ai'
  const [step, setStep] = useState(1);
  const [form, setForm] = useState({ title:'', department:'', location:'', level:'Mid', description:'', responsibilities:'', qualifications:'', requirements:[] });
  const [generated, setGenerated] = useState('');
  const [aiPrompt, setAiPrompt] = useState('');
  const [aiLoading, setAiLoading] = useState(false);
  const [aiError, setAiError] = useState('');
  const update = (k,v) => setForm(f=>({...f,[k]:v}));

  // ── AI Generation ──────────────────────────────
  const generateWithClaude = async () => {
    if (!aiPrompt.trim()) return;
    setAiLoading(true); setAiError('');
    try {
      const response = await fetch('https://sncfmxqwpfxhztaxuhdu.supabase.co/functions/v1/claude-proxy', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + SUPABASE_ANON_KEY },
        body: JSON.stringify({
          prompt: 'You are an expert recruiter. Create a job description for: ' + aiPrompt + '. Return ONLY a JSON object with fields: title, department, location, level (Junior/Mid/Senior/Lead/Director/VP/C-Level), description (2-3 sentences), responsibilities (bullet points with •), qualifications (bullet points with •), requirements (array of 5 strings). No markdown, no backticks, just raw JSON.',
          max_tokens: 1500
        })
      });
      const data = await response.json();
      if (data.error) throw new Error(data.error.message || JSON.stringify(data.error));
      const text = data.text.replace(/```json|```/g,'').trim();
      const parsed = JSON.parse(text);
      setForm(f => ({
        ...f,
        title: parsed.title || f.title,
        department: parsed.department || f.department,
        location: parsed.location || f.location,
        level: parsed.level || f.level,
        description: parsed.description || f.description,
        responsibilities: parsed.responsibilities || f.responsibilities,
        qualifications: parsed.qualifications || f.qualifications,
        requirements: (parsed.requirements||[]).map(r => ({ id: uid(), name: r, weight: 1, mustHave: false }))
      }));
      setMode('manual');
      setStep(1);
    } catch(e) {
      setAiError('Error: ' + e.message + '. Please try again or use manual mode.');
    }
    setAiLoading(false);
  };

  // ── Manual generation ──────────────────────────
  const generateJD = () => {
    const jd = `# ${form.title}
**Department:** ${form.department} | **Location:** ${form.location} | **Level:** ${form.level}

## About the Role
${form.description}

## Key Responsibilities
${form.responsibilities}

## Qualifications
${form.qualifications}

## What We're Looking For
${form.requirements.map(r=>`• ${r.name}`).join('\n')}`;
    setGenerated(jd);
    setStep(3);
  };

  const createPosition = () => {
    const newPos = {
      id: uid(), title: form.title, department: form.department, location: form.location,
      jd: generated, requirements: form.requirements, status: 'Open', createdAt: today()
    };
    setPositions(ps=>[...ps,newPos]);
    alert(`Position "${form.title}" created!`);
    setMode(''); setStep(1);
    setForm({ title:'', department:'', location:'', level:'Mid', description:'', responsibilities:'', qualifications:'', requirements:[] });
    setGenerated('');
  };

  const categories = [...new Set(reqLib.map(r=>r.category))];
  const toggleReq = (req) => {
    const exists = form.requirements.find(r=>r.name===req.name);
    if (exists) setForm(f=>({...f,requirements:f.requirements.filter(r=>r.name!==req.name)}));
    else setForm(f=>({...f,requirements:[...f.requirements,{id:uid(),name:req.name,weight:1,mustHave:false}]}));
  };

  // ── Mode selector ──────────────────────────────
  if (!mode) return (
    <div className="page">
      <div className="page-header">
        <div><div className="page-title">JD Builder</div><div className="page-sub">Create a job description your way</div></div>
      </div>
      <div className="grid-2" style={{gap:20,maxWidth:700}}>
        <div className="card" style={{cursor:'pointer',border:'1px solid var(--border)',transition:'all .2s'}}
          onClick={()=>setMode('ai')}
          onMouseEnter={e=>e.currentTarget.style.borderColor='var(--accent2)'}
          onMouseLeave={e=>e.currentTarget.style.borderColor='var(--border)'}>
          <div style={{fontSize:36,marginBottom:12}}>✨</div>
          <div style={{fontSize:17,fontWeight:700,marginBottom:8}}>Let Claude Write It</div>
          <div style={{fontSize:13,color:'var(--muted)',lineHeight:1.6}}>
            Tell Claude about the role in plain language — who you need, what they'll do, what matters most. Claude will generate a complete, polished JD instantly.
          </div>
          <div className="btn btn-purple mt-4" style={{display:'inline-flex'}}>Use AI →</div>
        </div>
        <div className="card" style={{cursor:'pointer',border:'1px solid var(--border)',transition:'all .2s'}}
          onClick={()=>setMode('manual')}
          onMouseEnter={e=>e.currentTarget.style.borderColor='var(--accent)'}
          onMouseLeave={e=>e.currentTarget.style.borderColor='var(--border)'}>
          <div style={{fontSize:36,marginBottom:12}}>📝</div>
          <div style={{fontSize:17,fontWeight:700,marginBottom:8}}>Build It Yourself</div>
          <div style={{fontSize:13,color:'var(--muted)',lineHeight:1.6}}>
            Fill in the details step by step — title, responsibilities, qualifications, and requirements. Full control over every word.
          </div>
          <div className="btn btn-secondary mt-4" style={{display:'inline-flex'}}>Manual →</div>
        </div>
      </div>
    </div>
  );

  // ── AI Mode ────────────────────────────────────
  if (mode === 'ai') return (
    <div className="page">
      <div className="page-header">
        <div><div className="page-title">✨ AI JD Builder</div><div className="page-sub">Describe the role and Claude will do the rest</div></div>
        <button className="btn btn-ghost" onClick={()=>setMode('')}>← Back</button>
      </div>
      <div className="card" style={{maxWidth:700}}>
        <div className="section-title">Tell Claude About This Role</div>
        <div style={{fontSize:13,color:'var(--muted)',marginBottom:16,lineHeight:1.7}}>
          Write naturally — like you're explaining the role to a friend. Include the title, what the person will do, what kind of experience you need, and anything else that matters. More detail = better JD.
        </div>
        <div className="highlight-box mb-4" style={{fontSize:12,color:'var(--muted)'}}>
          <strong style={{color:'var(--text2)'}}>Example:</strong> "We need a VP of Marketing for our DTC coffee brand. This person will own the full funnel — paid social, email, influencer, and brand. We're Series A, about 30 people. Need someone who's scaled a DTC brand before, ideally in food & bev. Based in NYC but remote-friendly. They'll manage a team of 4 and report to me."
        </div>
        <div className="field">
          <label>Describe the Role</label>
          <textarea
            style={{minHeight:180,fontSize:14,lineHeight:1.7}}
            placeholder="Tell Claude what you're looking for..."
            value={aiPrompt}
            onChange={e=>setAiPrompt(e.target.value)}/>
        </div>
        {aiError && <div style={{color:'var(--red)',fontSize:13,marginBottom:12}}>{aiError}</div>}
        <div className="flex gap-2">
          <button className="btn btn-purple" onClick={generateWithClaude} disabled={aiLoading||!aiPrompt.trim()}>
            {aiLoading ? '⏳ Claude is writing your JD...' : '✨ Generate JD with Claude'}
          </button>
          <button className="btn btn-ghost" onClick={()=>setMode('')}>Cancel</button>
        </div>
      </div>
    </div>
  );

  // ── Manual Mode ────────────────────────────────
  return (
    <div className="page">
      <div className="page-header">
        <div><div className="page-title">📝 JD Builder</div><div className="page-sub">Build your job description step by step</div></div>
        <button className="btn btn-ghost" onClick={()=>setMode('')}>← Back</button>
      </div>
      <div className="flex gap-2 mb-4">
        {['1. Basic Info','2. Requirements','3. Review & Create'].map((s,i)=>(
          <div key={i} className="flex items-center gap-2">
            <div style={{width:24,height:24,borderRadius:'50%',background:step===i+1?'var(--accent)':step>i+1?'var(--accent3)':'var(--surface2)',
              border:`1px solid ${step>=i+1?'transparent':'var(--border)'}`,display:'flex',alignItems:'center',justifyContent:'center',fontSize:11,fontWeight:700}}>
              {step>i+1?'✓':i+1}
            </div>
            <span style={{fontSize:13,fontWeight:step===i+1?600:400,color:step===i+1?'var(--text)':'var(--muted)'}}>{s}</span>
            {i<2 && <span style={{color:'var(--border)',margin:'0 4px'}}>›</span>}
          </div>
        ))}
      </div>

      {step===1 && <div className="card">
        <div className="grid-2">
          <div className="field"><label>Job Title *</label><input placeholder="Head of Growth" value={form.title} onChange={e=>update('title',e.target.value)}/></div>
          <div className="field"><label>Department</label>
                <input list="dept-list" placeholder="Select or type department..." value={form.department} onChange={e=>update('department',e.target.value)}/>
                <datalist id="dept-list"><option value="Data"/><option value="Design"/><option value="Executive"/><option value="Finance"/><option value="HR"/><option value="Marketing"/><option value="Merchandising"/><option value="Operations"/><option value="Product"/><option value="Technology"/></datalist>
              </div>
        </div>
        <div className="grid-2">
          <div className="field"><label>Location</label><input placeholder="Remote / New York, NY" value={form.location} onChange={e=>update('location',e.target.value)}/></div>
          <div className="field"><label>Level</label>
            <select value={form.level} onChange={e=>update('level',e.target.value)}>
              {['Junior','Mid','Senior','Lead','Director','VP','C-Level'].map(l=><option key={l} value={l}>{l}</option>)}
            </select>
          </div>
        </div>
        <div className="field"><label>Role Description</label><textarea placeholder="Brief description of the role and its impact..." value={form.description} onChange={e=>update('description',e.target.value)}/></div>
        <div className="field"><label>Key Responsibilities</label><textarea placeholder="• Drive customer acquisition strategy&#10;• Manage $X budget..." value={form.responsibilities} onChange={e=>update('responsibilities',e.target.value)}/></div>
        <div className="field"><label>Qualifications</label><textarea placeholder="• 5+ years experience&#10;• Proven track record..." value={form.qualifications} onChange={e=>update('qualifications',e.target.value)}/></div>
        <button className="btn btn-primary" onClick={()=>form.title&&setStep(2)} disabled={!form.title}>Next: Requirements →</button>
      </div>}

      {step===2 && <div className="card">
        <div className="section-title">Select Requirements for this Position</div>
        <div className="text-muted text-sm mb-4">Choose from your library. Selected: {form.requirements.length}</div>
        {categories.map(cat=>(
          <div key={cat} className="mb-4">
            <div style={{fontSize:12,fontWeight:600,color:'var(--muted)',marginBottom:8}}>{cat}</div>
            <div className="flex" style={{flexWrap:'wrap',gap:6}}>
              {reqLib.filter(r=>r.category===cat).map(r=>{
                const sel = form.requirements.find(x=>x.name===r.name);

            </div>
          </div>
        ))}
        <div className="flex gap-2 mt-4">
          <button className="btn btn-secondary" onClick={()=>setStep(1)}>← Back</button>
          <button className="btn btn-primary" onClick={generateJD}>Generate JD →</button>

      </div>}

      {step===3 && <div className="card">
        <div className="section-title">Generated Job Description</div>
        <textarea style={{minHeight:320,fontFamily:'var(--mono)',fontSize:12,lineHeight:1.7}} value={generated} onChange={e=>setGenerated(e.target.value)}/>

          <button className="btn btn-ghost" onClick={()=>navigator.clipboard.writeText(generated)}>📋 Copy</button>

      </div>}
    </div>
  );
}

function TranscriptImport({ selCand, setCandidates }) {
  const [open, setOpen] = useState(false);
  const [transcript, setTranscript] = useState('');
  const [loading, setLoading] = useState(false);
  const [error, setError] = useState('');

  const PROXY = 'https://sncfmxqwpfxhztaxuhdu.supabase.co/functions/v1/claude-proxy';
  const ANON = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNuY2ZteHF3cGZ4aHp0YXh1aGR1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzM0MjAxOTcsImV4cCI6MjA4ODk5NjE5N30.M-DB7beiKqW3bgKp25YYQZD3uJV9_fGvfEoQb8Qn4jw';

  const parseTranscript = async () => {
    if (!transcript.trim()) return;
    setLoading(true); setError('');
    try {
      const resp = await fetch(PROXY, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + ANON },
        body: JSON.stringify({
          prompt: 'You are analyzing a job interview transcript. Extract 8-12 key moments, insights, and observations. For each one return a JSON array of objects with fields: text (the insight, 1-2 sentences), star (true if this is a particularly strong signal, positive or negative). Return ONLY a valid JSON array, no markdown, no explanation. Transcript: ' + transcript.slice(0, 6000),
          max_tokens: 1500
        })
      });
      const data = await resp.json();
      if (data.error) throw new Error(data.error);
      const parsed = JSON.parse(data.text.replace(/```json|```/g,'').trim());
      const notes = parsed.map((item, i) => ({
        id: uid(),
        text: item.text,
        time: 'transcript',
        star: item.star || false,
        createdAt: new Date().toISOString()
      }));
      setCandidates(cs => cs.map(c => c.id === selCand
        ? { ...c, interviewNotes: [...(c.interviewNotes||[]), ...notes] }
        : c
      ));
      setTranscript('');
      setOpen(false);
    } catch(e) {
      // Fallback: just split by lines if Claude fails
      const lines = transcript.split('\n').filter(l => l.trim().length > 30);
      const notes = lines.slice(0,15).map(line => ({
        id: uid(), text: line.trim(), time: 'transcript', star: false, createdAt: new Date().toISOString()
      }));
      setCandidates(cs => cs.map(c => c.id === selCand
        ? { ...c, interviewNotes: [...(c.interviewNotes||[]), ...notes] }
        : c
      ));
      setTranscript('');
      setOpen(false);
    }
    setLoading(false);
  };

  if (!selCand) return null;

  return (
    <div className="card mb-4">
      <div className="flex items-center justify-between">
        <div>
          <div style={{fontWeight:600,fontSize:14}}>🎙️ Import Interview Transcript</div>
          <div className="text-muted text-xs mt-1">Paste a transcript and Claude will extract key insights automatically</div>
        </div>
        <button className="btn btn-secondary btn-sm" onClick={()=>setOpen(o=>!o)}>
          {open ? 'Cancel' : 'Import Transcript'}
        </button>
      </div>
      {open && <>
        <hr className="divider"/>
        <div className="field" style={{margin:'12px 0 0'}}>
          <label>Paste or drop transcript here</label>
          <textarea
            style={{minHeight:160,fontSize:13,lineHeight:1.6}}
            placeholder="Paste the full interview transcript here. Claude will read it and extract 8-12 key insights, highlights, and observations as timestamped notes..."
            value={transcript}
            onChange={e=>setTranscript(e.target.value)}
            onDragOver={e=>{e.preventDefault();e.currentTarget.style.borderColor='var(--accent)';}}
            onDragLeave={e=>{e.currentTarget.style.borderColor='';}}
            onDrop={e=>{
              e.preventDefault();
              e.currentTarget.style.borderColor='';
              const file = e.dataTransfer.files[0];
              if (file) { const r=new FileReader(); r.onload=ev=>setTranscript(ev.target.result); r.readAsText(file); }
              else { const t=e.dataTransfer.getData('text'); if(t) setTranscript(t); }
            }}/>
        </div>
        {error && <div style={{color:'var(--red)',fontSize:12,marginBottom:8}}>{error}</div>}
        <div className="flex gap-2">
          <button className="btn btn-purple" onClick={parseTranscript} disabled={loading||!transcript.trim()}>

          <button className="btn btn-secondary" onClick={()=>{
            const lines = transcript.split('\n').filter(l=>l.trim().length>20);
            const notes = lines.slice(0,20).map(line=>({id:uid(),text:line.trim(),time:'transcript',star:false,createdAt:new Date().toISOString()}));
            setCandidates(cs=>cs.map(c=>c.id===selCand?{...c,interviewNotes:[...(c.interviewNotes||[]),...notes]}:c));
            setTranscript(''); setOpen(false);

function NoteItem({ n, removeNote, onEdit }) {
  const [editing, setEditing] = useState(false);
  const [draft, setDraft] = useState(n.text);
  const [showCleaned, setShowCleaned] = useState(false);
  const save = () => { onEdit(n.id, draft); setEditing(false); };
  const cancel = () => { setDraft(n.text); setEditing(false); };

  const parseSections = function(text) {
    var sections = { summary: '', themes: [], cleaned: '' };
    var current = null;
    var NL = String.fromCharCode(10);
    text.split(NL).forEach(function(line) {
      var trimmed = line.trim();
      // Match headers flexibly (with or without ** markdown bold)
      var isHeader = function(h) { return trimmed === h || trimmed === '**' + h + '**' || trimmed.replace(/[*#]/g,'').trim() === h; };
      if (isHeader('SUMMARY')) { current = 'summary'; return; }
      if (isHeader('KEY THEMES') || isHeader('KEY THEMES:')) { current = 'themes'; return; }
      if (isHeader('CLEANED NOTES') || isHeader('CLEANED NOTES:') || isHeader('FORMATTED NOTES') || isHeader('NOTES')) { current = 'cleaned'; return; }
      if (!trimmed) return;
      if (current === 'summary') sections.summary += (sections.summary ? ' ' : '') + trimmed;
      if (current === 'themes' && (trimmed.startsWith('- ') || trimmed.startsWith('• '))) sections.themes.push(trimmed.slice(2));
      else if (current === 'themes' && trimmed.match(/^[0-9]+\./)) sections.themes.push(trimmed.replace(/^[0-9]+\.\s*/,''));
      if (current === 'cleaned') sections.cleaned += (sections.cleaned ? NL : '') + line;
    });
    // Fallback: if no sections parsed, treat entire text as summary
    if (!sections.summary && !sections.themes.length && !sections.cleaned) {
      sections.summary = text.trim();
    }
    return sections;
  };

  return (
    <div style={{position:'relative',paddingRight:60}}>
      {editing
        ? <div>
            <textarea autoFocus value={draft} onChange={e=>setDraft(e.target.value)}
              onKeyDown={e=>{if(e.key==='Escape')cancel();}}
              style={{width:'100%',fontSize:13,lineHeight:1.8,minHeight:80,marginBottom:6}}/>
            <div style={{display:'flex',gap:6}}>
              <button className="btn btn-primary btn-xs" onClick={save}>Save</button>
              <button className="btn btn-ghost btn-xs" onClick={cancel}>Cancel</button>
            </div>
          </div>
        : n.synthesis
          ? (function(){
              var s = parseSections(n.text);
              return (
                <div>
                  {s.summary && <div style={{fontSize:13,lineHeight:1.7,color:'var(--text)',marginBottom:10}}>{s.summary}</div>}
                  {s.themes.length > 0 && (
                    <div style={{marginBottom:10}}>
                      <div style={{fontSize:10,fontWeight:700,color:'var(--accent)',textTransform:'uppercase',letterSpacing:'.07em',marginBottom:5}}>Key Themes</div>
                      {s.themes.map(function(t,i){return(
                        <div key={i} style={{display:'flex',gap:8,fontSize:13,lineHeight:1.65,marginBottom:3}}>
                          <span style={{color:'var(--accent2)',fontWeight:700,flexShrink:0}}>•</span>
                          <span style={{color:'var(--text)'}}>{t}</span>
                        </div>
                      );})}
                    </div>
                  )}
                  {s.cleaned && !n.isShort && (
                    <div>
                      <button className="btn btn-ghost btn-xs" style={{fontSize:11,color:'var(--muted)',border:'1px solid var(--border)',marginBottom:6}}
                        onClick={function(){setShowCleaned(function(v){return !v;});}}>
                        {showCleaned ? '▲ Hide notes' : '▼ Show cleaned notes'}
                      </button>
                      {showCleaned && (
                        <div style={{fontSize:13,lineHeight:1.75,color:'var(--text2)',whiteSpace:'pre-wrap',padding:'10px 12px',background:'var(--surface3)',borderRadius:8,borderLeft:'2px solid var(--border2)'}}>
                          {s.cleaned}
                        </div>
                      )}
                    </div>
                  )}
                  {s.cleaned && n.isShort && (
                    <div style={{fontSize:13,lineHeight:1.75,color:'var(--text2)',whiteSpace:'pre-wrap',padding:'10px 12px',background:'var(--surface3)',borderRadius:8,borderLeft:'2px solid var(--border2)',marginTop:4}}>
                      {s.cleaned}
                    </div>
                  )}
                </div>
              );
            })()
          : <div>
              {n.star && <span style={{color:'var(--yellow)'}}>⭐ </span>}
              <span style={{fontSize:13,lineHeight:1.8,whiteSpace:'pre-wrap',color:'var(--text)'}}>{n.text}</span>
            </div>
      }
      {!editing && (
        <div style={{position:'absolute',top:0,right:0,display:'flex',gap:2}}>
          <button onClick={()=>{setDraft(n.text);setEditing(true);}}
            style={{background:'none',border:'none',color:'var(--muted)',cursor:'pointer',fontSize:12,padding:'2px 4px',lineHeight:1}}
            title="Edit note">✏️</button>
          <button onClick={()=>removeNote(n.id)}
            style={{background:'none',border:'none',color:'var(--muted)',cursor:'pointer',fontSize:14,padding:'2px 4px',lineHeight:1}}
            title="Delete note">×</button>
        </div>
      )}
    </div>
  );
}

function NoteGroup({ date, groupNotes, removeNote, onCleanGroup, onEditNote }) {
  const [cleaning, setCleaning] = useState(false);

  const handleClean = async function() {
    setCleaning(true);
    await onCleanGroup(groupNotes, date);
    setCleaning(false);
  };

  return (
    <div style={{marginBottom:20,background:'var(--surface2)',border:'1px solid var(--border)',borderRadius:12,overflow:'hidden'}}>
      <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',padding:'10px 14px',borderBottom:'1px solid var(--border)',background:'var(--surface3)'}}>
        <span style={{fontSize:11,fontWeight:700,color:'var(--accent)',textTransform:'uppercase',letterSpacing:'.07em'}}>{date}</span>
        <div style={{display:'flex',gap:6,alignItems:'center'}}>
          <span style={{fontSize:11,color:'var(--muted)'}}>{groupNotes.length + ' note' + (groupNotes.length!==1?'s':'')}</span>
          {onCleanGroup && (
            <button
              className="btn btn-purple btn-xs"
              onClick={handleClean}
              disabled={cleaning}
              style={{fontSize:10,padding:'3px 8px',minWidth:70,display:'flex',alignItems:'center',gap:4,justifyContent:'center'}}>
              {cleaning
                ? <><span style={{display:'inline-block',width:10,height:10,border:'2px solid rgba(255,255,255,.3)',borderTopColor:'#fff',borderRadius:'50%',animation:'spin 0.7s linear infinite'}}/> Thinking...</>
                : '✨ Clean'}
            </button>
