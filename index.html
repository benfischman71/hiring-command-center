<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Hiring Command Center v2</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet" />
<style>
:root {
  --bg:#090c12; --surface:#111520; --surface2:#181e2e; --surface3:#1f2638;
  --border:#252d42; --border2:#2e3850;
  --accent:#4f8ef7; --accent2:#7c5cfc; --accent3:#2dd4a0;
  --red:#f75c5c; --yellow:#f7c94f; --orange:#f7834f;
  --text:#e4eaf8; --text2:#a8b3cc; --muted:#5c6882;
  --font:'DM Sans',sans-serif; --mono:'DM Mono',monospace;
  --r:10px; --r2:14px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body,#root{height:100%}
body{background:var(--bg);color:var(--text);font-family:var(--font);font-size:14px;line-height:1.5}
::-webkit-scrollbar{width:5px;height:5px}
@keyframes spin{to{transform:rotate(360deg)}}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--border2);border-radius:99px}

/* ── AUTH ─────────────────────────────── */
.auth-bg{min-height:100vh;display:flex;align-items:center;justify-content:center;
  background:radial-gradient(ellipse at 30% 20%,rgba(79,142,247,.08) 0%,transparent 60%),
             radial-gradient(ellipse at 70% 80%,rgba(124,92,252,.06) 0%,transparent 60%),var(--bg)}
.auth-card{background:var(--surface);border:1px solid var(--border);border-radius:20px;
  padding:44px;width:100%;max-width:440px;box-shadow:0 24px 80px rgba(0,0,0,.5)}
.auth-brand{font-size:20px;font-weight:700;letter-spacing:-.02em;
  background:linear-gradient(130deg,var(--accent),var(--accent2));
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:4px}
.auth-tagline{color:var(--muted);font-size:13px;margin-bottom:32px}
.auth-tabs{display:flex;gap:6px;margin-bottom:28px;background:var(--surface2);padding:4px;border-radius:10px}
.auth-tab{flex:1;padding:9px;border:none;background:transparent;color:var(--muted);
  border-radius:7px;cursor:pointer;font-family:var(--font);font-size:13px;font-weight:600;transition:all .2s}
.auth-tab.active{background:var(--surface3);color:var(--text);box-shadow:0 2px 8px rgba(0,0,0,.3)}

/* ── FORM ─────────────────────────────── */
.field{margin-bottom:16px}
label{display:block;font-size:11px;font-weight:600;color:var(--muted);text-transform:uppercase;
  letter-spacing:.07em;margin-bottom:6px}
input,select,textarea{width:100%;background:var(--surface2);border:1.5px solid var(--border);
  border-radius:var(--r);padding:10px 13px;color:var(--text);font-family:var(--font);
  font-size:14px;outline:none;transition:border-color .2s}
input:focus,select:focus,textarea:focus{border-color:var(--accent)}
input::placeholder,textarea::placeholder{color:var(--muted)}
textarea{resize:vertical;min-height:90px}
select option{background:var(--surface2)}
.error-msg{color:var(--red);font-size:12px;margin-top:28px;text-align:center}

/* ── BUTTONS ──────────────────────────── */
.btn{display:inline-flex;align-items:center;gap:7px;padding:10px 18px;border-radius:var(--r);
  border:none;font-family:var(--font);font-size:13px;font-weight:600;cursor:pointer;
  transition:all .15s;white-space:nowrap;line-height:1}
.btn-primary{background:var(--accent);color:#fff}
.btn-primary:hover{background:#3a7de8;transform:translateY(-1px)}
.btn-purple{background:var(--accent2);color:#fff}
.btn-purple:hover{background:#6a4de8}
.btn-green{background:var(--accent3);color:#0a1a12}
.btn-green:hover{background:#24b88a}
.btn-secondary{background:var(--surface2);color:var(--text);border:1px solid var(--border)}
.btn-secondary:hover{border-color:var(--accent);color:var(--accent)}
.btn-danger{background:rgba(247,92,92,.15);color:var(--red);border:1px solid rgba(247,92,92,.3)}
.btn-danger:hover{background:var(--red);color:#fff}
.btn-ghost{background:transparent;color:var(--muted);border:1px solid transparent}
.btn-ghost:hover{color:var(--text);background:var(--surface2)}
.btn-sm{padding:6px 13px;font-size:12px}
.btn-xs{padding:4px 10px;font-size:11px}
.btn-full{width:100%;justify-content:center}
.btn:disabled{opacity:.4;cursor:not-allowed;transform:none!important}

/* ── LAYOUT ───────────────────────────── */
.app{display:flex;height:100vh;overflow:hidden}
.sidebar{width:220px;min-width:220px;background:var(--surface);border-right:1px solid var(--border);
  display:flex;flex-direction:column;overflow-y:auto;padding:20px 0}
.sidebar-brand{padding:0 20px 20px;border-bottom:1px solid var(--border);margin-bottom:12px}
.sidebar-brand-name{font-size:16px;font-weight:700;letter-spacing:-.02em;
  background:linear-gradient(130deg,var(--accent),var(--accent2));
  -webkit-background-clip:text;-webkit-text-fill-color:transparent}
.sidebar-org{font-size:11px;color:var(--muted);margin-top:2px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nav-section{padding:0 12px;margin-bottom:4px}
.nav-section-label{font-size:10px;font-weight:700;color:var(--muted);
  text-transform:uppercase;letter-spacing:.1em;padding:8px 8px 4px}
.nav-item{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:8px;
  cursor:pointer;transition:all .15s;color:var(--text2);font-size:13px;font-weight:500;
  text-decoration:none;border:none;background:none;width:100%;font-family:var(--font)}
.nav-item:hover{background:var(--surface2);color:var(--text)}
.nav-item.active{background:rgba(79,142,247,.12);color:var(--accent);font-weight:600}
.nav-item .nav-icon{font-size:16px;width:20px;text-align:center}
.sidebar-footer{margin-top:auto;padding:16px 20px;border-top:1px solid var(--border)}
.user-pill{display:flex;align-items:center;gap:10px}
.user-avatar{width:32px;height:32px;border-radius:50%;background:linear-gradient(135deg,var(--accent),var(--accent2));
  display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;color:#fff;flex-shrink:0}
.user-info{overflow:hidden}
.user-name{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.user-role{font-size:11px;color:var(--muted)}
.main{flex:1;overflow-y:auto;background:var(--bg)}
.page{padding:32px;max-width:1200px}
.page-header{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:28px;gap:16px}
.page-title{font-size:24px;font-weight:700;letter-spacing:-.02em}
.page-sub{color:var(--muted);font-size:13px;margin-top:3px}

/* ── CARDS ────────────────────────────── */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r2);padding:20px}
.card-sm{padding:14px}

/* ── STATS ────────────────────────────── */
.stats-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:14px;margin-bottom:28px}
.stat-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r2);padding:18px}
.stat-label{font-size:11px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.07em;margin-bottom:8px}
.stat-value{font-size:28px;font-weight:700;letter-spacing:-.02em}
.stat-value.blue{color:var(--accent)}
.stat-value.purple{color:var(--accent2)}
.stat-value.green{color:var(--accent3)}
.stat-value.yellow{color:var(--yellow)}

/* ── TABLE ────────────────────────────── */
.table-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse}
th{text-align:left;padding:10px 14px;font-size:11px;font-weight:700;color:var(--muted);
  text-transform:uppercase;letter-spacing:.07em;border-bottom:1px solid var(--border)}
td{padding:12px 14px;border-bottom:1px solid var(--border);font-size:13px;vertical-align:middle}
tr:last-child td{border-bottom:none}
tr:hover td{background:var(--surface2)}

/* ── BADGES ───────────────────────────── */
.badge{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:99px;
  font-size:11px;font-weight:600;letter-spacing:.02em}
.badge-blue{background:rgba(79,142,247,.15);color:var(--accent)}
.badge-purple{background:rgba(124,92,252,.15);color:var(--accent2)}
.badge-green{background:rgba(45,212,160,.15);color:var(--accent3)}
.badge-red{background:rgba(247,92,92,.15);color:var(--red)}
.badge-yellow{background:rgba(247,201,79,.15);color:var(--yellow)}
.badge-gray{background:var(--surface2);color:var(--text2)}

/* ── MODAL ────────────────────────────── */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.7);display:flex;
  align-items:center;justify-content:center;z-index:1000;padding:20px;backdrop-filter:blur(4px)}
.modal{background:var(--surface);border:1px solid var(--border);border-radius:20px;
  width:100%;max-width:580px;max-height:90vh;overflow-y:auto;box-shadow:0 32px 80px rgba(0,0,0,.6)}
.modal-lg{max-width:780px}
.modal-header{padding:24px 28px 0;display:flex;align-items:center;justify-content:space-between}
.modal-title{font-size:18px;font-weight:700;letter-spacing:-.02em}
.modal-body{padding:24px 28px 28px}
.modal-close{background:var(--surface2);border:1px solid var(--border);border-radius:8px;
  color:var(--muted);cursor:pointer;font-size:18px;width:32px;height:32px;
  display:flex;align-items:center;justify-content:center;flex-shrink:0}
.modal-close:hover{color:var(--text)}
.modal-footer{padding:0 28px 28px;display:flex;gap:10px;justify-content:flex-end}

/* ── SCORE BAR ────────────────────────── */
.score-bar-wrap{display:flex;align-items:center;gap:10px}
.score-bar-bg{flex:1;height:6px;background:var(--surface3);border-radius:99px;overflow:hidden}
.score-bar-fill{height:100%;border-radius:99px;transition:width .4s}
.score-num{font-size:13px;font-weight:700;font-family:var(--mono);min-width:36px;text-align:right}

/* ── SCORE BUTTONS (1-5) ──────────────── */
.score-btns{display:flex;gap:5px}
.score-btn{width:36px;height:36px;border-radius:8px;border:1.5px solid var(--border);
  background:var(--surface2);color:var(--muted);font-size:13px;font-weight:600;
  cursor:pointer;transition:all .15s;font-family:var(--font)}
.score-btn:hover{border-color:var(--accent);color:var(--accent)}
.score-btn.active-1{border-color:var(--red);background:rgba(247,92,92,.15);color:var(--red)}
.score-btn.active-2{border-color:var(--orange);background:rgba(247,131,79,.15);color:var(--orange)}
.score-btn.active-3{border-color:var(--yellow);background:rgba(247,201,79,.15);color:var(--yellow)}
.score-btn.active-4{border-color:var(--accent3);background:rgba(45,212,160,.12);color:var(--accent3)}
.score-btn.active-5{border-color:var(--accent);background:rgba(79,142,247,.15);color:var(--accent)}

/* ── PIPELINE ─────────────────────────── */
.pipeline{display:flex;gap:14px;overflow-x:auto;padding-bottom:8px}
.pipeline-col{min-width:200px;background:var(--surface);border:1px solid var(--border);
  border-radius:var(--r2);padding:14px}
.pipeline-col-header{font-size:12px;font-weight:700;text-transform:uppercase;
  letter-spacing:.07em;color:var(--muted);margin-bottom:12px;display:flex;
  align-items:center;justify-content:space-between}
.pipeline-card{background:var(--surface2);border:1px solid var(--border);border-radius:8px;
  padding:12px;margin-bottom:8px;cursor:pointer;transition:all .15s}
.pipeline-card:hover{border-color:var(--accent);transform:translateY(-1px)}
.pipeline-name{font-size:13px;font-weight:600;margin-bottom:4px}
.pipeline-pos{font-size:12px;color:var(--muted)}

/* ── TABS ─────────────────────────────── */
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--border);margin-bottom:24px}
.tab{padding:10px 16px;border:none;background:none;color:var(--muted);
  font-family:var(--font);font-size:13px;font-weight:600;cursor:pointer;
  border-bottom:2px solid transparent;margin-bottom:-1px;transition:all .15s}
.tab:hover{color:var(--text)}
.tab.active{color:var(--accent);border-bottom-color:var(--accent)}

/* ── REQUIREMENT ROW ──────────────────── */
.req-row{display:flex;align-items:center;gap:10px;padding:10px 12px;
  background:var(--surface2);border:1px solid var(--border);border-radius:8px;margin-bottom:6px}
.req-name{flex:1;font-size:13px;font-weight:500}
.req-category{font-size:11px;color:var(--muted)}
.weight-select{background:var(--surface);border:1px solid var(--border);border-radius:6px;
  padding:4px 8px;color:var(--text);font-size:12px;font-weight:600;cursor:pointer}
.tooltip-wrap:hover .tooltip-body{opacity:1!important;pointer-events:auto!important}
.must-toggle{width:20px;height:20px;border-radius:4px;border:1.5px solid var(--border);
  background:var(--surface);cursor:pointer;display:flex;align-items:center;justify-content:center;
  font-size:12px;transition:all .2s}
.must-toggle.on{border-color:var(--red);background:rgba(247,92,92,.15);color:var(--red)}

/* ── NOTES TIMER ──────────────────────── */
.timer-display{font-family:var(--mono);font-size:28px;font-weight:500;color:var(--accent);letter-spacing:.05em}
.note-item{display:flex;gap:12px;padding:10px 0;border-bottom:1px solid var(--border)}
.note-time{font-family:var(--mono);font-size:11px;color:var(--accent);min-width:50px;padding-top:2px}
.note-text{font-size:13px;flex:1}
.note-star{color:var(--yellow)}

/* ── SHARE CODE ───────────────────────── */
.share-code-box{background:var(--surface2);border:1px solid var(--border);border-radius:10px;
  padding:16px 20px;display:flex;align-items:center;gap:12px}
.share-code{font-family:var(--mono);font-size:20px;font-weight:500;letter-spacing:.1em;color:var(--accent);flex:1}

/* ── COMPARISON ───────────────────────── */
.compare-table{width:100%;border-collapse:collapse}
.compare-table th,.compare-table td{padding:12px 16px;border:1px solid var(--border);text-align:left}
.compare-table th{background:var(--surface2);font-size:12px;font-weight:700;
  color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.compare-table .req-col{font-size:13px;font-weight:500}
.compare-table .score-cell{text-align:center}

/* ── REF CHECK ────────────────────────── */
.ref-card{background:var(--surface2);border:1px solid var(--border);border-radius:10px;padding:16px;margin-bottom:10px}
.ref-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.ref-name{font-size:14px;font-weight:600}
.ref-meta{font-size:12px;color:var(--muted)}

/* ── EXTERNAL SCORER ──────────────────── */
.external-bg{min-height:100vh;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:20px}
.external-card{background:var(--surface);border:1px solid var(--border);border-radius:20px;padding:36px;width:100%;max-width:620px}

/* ── MISC ─────────────────────────────── */
.empty-state{text-align:center;padding:60px 20px;color:var(--muted)}
.empty-icon{font-size:40px;margin-bottom:12px}
.empty-title{font-size:16px;font-weight:600;color:var(--text2);margin-bottom:6px}
.empty-sub{font-size:13px;margin-bottom:20px}
.divider{border:none;border-top:1px solid var(--border);margin:20px 0}
.flex{display:flex}.flex-col{flex-direction:column}.items-center{align-items:center}
.justify-between{justify-content:space-between}.gap-2{gap:8px}.gap-3{gap:12px}.gap-4{gap:16px}
.mt-1{margin-top:4px}.mt-2{margin-top:8px}.mt-3{margin-top:12px}.mt-4{margin-top:16px}
.mb-2{margin-bottom:8px}.mb-3{margin-bottom:12px}.mb-4{margin-bottom:16px}
.text-muted{color:var(--muted)}.text-sm{font-size:12px}.text-xs{font-size:11px}
.font-bold{font-weight:700}.font-mono{font-family:var(--mono)}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.grid-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:16px}
.chip{display:inline-flex;align-items:center;gap:5px;padding:4px 10px;border-radius:99px;
  background:var(--surface2);border:1px solid var(--border);font-size:12px;color:var(--text2)}
.chip-remove{cursor:pointer;color:var(--muted);font-size:14px;line-height:1}
.chip-remove:hover{color:var(--red)}
.section-title{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;
  color:var(--muted);margin-bottom:12px}
.info-row{display:flex;gap:6px;align-items:baseline;margin-bottom:6px}
.info-key{font-size:12px;color:var(--muted);min-width:120px}
.info-val{font-size:13px;font-weight:500}
.highlight-box{background:rgba(79,142,247,.06);border:1px solid rgba(79,142,247,.2);
  border-radius:10px;padding:14px 16px}
.pulse{animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.5}}

/* ── MOBILE RESPONSIVE ───────────────────────── */
@media (max-width: 768px) {
  /* Full screen app, no split layout */
  .app { flex-direction: column; height: 100vh; overflow: hidden; }

  /* TOP NAV BAR */
  .sidebar {
    width: 100%;
    min-width: unset;
    height: auto;
    max-height: none;
    border-right: none;
    border-bottom: 1px solid var(--border);
    padding: 0;
    flex-direction: column;
    flex-shrink: 0;
    overflow: visible;
  }

  /* Brand row */
  .sidebar-brand {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 10px 16px;
    border-bottom: 1px solid var(--border);
    margin-bottom: 0;
  }
  .sidebar-org { font-size: 10px; }

  /* Nav items: single horizontal scrolling row of icon+label pills */
  .nav-section {
    display: flex;
    flex-direction: row;
    overflow-x: auto;
    padding: 6px 8px;
    gap: 4px;
    -webkit-overflow-scrolling: touch;
    scrollbar-width: none;
    white-space: nowrap;
  }
  .nav-section::-webkit-scrollbar { display: none; }

  .nav-item {
    display: inline-flex;
    flex-direction: column;
    align-items: center;
    gap: 2px;
    padding: 6px 10px;
    border-radius: 10px;
    font-size: 10px;
    font-weight: 600;
    background: transparent;
    color: var(--muted);
    white-space: nowrap;
    min-width: 52px;
    border: none;
    width: auto;
    flex-shrink: 0;
  }
  .nav-item.active {
    background: rgba(79,142,247,.15);
    color: var(--accent);
  }
  .nav-item .nav-icon { font-size: 18px; width: auto; }

  /* Hide sidebar footer - put account in brand bar */
  .sidebar-footer { display: none; }

  /* MAIN CONTENT - scrollable */
  .main {
    flex: 1;
    overflow-y: auto;
    overflow-x: hidden;
    -webkit-overflow-scrolling: touch;
    height: 0; /* forces flex child to scroll */
  }

  .page { padding: 16px 14px; max-width: 100%; }
  .page-header { flex-direction: column; gap: 10px; }
  .page-header .btn { width: 100%; justify-content: center; }
  .page-title { font-size: 22px; }

  /* Grids stack */
  .grid-2, .grid-3 { grid-template-columns: 1fr; gap: 12px; }

  /* Stats 2-up */
  .stats-grid { grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 16px; }
  .stat-card { padding: 12px; }
  .stat-value { font-size: 24px; }
  .stat-label { font-size: 10px; }

  /* Cards */
  .card { padding: 14px; border-radius: 12px; }

  /* Tables - horizontal scroll */
  .table-wrap { overflow-x: auto; -webkit-overflow-scrolling: touch; }
  table { font-size: 12px; min-width: 500px; }
  th, td { padding: 8px 10px; }

  /* Modals - bottom sheet */
  .modal-overlay { align-items: flex-end; padding: 0; }
  .modal {
    max-width: 100%;
    width: 100%;
    border-radius: 20px 20px 0 0;
    position: relative;
    bottom: auto;
    max-height: 88vh;
    overflow-y: auto;
  }
  .modal-lg { max-width: 100%; }
  .modal-header { padding: 16px 18px 0; }
  .modal-body { padding: 14px 18px 18px; }
  .modal-footer { padding: 0 18px 24px; }

  /* Tabs */
  .tabs { overflow-x: auto; flex-wrap: nowrap; gap: 0; }
  .tab { white-space: nowrap; flex-shrink: 0; padding: 10px 14px; font-size: 13px; }

  /* Buttons */
  .btn { font-size: 13px; }
  .btn-sm { padding: 7px 12px; font-size: 12px; }

  /* Score buttons */
  .score-btns { flex-wrap: wrap; gap: 4px; }
  .score-btn { width: 38px; height: 38px; }

  /* Req rows */
  .req-row { flex-wrap: wrap; gap: 6px; }

  /* Hide non-essential columns */
  .hide-mobile { display: none !important; }

  /* Pipeline horizontal scroll */
  .pipeline { overflow-x: auto; }

  /* Auth */
  .auth-bg { align-items: flex-end; padding: 0; }
  .auth-card {

function calcWeightedScore(scores, requirements) {
  let total=0, max=0;
  for (const req of requirements) {
    // Only score active requirements (active===undefined means legacy = active)
    if (req.active === false) continue;
    const s = scores[req.id];
    if (req.mustHave && s && s.score === 1) return -1;
    if (s && s.score) {
      const w = req.weight || 1;
      total += s.score * w;
      max += 5 * w;
    }
  }
  if (max===0) return null;
  return Math.round((total/max)*100);
}

function isDisqualified(scores, requirements) {
  return calcWeightedScore(scores, requirements) === -1;
}

/* ═══════════════════════════════════════
   PDF / FILE TEXT EXTRACTION HELPER
   ═══════════════════════════════════════ */
async function readJDFile(file, callback) {
  if (file.type === 'application/pdf' || file.name.endsWith('.pdf')) {
    try {
      const pdfjsLib = window['pdfjs-dist/build/pdf'];
      // Use fake worker to avoid CORS issues with worker scripts
      pdfjsLib.GlobalWorkerOptions.workerSrc = `https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js`;
      const arrayBuffer = await file.arrayBuffer();
      const typedArray = new Uint8Array(arrayBuffer);
      const pdfDoc = await pdfjsLib.getDocument(typedArray).promise;
      let text = '';
      for (let p = 1; p <= pdfDoc.numPages; p++) {
        const page = await pdfDoc.getPage(p);
        const tc = await page.getTextContent();
        text += tc.items.map(i => i.str).join(' ') + '\n';
      }
      const result = text.trim();
      callback(result.length > 50 ? result : 'PDF text could not be extracted. Please paste the job description below.');
    } catch(err) {
      console.warn('PDF.js error:', err);
      callback('PDF could not be read. Please paste the job description text below.');
    }
  } else {
    // Plain text / doc
    const reader = new FileReader();
    reader.onload = ev => callback(ev.target.result);
    reader.onerror = () => callback('File could not be read. Please paste the text below.');
    reader.readAsText(file);
  }
}

                          ? <a href="#" onClick={function(e){e.preventDefault();var w=window.open('','_blank');w.document.write('<pre style="font-family:sans-serif;max-width:800px;margin:40px auto;white-space:pre-wrap;line-height:1.6">'+p.jd.split('<').join('&lt;')+'</pre>');w.document.title=p.title+' - JD';}}
                              title="View JD"
                              style={{display:'inline-flex',alignItems:'center',justifyContent:'center',width:28,height:28,borderRadius:8,background:'rgba(45,212,160,.15)',border:'1px solid rgba(45,212,160,.35)',textDecoration:'none',fontSize:14}}>
                              ✓
                            </a>
                          : <div title="No JD yet — click Edit to add one"
                              style={{width:28,height:28,borderRadius:8,background:'var(--surface2)',border:'1.5px dashed var(--border2)',display:'flex',alignItems:'center',justifyContent:'center',cursor:'default'}}>
                              <span style={{fontSize:11,color:'var(--muted)'}}>—</span>
                            </div>
                        }
                      </div>
                    </td>
                    <td><span className={'badge ' + (p.status==='Open'?'badge-green':'badge-gray')}>{p.status}</span></td>
                    <td>
                      <div className="flex gap-2">
                        <button className="btn btn-green btn-sm" style={{fontWeight:700}} onClick={()=>{setEditing(p);setOpenTab('details');setShowModal(true)}}>✏️ Edit</button>
                        <button className="btn btn-ghost btn-sm" style={{color:'var(--muted)',fontSize:11}} onClick={()=>{if(window.confirm('Delete this position?'))setPositions(ps=>ps.filter(x=>x.id!==p.id))}}>Delete</button>
                      </div>
                    </td>
                  </tr>
                ))}
              </tbody>
            </table></div>
          </div>
      }
      {showModal && <PositionModal
        position={editing}
        reqLib={reqLib}
        setRequirements={setRequirements}
        initialTab={openTab}
        onSave={p=>{
          if (editing) setPositions(ps=>ps.map(x=>x.id===p.id?p:x));
          else setPositions(ps=>[...ps,{...p,id:uid(),createdAt:today(),status:'Open'}]);
          setShowModal(false);
        }}
        onClose={()=>setShowModal(false)}
      />}
    </div>
  );
}

function JDTab({ form, update, extractFromJD, extracting, setExtracting }) {
  const [showEditor, setShowEditor] = React.useState(!form.jd);

  return (
    <div>
      {/* ── JD Preview (shown when JD exists) ── */}
      {form.jd && (
        <div style={{marginBottom:16}}>
          <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:10}}>
            <div style={{display:'flex',alignItems:'center',gap:8}}>
              <span style={{fontSize:12,fontWeight:700,color:'var(--accent3)'}}>✓ Job Description saved</span>
            </div>
            <button
              className="btn btn-secondary btn-sm"
              onClick={function(){setShowEditor(function(v){return !v;});}}>
              {showEditor ? '▲ Hide Editor' : '✏️ Update JD'}
            </button>
          </div>
          <div style={{
            background:'var(--surface2)',border:'1px solid var(--border)',borderRadius:10,
            padding:'16px 18px',maxHeight:320,overflowY:'auto',
            fontSize:13,color:'var(--text2)',lineHeight:1.75,whiteSpace:'pre-wrap',
            fontFamily:'var(--font)'
          }}>
            {form.jd}
          </div>
        </div>
      )}

      {/* ── Editor (always shown when no JD, toggled when JD exists) ── */}
      {(!form.jd || showEditor) && (
        <div>
          {!form.jd && <div style={{fontSize:11,fontWeight:700,color:'var(--muted)',textTransform:'uppercase',letterSpacing:'.08em',marginBottom:10}}>Upload or Paste Job Description</div>}
          <div
            onDragOver={function(e){e.preventDefault();e.currentTarget.style.borderColor='var(--accent)';}}
            onDragLeave={function(e){e.currentTarget.style.borderColor='var(--border)';}}
            onDrop={function(e){
              e.preventDefault();
              e.currentTarget.style.borderColor='var(--border)';
              var file = e.dataTransfer.files[0];
              if (!file) return;
              readJDFile(file, function(text){update('jd', text);setShowEditor(false);});
            }}
            onClick={function(){document.getElementById('jd-file-input').click();}}
            style={{border:'2px dashed var(--border)',borderRadius:10,padding:'18px',
              textAlign:'center',cursor:'pointer',marginBottom:12,transition:'border-color .2s',
              background:'var(--surface2)'}}>
            <div style={{fontSize:24,marginBottom:4}}>📄</div>
            <div style={{fontSize:13,fontWeight:600,color:'var(--text2)'}}>Drop a file here or click to upload</div>
            <div style={{fontSize:11,color:'var(--muted)',marginTop:3}}>Supports .txt, .pdf (text), .doc contents</div>
          </div>
          <input id="jd-file-input" type="file" accept=".txt,.text,.md,.doc,.docx,.pdf" style={{display:'none'}}
            onChange={function(e){
              var file = e.target.files[0];
              if (!file) return;
              readJDFile(file, function(text){update('jd', text);setShowEditor(false);});
              e.target.value='';
            }}/>
          <textarea style={{minHeight:160}} placeholder="...or paste your job description here" value={form.jd} onChange={function(e){update('jd',e.target.value);}}/>

        </div>
      )}

  );
}

function PositionModal({ position, reqLib, onSave, onClose, initialTab, setRequirements }) {
  const [form, setForm] = useState(position || { title:'', department:'', location:'', jd:'', requirements:[], status:'Open' });
  const [jdInput, setJdInput] = useState('');
  const [extracting, setExtracting] = useState(false);
  const [customReq, setCustomReq] = useState('');
  const [tab, setTab] = useState(initialTab || 'details');
  const update = (k,v) => setForm(f=>({...f,[k]:v}));

  const extractFromJD = async () => {
    const jdText = jdInput || form.jd;
    if (!jdText || jdText.length < 20) return;
    setExtracting(true);
    try {
      const response = await fetch('https://sncfmxqwpfxhztaxuhdu.supabase.co/functions/v1/claude-proxy', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + SUPABASE_ANON_KEY },
        body: JSON.stringify({
          prompt: 'You are an expert recruiter. Read this job description and extract 8-14 specific, measurable candidate requirements. Focus on skills, experience, and competencies that can actually be evaluated in an interview. Return ONLY a JSON array of strings, no other text, no markdown. Example format: ["5+ years in B2C e-commerce", "P&L ownership experience", "Led cross-functional teams of 10+"]. Job Description: ' + jdText.slice(0, 5000),
          max_tokens: 800
        })
      });
      const data = await response.json();
      if (data.error) throw new Error(data.error);
      const text = data.text.replace(/```json|```/g,'').trim();
      const jsonStart = text.indexOf('[');
      const jsonEnd = text.lastIndexOf(']');
      if (jsonStart === -1 || jsonEnd === -1) throw new Error('Could not parse requirements');
      const extracted = JSON.parse(text.slice(jsonStart, jsonEnd + 1));
      const existing = form.requirements.map(r=>r.name.toLowerCase());
      const newOnes = extracted
        .filter(r => typeof r === 'string' && r.trim() && !existing.includes(r.trim().toLowerCase()))
        .map(function(r, i) { return { id: uid(), name: r.trim(), weight: 1, mustHave: false, active: (form.requirements.filter(function(x){return x.active!==false;}).length + i) < 8 }; });
      setForm(f=>({...f, jd: jdInput||f.jd, requirements:[...f.requirements,...newOnes]}));
      // Save new requirements to the library (avoid duplicates)
      if (setRequirements) {
        setRequirements(function(lib) {
          var libNames = lib.map(function(r){return r.name.toLowerCase();});
          var toAdd = newOnes.filter(function(r){return !libNames.includes(r.name.toLowerCase());}).map(function(r){return {id:uid(),name:r.name,category:'Extracted'};});
          return toAdd.length > 0 ? [...lib, ...toAdd] : lib;
        });
      }
    } catch(e) {
      alert('Could not extract requirements: ' + e.message);
    }
    setExtracting(false);
  };

  const addFromLib = (req) => {
    if (form.requirements.find(r=>r.name===req.name)) return;
    setForm(f=>({...f, requirements:[...f.requirements,{id:uid(),name:req.name,weight:1,mustHave:false,active:f.requirements.filter(function(r){return r.active!==false;}).length<8}]}));
  };

  const addCustom = () => {
    if (!customReq.trim()) return;
    setForm(f=>({...f, requirements:[...f.requirements,{id:uid(),name:customReq.trim(),weight:1,mustHave:false,active:f.requirements.filter(function(r){return r.active!==false;}).length<8}]}));
    setCustomReq('');
  };

  const updateReq = (id, key, val) => setForm(f=>({...f, requirements:f.requirements.map(r=>r.id===id?{...r,[key]:val}:r)}));
  const removeReq = id => setForm(f=>({...f, requirements:f.requirements.filter(r=>r.id!==id)}));

  const categories = [...new Set(reqLib.map(r=>r.category))];

  return (
    <div className="modal-overlay" onClick={e=>e.target===e.currentTarget&&onClose()}>
      <div className="modal modal-lg">
        <div className="modal-header">
          <div className="modal-title">{position ? 'Edit Position — ' + (form.title||position.title) : 'New Position'}</div>
          <button className="modal-close" onClick={onClose}>×</button>
        </div>
        <div className="modal-body">
          <div className="tabs" style={{marginBottom:20}}>
            {['details','jd','requirements'].map(t=>(
              <button key={t} className={`tab ${tab===t?'active':''}`} onClick={()=>setTab(t)}>
                {t==='details'?'Details':t==='jd'?'Job Description':'Requirements'}
              </button>
            ))}
          </div>

          {tab==='details' && <>
            <div className="grid-2">
              <div className="field"><label>Job Title *</label><input placeholder="VP of Marketing" value={form.title} onChange={e=>update('title',e.target.value)}/></div>
              <div className="field"><label>Department</label>
                <input list="dept-list" placeholder="Select or type department..." value={form.department||''} onChange={e=>update('department',e.target.value)}/>
                <datalist id="dept-list"><option value="Data"/><option value="Design"/><option value="Executive"/><option value="Finance"/><option value="HR"/><option value="Marketing"/><option value="Merchandising"/><option value="Operations"/><option value="Product"/><option value="Technology"/></datalist>
              </div>
            </div>
            <div className="grid-2">
              <div className="field"><label>Location</label><input placeholder="Remote / NYC" value={form.location||''} onChange={e=>update('location',e.target.value)}/></div>
              <div className="field"><label>Status</label>
                <select value={form.status} onChange={e=>update('status',e.target.value)}>
                  <option>Open</option><option>Paused</option><option>Closed</option>
                </select>
              </div>
            </div>
            <div className="field">
              <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:6}}>
                <label style={{margin:0}}>Internal Notes</label>
                <span style={{fontSize:10,color:'var(--muted)'}}>For JD text → use the <span style={{color:'var(--accent)',fontWeight:600}}>Job Description</span> tab above</span>
              </div>
              <textarea placeholder="Internal notes about this role — NOT the job description..." value={form.notes||''} onChange={e=>update('notes',e.target.value)}/>
              {form.notes && !form.jd && (
                <button className="btn btn-secondary btn-xs" style={{marginTop:6}} onClick={function(){update('jd',form.notes);update('notes','');}}>
                  → Move this text to Job Description tab
                </button>
              )}
            </div>
          </>}

          {tab==='jd' && <JDTab form={form} update={update} extractFromJD={extractFromJD} extracting={extracting} setExtracting={setExtracting}/>}

          {tab==='requirements' && <>
            <div className="section-title">Position Requirements ({form.requirements.length})</div>
            {form.requirements.length===0 && <div className="text-muted text-sm mb-3">No requirements added yet. Add from library or create custom.</div>}
            {(()=>{
              var activeReqs = form.requirements.filter(function(r){return r.active!==false;});
              var benchReqs = form.requirements.filter(function(r){return r.active===false;});
              var activeCount = activeReqs.length;
              var atMax = activeCount >= 8;
              var sortReqs = function(arr){ return [...arr].sort(function(a,b){ if(a.mustHave&&!b.mustHave) return -1; if(!a.mustHave&&b.mustHave) return 1; if((b.weight||1)!==(a.weight||1)) return (b.weight||1)-(a.weight||1); return a.name.localeCompare(b.name); }); };
              var ReqRow = function(req) { return (
                <div key={req.id} className="req-row" style={{opacity:req.active===false?0.5:1}}>
                  <div style={{flex:1,display:'flex',alignItems:'center',gap:10}}>
                    <div style={{fontSize:13,fontWeight:500}}>{req.name}</div>
                  </div>
                  <div className="flex items-center gap-2">
                    {req.active !== false && <>
                      <select className="weight-select" value={req.weight}
                        style={{color:req.weight===3?'var(--accent2)':req.weight===2?'var(--accent)':'',fontWeight:req.weight>1?700:400}}
                        onChange={e=>updateReq(req.id,'weight',Number(e.target.value))}>
                        <option value={1}>1× Standard</option>
                        <option value={2}>2× Important</option>
                        <option value={3}>3× Critical</option>
                      </select>
                      <button className={'must-toggle ' + (req.mustHave?'on':'')}
                        onClick={()=>updateReq(req.id,'mustHave',!req.mustHave)}
                        title={req.mustHave?'Must Have: score of 1 = disqualified':'Set as hard gate'}>
                        {req.mustHave?'🚫':'○'}
                      </button>
                    </>}
                    <button
                      className="btn btn-xs"
                      style={{fontWeight:600,minWidth:70,background:req.active===false?(atMax?'var(--surface3)':'rgba(45,212,160,.1)'):'rgba(124,92,252,.1)',color:req.active===false?(atMax?'var(--muted)':'var(--accent3)'):'var(--accent2)',border:'1px solid '+(req.active===false?(atMax?'var(--border)':'rgba(45,212,160,.3)'):'rgba(124,92,252,.3)')}}
                      disabled={req.active===false&&atMax}
                      title={req.active===false?(atMax?'Remove one active requirement first to add more':'Add to scored requirements'):'Move to bench (keep, not scored)'}
                      onClick={()=>updateReq(req.id,'active',req.active===false?true:false)}>
                      {req.active===false?(atMax?'Bench full':'+ Activate'):'→ Bench'}
                    </button>
                    <button className="btn btn-ghost btn-xs" onClick={()=>removeReq(req.id)}>✕</button>
                  </div>
                </div>
              );};
              return (<>
                {/* Active requirements */}
                <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:8}}>
                  <div style={{fontSize:11,fontWeight:700,color:'var(--muted)',textTransform:'uppercase',letterSpacing:'.07em'}}>
                    Scored ({activeCount}/8)
                  </div>
                  <div style={{display:'flex',alignItems:'center',gap:12}}>
                    <div style={{fontSize:10,color:'var(--muted)'}}>Weight <span style={{cursor:'help',color:'var(--accent)',fontWeight:700}} className="tooltip-wrap" title="">?
                      <div style={{position:'absolute',right:0,top:16,width:200,background:'var(--surface3)',border:'1px solid var(--border)',borderRadius:8,padding:'8px 10px',fontSize:11,color:'var(--text2)',lineHeight:1.5,zIndex:100,display:'none'}} className="tooltip-body">
                        1× Standard · 2× Important (double) · 3× Critical (triple)
                      </div>
                    </span></div>
                    <div style={{fontSize:10,color:'var(--muted)'}}>Must Have <span style={{cursor:'help',color:'var(--accent)',fontWeight:700}} title="Score of 1 = auto-disqualified">?</span></div>
                  </div>
                </div>
                {activeCount===0 && <div style={{fontSize:12,color:'var(--muted)',marginBottom:12,fontStyle:'italic'}}>No active requirements — activate from bench or add new ones below.</div>}
                {atMax && <div style={{fontSize:11,color:'var(--accent3)',marginBottom:8,padding:'6px 10px',background:'rgba(45,212,160,.08)',borderRadius:6}}>✓ 8/8 active — bench extra requirements or remove some to swap.</div>}
                {sortReqs(activeReqs).map(function(req){ return ReqRow(req); })}

                {/* Bench */}
                {benchReqs.length > 0 && <>
                  <div style={{fontSize:11,fontWeight:700,color:'var(--muted)',textTransform:'uppercase',letterSpacing:'.07em',marginTop:16,marginBottom:8}}>
                    Bench — not scored ({benchReqs.length})
                  </div>
                  <div style={{fontSize:11,color:'var(--muted)',marginBottom:8}}>These are saved but won't affect scoring. Activate up to 8 total.</div>
                  {sortReqs(benchReqs).map(function(req){ return ReqRow(req); })}
                </>}
              </>);
            })()}
            <hr className="divider"/>
            <div className="section-title">Add Custom Requirement</div>
            <div className="flex gap-2 mb-4">
              <input placeholder="e.g. International market experience" value={customReq} onChange={e=>setCustomReq(e.target.value)} onKeyDown={e=>e.key==='Enter'&&addCustom()}/>
              <button className="btn btn-secondary" onClick={addCustom}>Add</button>
            </div>
            <div className="section-title">Add from Library</div>
            {categories.map(cat=>(
              <div key={cat} className="mb-3">
                <div style={{fontSize:12,fontWeight:600,color:'var(--muted)',marginBottom:6}}>{cat}</div>
                <div className="flex" style={{flexWrap:'wrap',gap:6}}>
                  {reqLib.filter(r=>r.category===cat).map(r=>{
                    const added = form.requirements.find(x=>x.name===r.name);
                    return <button key={r.id} className={`chip ${added?'':'chip-add'}`} style={added?{borderColor:'var(--accent)',color:'var(--accent)'}:{}} onClick={()=>addFromLib(r)}>
                      {added?'✓ ':''}{r.name}
                    </button>;
                  })}
                </div>
              </div>
            ))}
          </>}
        </div>
        <div className="modal-footer" style={{flexWrap:'wrap',gap:8,alignItems:'center'}}>
          <div className="flex gap-2" style={{flex:1,flexWrap:'wrap'}}>
            <button className="btn btn-purple btn-sm" onClick={extractFromJD} disabled={extracting||!form.jd}
              title={!form.jd ? 'Add a job description first' : ''}>
              {extracting ? '⏳ Extracting...' : '✨ Extract Requirements with AI'}
            </button>
            <button className="btn btn-secondary btn-sm" disabled={!form.jd}
              title={!form.jd ? 'Add a job description first' : 'Auto-format text'}
              onClick={function(){
                if (!form.jd) return;
                var t = form.jd;
                t = t.replace(/([a-z\.\!\?])([A-Z])/g, '$1 $2');
                t = t.replace(/\s+●\s+/g, ' ● ');
                t = t.replace(/\s+•\s+/g, ' • ');
                update('jd', t);
              }}>
              📐 Format Text
            </button>
            <button className="btn btn-secondary btn-sm" disabled={extracting||!form.jd}
              title={!form.jd ? 'Add a job description first' : 'Clean up with Claude'}
              onClick={async function(){
                if (!form.jd||form.jd.length<20) return;
                setExtracting(true);
                try {
                  var response = await fetch('https://sncfmxqwpfxhztaxuhdu.supabase.co/functions/v1/claude-proxy', {
                    method:'POST',
                    headers:{'Content-Type':'application/json','Authorization':'Bearer ' + SUPABASE_ANON_KEY},
                    body:JSON.stringify({prompt:'Clean up this text into a readable job description. Remove PDF artifacts and binary characters. Return only clean text: ' + form.jd.slice(0,4000)})
                  });
                  var data = await response.json();
                  if (data.error) throw new Error(data.error);
                  update('jd', data.text);
                } catch(e) { alert('Could not clean text.'); }
                setExtracting(false);
              }}>
              🧹 Clean up with Claude
            </button>
          </div>
          <div className="flex gap-2">
            <button className="btn btn-ghost" onClick={onClose}>Cancel</button>
            <button className="btn btn-primary" onClick={()=>form.title&&onSave(form)} disabled={!form.title}>
              {position?'Save Changes':'Create Position'}
            </button>
          </div>
        </div>
      </div>
    </div>
  );
}

function ShareWithTeamModal({ candidate, positions, onClose }) {
  var pos = positions.find(function(p){return p.id===candidate.positionId;});
  var score = pos && candidate.scores ? calcWeightedScore(candidate.scores, pos.requirements||[]) : null;
  var liUrl = candidate.linkedIn ? (candidate.linkedIn.startsWith('http') ? candidate.linkedIn : 'https://' + candidate.linkedIn) : null;
  var [summary, setSummary] = useState('');
  var [loading, setLoading] = useState(false);
  var [copied, setCopied] = useState('');
  var [generated, setGenerated] = useState(false);
  var allRawNotes = [candidate.notes].concat((candidate.interviewNotes||[]).map(function(n){return n.text;})).concat((candidate.references||[]).map(function(r){return r.name ? r.name + ': ' + (r.notes||'') : '';})).concat([candidate.overallNotes]).filter(Boolean).join(' | ');
  var hasNotes = allRawNotes.trim().length > 0;
  var scoreStr = score === -1 ? 'Disqualified' : score != null ? score + '%' : 'Not yet scored';
  var scoreColor = score===-1?'#f75c5c':score>=80?'#2dd4a0':score>=60?'#4f8ef7':score?'#f7c94f':'#5c6882';

  React.useEffect(function() {
    if (hasNotes) { generateSummary(); } else { setGenerated(true); }
  }, []);

  var generateSummary = async function() {
    setLoading(true);
    try {
      var p = 'Summarize these hiring notes about ' + candidate.name + ' in 3-5 professional sentences: ' + allRawNotes.slice(0, 5000);
      var res = await fetch('https://sncfmxqwpfxhztaxuhdu.supabase.co/functions/v1/claude-proxy', { method: 'POST', headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + SUPABASE_ANON_KEY }, body: JSON.stringify({ prompt: p, max_tokens: 600 }) });
      var d = await res.json();
      setSummary(d.text || '');
    } catch(e) { setSummary(''); }
    setLoading(false); setGenerated(true);
  };

  var NL = String.fromCharCode(10);
  var buildText = function(isSlack) {
    var B = isSlack ? '*' : '';
    var lines = [];
    lines.push(B + 'Candidate Brief: ' + candidate.name + B);
    lines.push((isSlack ? '*Role:* ' : 'Role: ') + (pos ? pos.title : '-'));
    lines.push((isSlack ? '*Stage:* ' : 'Stage: ') + (candidate.stage||'-') + ' | Score: ' + scoreStr);
    if (candidate.recommendation) { lines.push('Recommendation: ' + candidate.recommendation); }
    if (liUrl) { lines.push('LinkedIn: ' + liUrl); }
    lines.push('');
    var team = (candidate.interviewers||[]).map(function(iv){return iv.name + (iv.role ? ' (' + iv.role + ')' : '');}).join(', ');
    if (team) { lines.push(isSlack ? '*Interview Team*' : 'INTERVIEW TEAM'); lines.push(team); lines.push(''); }
    if (summary) { lines.push(isSlack ? '*Notes Summary*' : 'NOTES SUMMARY'); lines.push(summary); lines.push(''); }
    if (pos) {
      var scored = (pos.requirements||[]).filter(function(r){return (candidate.scores||{})[r.id]&&(candidate.scores||{})[r.id].score;});
      if (scored.length) {
        lines.push(isSlack ? '*Scorecard*' : 'SCORECARD');
        scored.forEach(function(req){ var s=(candidate.scores||{})[req.id]; lines.push('- ' + req.name + ': ' + scoreLabel(s.score) + ' (' + s.score + '/5)' + (s.note ? ' - ' + s.note : '')); });
        lines.push('');
      }
    }
    if (pos && pos.jd) {
      lines.push(isSlack ? '*Job Description*' : 'JOB DESCRIPTION');
      lines.push(pos.jd.slice(0, 3000));
    }
    return lines.join(NL);
  };

  var copyText = function(type) {
    navigator.clipboard.writeText(buildText(type==='slack')).then(function(){ setCopied(type); setTimeout(function(){setCopied('');},2500); });
  };

  return (

function LetterCard({ letter }) {
  const [expanded, setExpanded] = React.useState(false);
  var preview = letter.content ? letter.content.slice(0, 180).trim() + (letter.content.length > 180 ? '...' : '') : '';
  return (
    <div style={{border:'1px solid var(--border)',borderRadius:8,marginBottom:8,overflow:'hidden'}}>
      <div style={{display:'flex',alignItems:'center',gap:8,padding:'8px 12px',background:'var(--surface3)'}}>
        <span style={{fontSize:14}}>📝</span>
        <div style={{flex:1}}>
          <div style={{fontWeight:600,fontSize:13}}>{letter.author||'Unknown'}</div>
          <div style={{fontSize:10,color:'var(--muted)'}}>{letter.uploadedAt ? new Date(letter.uploadedAt).toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'}) : ''}</div>
        </div>
        <button onClick={function(){setExpanded(function(v){return !v;});}}
          style={{background:'none',border:'none',cursor:'pointer',fontSize:11,color:'var(--accent)',fontWeight:600}}>
          {expanded ? '▲ Collapse' : '▼ Read Letter'}
        </button>
      </div>
      {!expanded && preview && (
        <div style={{padding:'8px 12px',fontSize:12,color:'var(--muted)',lineHeight:1.5,fontStyle:'italic'}}>
          {preview}
        </div>
      )}
      {expanded && (
        <div style={{padding:'12px',fontSize:13,color:'var(--text2)',lineHeight:1.7,whiteSpace:'pre-wrap',background:'var(--surface)'}}>
          {letter.content}
        </div>
      )}
    </div>
  );
}

function CandidateExportModal({ candidates, positions, onClose }) {
  const [copied, setCopied] = useState('');
  var NL = String.fromCharCode(10);

  var buildEmail = function() {
    var lines = [];
    var date = new Date().toLocaleDateString('en-US',{month:'long',day:'numeric',year:'numeric'});
    lines.push('Candidate Pipeline — ' + date);
    lines.push('');
    candidates.forEach(function(c) {
      var pos = positions.find(function(p){return p.id===c.positionId;});
      var li = c.linkedIn ? (c.linkedIn.startsWith('http') ? c.linkedIn : 'https://' + c.linkedIn) : null;
      lines.push((c.name||'Unknown') + ' — ' + (pos?pos.title:'—') + ' — ' + (c.stage||'—'));
      if (li) lines.push('  LinkedIn: ' + li);
      lines.push('');
    });
    lines.push(candidates.length + ' candidate' + (candidates.length!==1?'s':'') + ' total');
    return lines.join(NL);
  };

  var buildSlack = function() {
    var lines = [];
    var date = new Date().toLocaleDateString('en-US',{month:'long',day:'numeric',year:'numeric'});
    lines.push('*:busts_in_silhouette: Candidate Pipeline — ' + date + '*');
    lines.push('');
    var byPosition = {};
    candidates.forEach(function(c) {
      var pos = positions.find(function(p){return p.id===c.positionId;});
      var key = pos ? pos.title : 'No Position';
      if (!byPosition[key]) byPosition[key] = [];
      byPosition[key].push(c);
    });
    Object.keys(byPosition).forEach(function(posTitle) {
      lines.push('*' + posTitle + '*');
      byPosition[posTitle].forEach(function(c) {
        var li = c.linkedIn ? (c.linkedIn.startsWith('http') ? c.linkedIn : 'https://' + c.linkedIn) : null;
        var line = '  • *' + (c.name||'Unknown') + '* · _' + (c.stage||'—') + '_';
        if (li) line += ' · ' + li;
        lines.push(line);
      });
      lines.push('');
    });
    lines.push('_' + candidates.length + ' candidate' + (candidates.length!==1?'s':'') + ' total_');
    return lines.join(NL);
  };

  var copy = function(type) {
    var text = type==='slack' ? buildSlack() : buildEmail();
    navigator.clipboard.writeText(text).then(function(){
      setCopied(type);
      setTimeout(function(){setCopied('');}, 2500);
    });
  };

  return (
    <div className="modal-overlay" onClick={function(e){e.target===e.currentTarget&&onClose();}}>
      <div className="modal" style={{maxWidth:620}}>
        <div className="modal-header">
          <div className="modal-title">📋 Export Candidate List</div>
          <button className="modal-close" onClick={onClose}>×</button>
        </div>
        <div className="modal-body">
          <div style={{display:'flex',gap:8,marginBottom:16}}>
            <button className="btn btn-sm" style={{flex:1,justifyContent:'center',background:'rgba(45,212,160,.1)',color:'#2dd4a0',border:'1px solid rgba(45,212,160,.3)',fontWeight:700}}
              onClick={function(){copy('email');}}>
              {copied==='email' ? '✅ Copied!' : '📧 Copy for Email'}
            </button>
            <button className="btn btn-sm" style={{flex:1,justifyContent:'center',background:'rgba(79,142,247,.1)',color:'var(--accent)',border:'1px solid rgba(79,142,247,.3)',fontWeight:700}}
              onClick={function(){copy('slack');}}>
              {copied==='slack' ? '✅ Copied!' : '💬 Copy for Slack'}
            </button>
          </div>

          {/* Preview */}
          <div style={{background:'var(--surface2)',border:'1px solid var(--border)',borderRadius:12,overflow:'hidden'}}>
            <div style={{padding:'10px 16px',background:'var(--surface3)',borderBottom:'1px solid var(--border)',display:'flex',alignItems:'center',justifyContent:'space-between'}}>
              <div style={{fontSize:11,fontWeight:700,color:'var(--muted)',textTransform:'uppercase',letterSpacing:'.07em'}}>Preview — {candidates.length} candidate{candidates.length!==1?'s':''}</div>
              <div style={{fontSize:10,color:'var(--muted)'}}>{new Date().toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'})}</div>
            </div>
            <div style={{padding:'14px 16px',display:'flex',flexDirection:'column',gap:8,maxHeight:400,overflowY:'auto'}}>
              {candidates.map(function(c) {
                var pos = positions.find(function(p){return p.id===c.positionId;});
                var li = c.linkedIn ? (c.linkedIn.startsWith('http') ? c.linkedIn : 'https://' + c.linkedIn) : null;
                return (
                  <div key={c.id} style={{display:'flex',alignItems:'center',gap:12,padding:'8px 10px',background:'var(--surface3)',borderRadius:8,flexWrap:'wrap'}}>
                    <div style={{width:28,height:28,borderRadius:'50%',background:'linear-gradient(135deg,var(--accent),var(--accent2))',display:'flex',alignItems:'center',justifyContent:'center',fontSize:11,fontWeight:700,color:'#fff',flexShrink:0}}>
                      {(c.name||'?').split(' ').map(function(n){return n[0];}).join('').slice(0,2).toUpperCase()}
                    </div>
                    <div style={{flex:1,minWidth:120}}>
                      <div style={{fontWeight:600,fontSize:13}}>{c.name}</div>
                      <div style={{fontSize:11,color:'var(--muted)'}}>{pos?pos.title:'—'}</div>
                    </div>
                    <span className={'badge ' + (STAGE_COLORS[c.stage]||'badge-gray')} style={{fontSize:11,flexShrink:0}}>{c.stage}</span>
                    {li
                      ? <a href={li} target="_blank" rel="noopener noreferrer"
                          style={{fontSize:11,color:'#0a66c2',fontWeight:600,textDecoration:'none',background:'rgba(10,102,194,.1)',padding:'2px 8px',borderRadius:20,flexShrink:0}}>
                          💼 LinkedIn
                        </a>
                      : <span style={{fontSize:11,color:'var(--muted)',flexShrink:0}}>No LinkedIn</span>
                    }
                  </div>
                );
              })}
            </div>
          </div>
          <div style={{fontSize:11,color:'var(--muted)',textAlign:'center',marginTop:10}}>
            List reflects current filters · Slack format uses linked mentions
          </div>
        </div>
      </div>
    </div>
  );
}

function CandidatesView({ candidates, setCandidates, positions, initialFilter, onFilterUsed, setView, setFilterInterviewCand }) {

  const [sharingCandidate, setSharingCandidate] = useState(null);

  const [showExport, setShowExport] = useState(false);
  const [filterPos, setFilterPos] = useState(initialFilter||'all');
  const [filterStage, setFilterStage] = useState('all');
  useEffect(()=>{ if(initialFilter&&initialFilter!=='all'){setFilterPos(initialFilter);onFilterUsed&&onFilterUsed();} },[initialFilter]);

  const filtered = candidates.filter(c=>
    (filterPos==='all'||c.positionId===filterPos) &&
    (filterStage==='all'||c.stage===filterStage)
  ).sort(function(a,b){
    var aRej = a.stage==='Rejected'||a.stage==='Hired' ? 1 : 0;
    var bRej = b.stage==='Rejected'||b.stage==='Hired' ? 1 : 0;

function ParsedProfileCard({ profile, onClear, onDismiss, onUpdate }) {
  const [collapsed, setCollapsed] = React.useState(true);
  const [cleaning, setCleaning] = React.useState(false);
  if (!profile) return null;
  var clearFn = onClear || onDismiss;

  const initials = profile.name ? profile.name.split(' ').map(function(n){return n[0];}).join('').slice(0,2).toUpperCase() : '?';

  var cleanProfile = async function() {
    setCleaning(true);
    try {
      var resp = await fetch('https://sncfmxqwpfxhztaxuhdu.supabase.co/functions/v1/claude-proxy', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + SUPABASE_ANON_KEY },
        body: JSON.stringify({
          prompt: 'Clean and normalize this candidate profile JSON. Fix date formats to be consistent (e.g. "Jan 2020 - Mar 2022"), clean up any garbled text or OCR artifacts, improve the summary to be 2-3 polished professional sentences, ensure bullet points are clean and parallel. Sort workHistory array from most recent to oldest. Return ONLY the corrected JSON object with the same fields, no markdown, no explanation. Profile: ' + JSON.stringify(profile),
          max_tokens: 2000
        })
      });
      var data = await resp.json();
      if (data.text && onUpdate) {
        var text = data.text.replace(/```json|```/g,'').trim();
        var start = text.indexOf('{');
        var end = text.lastIndexOf('}');
        if (start !== -1 && end !== -1) {
          var cleaned = JSON.parse(text.slice(start, end+1));
          onUpdate(cleaned);
        }
      }
    } catch(e) { alert('Could not clean profile: ' + e.message); }
    setCleaning(false);
  };

  return (
    <div style={{border:'1px solid var(--accent)',borderRadius:12,marginBottom:16,overflow:'hidden',background:'var(--surface2)'}}>
      {/* Card header */}
      <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',padding:'12px 14px',background:'rgba(79,142,247,.07)',borderBottom: collapsed ? 'none' : '1px solid var(--border)'}}>
        <div style={{display:'flex',alignItems:'center',gap:10}}>
          <div style={{width:36,height:36,borderRadius:'50%',background:'linear-gradient(135deg,var(--accent),var(--accent2))',display:'flex',alignItems:'center',justifyContent:'center',fontSize:13,fontWeight:700,color:'#fff',flexShrink:0}}>
            {initials}
          </div>
          <div>
            <div style={{fontWeight:700,fontSize:14}}>{profile.name || 'Candidate'}</div>
            <div style={{fontSize:11,color:'var(--accent)',fontWeight:500}}>
              {[profile.currentTitle, profile.currentCompany].filter(Boolean).join(' · ') || 'Profile extracted'}
            </div>
          </div>
        </div>
        <div style={{display:'flex',gap:6,alignItems:'center'}}>
          <div style={{fontSize:10,color:'var(--accent3)',fontWeight:600,background:'rgba(45,212,160,.1)',padding:'3px 8px',borderRadius:20}}>✨ AI Generated</div>
          {onUpdate && (
            <button className="btn btn-purple btn-xs" onClick={cleanProfile} disabled={cleaning}
              title="Fix date formats, clean up text, polish summary"
              style={{display:'flex',alignItems:'center',gap:4}}>
              {cleaning
                ? <><span style={{display:'inline-block',width:8,height:8,border:'2px solid rgba(255,255,255,.3)',borderTopColor:'#fff',borderRadius:'50%',animation:'spin 0.7s linear infinite'}}/> Cleaning...</>
                : '🧹 Clean Profile'}
            </button>
          )}
          <button className="btn btn-ghost btn-xs" onClick={function(){setCollapsed(function(c){return !c;})}} style={{color:'var(--muted)'}}>
            {collapsed ? '▼ Expand' : '▲ Collapse'}
          </button>
          {clearFn && <button className="btn btn-danger btn-xs" onClick={clearFn} title="Clear profile">🗑 Clear</button>}
        </div>
      </div>

      {!collapsed && (
        <div style={{padding:'14px 16px',display:'flex',flexDirection:'column',gap:14}}>

          {/* Summary */}
          {profile.summary && (
            <div>
              <div style={{fontSize:10,fontWeight:700,color:'var(--muted)',textTransform:'uppercase',letterSpacing:'.08em',marginBottom:5}}>Summary</div>
              <div style={{fontSize:13,color:'var(--text2)',lineHeight:1.65}}>{profile.summary}</div>
            </div>
          )}

          {/* Work History */}
          {profile.workHistory && profile.workHistory.length > 0 && (
            <div>
              <div style={{fontSize:10,fontWeight:700,color:'var(--muted)',textTransform:'uppercase',letterSpacing:'.08em',marginBottom:8}}>Experience</div>
              <div style={{display:'flex',flexDirection:'column',gap:10}}>
                {profile.workHistory.map(function(job, i) {
                  return (
                    <div key={i} style={{display:'flex',gap:12}}>
                      <div style={{width:2,background:'var(--border2)',borderRadius:2,flexShrink:0,marginTop:4}}/>
                      <div style={{flex:1}}>
                        <div style={{display:'flex',alignItems:'baseline',justifyContent:'space-between',gap:8,flexWrap:'wrap'}}>
                          <div>
                            <span style={{fontWeight:600,fontSize:13}}>{job.title}</span>
                            {job.company && <span style={{fontSize:13,color:'var(--accent)',marginLeft:6}}>@ {job.company}</span>}
                          </div>
                          {job.dates && <span style={{fontSize:11,color:'var(--muted)',flexShrink:0}}>{job.dates}</span>}
                        </div>
                        {job.bullets && job.bullets.length > 0 && (
                          <ul style={{marginTop:4,paddingLeft:14,display:'flex',flexDirection:'column',gap:2}}>
                            {job.bullets.map(function(b, bi) {
                              return <li key={bi} style={{fontSize:12,color:'var(--text2)',lineHeight:1.5}}>{b}</li>;
                            })}
                          </ul>
                        )}
                      </div>
                    </div>
                  );
                })}
              </div>
            </div>
          )}

          {/* Education */}
          {profile.education && profile.education.length > 0 && (
            <div>
              <div style={{fontSize:10,fontWeight:700,color:'var(--muted)',textTransform:'uppercase',letterSpacing:'.08em',marginBottom:6}}>Education</div>
              <div style={{display:'flex',flexDirection:'column',gap:5}}>
                {profile.education.map(function(ed, i) {
                  return (
                    <div key={i} style={{display:'flex',alignItems:'baseline',gap:6,flexWrap:'wrap'}}>
                      <span style={{fontSize:13,fontWeight:600}}>{ed.institution}</span>
                      {ed.degree && <span style={{fontSize:12,color:'var(--text2)'}}>— {ed.degree}</span>}
                      {ed.year && <span style={{fontSize:11,color:'var(--muted)',marginLeft:'auto'}}>{ed.year}</span>}
                    </div>
                  );
                })}
              </div>
            </div>
          )}

          {/* Skills */}
          {profile.skills && profile.skills.length > 0 && (
            <div>
              <div style={{fontSize:10,fontWeight:700,color:'var(--muted)',textTransform:'uppercase',letterSpacing:'.08em',marginBottom:6}}>Skills</div>
              <div style={{display:'flex',flexWrap:'wrap',gap:5}}>
                {profile.skills.map(function(sk, i) {
                  return (
                    <span key={i} style={{fontSize:11,fontWeight:500,padding:'3px 9px',borderRadius:20,background:'var(--surface3)',border:'1px solid var(--border)',color:'var(--text2)'}}>{sk}</span>
                  );
                })}
              </div>
            </div>
          )}

        </div>
      )}
    </div>
  );
}
